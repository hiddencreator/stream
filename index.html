<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YStream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.12/dist/shaka-player.compiled.js"></script>
  <style>
    :root {
      --bg: #080a0f;
      --card: #121620;
      --card-hover: #191f2e;
      --active-bg: #13223b;
      --active-border: #2563eb;
      --accent: #e50914;
      --text: #f3f5f8;
      --muted: #8e98a8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .player-stage {
      position: relative;
      background: #000;
      border-bottom: 1px solid var(--border);
    }
    .video-box {
      position: relative;
      width: 100%;
      background: #000;
    }
    video {
      width: 100%;
      max-height: 44vh;
      aspect-ratio: 16 / 9;
      display: block;
      background: #000;
    }
    .player-stage:fullscreen video,
    .player-stage:-webkit-full-screen video {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
    }

    /* Clean icon-only button for Live TV fullscreen */
    .fs-icon-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 12;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(10, 13, 20, 0.72);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
    }
    .fs-icon-btn.show { display: inline-flex; }
    .fs-icon-btn:hover, .fs-icon-btn:focus-visible {
      background: var(--accent);
      border-color: #fff;
      outline: 2px solid #fff;
    }

    .empty-notice {
      display: none;
      background: #1a1114;
      border-top: 1px solid rgba(229, 9, 20, 0.45);
      color: #ffd6da;
      padding: 9px 14px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .empty-notice.show { display: block; }

    /* VOD controls (only shown for Telegram YPlay movies) */
    .vod-bar {
      background: #0e121b;
      padding: 9px 14px;
      display: none;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border);
    }
    .vod-bar.show { display: flex; }
    .vod-title { font-size: 0.9rem; font-weight: 700; }
    .vod-sub { font-size: 0.72rem; color: var(--muted); }
    .vod-seek {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .vod-btns {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    button {
      background: #1a2030;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover, button:focus-visible {
      background: #252e44;
      border-color: #fff;
      outline: 2px solid #fff;
    }
    button.red { background: var(--accent); border-color: var(--accent); color: #fff; }

    .container { max-width: 960px; margin: 0 auto; padding: 14px; }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 10px;
    }
    .sec-title { font-size: 1.08rem; font-weight: 700; }
    .sec-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .live-pill {
      background: #17253f;
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.35);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 7px;
    }

    .channel-list { display: flex; flex-direction: column; gap: 9px; }
    .ch-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }
    .ch-card:hover, .ch-card:focus-visible {
      background: var(--card-hover);
      outline: 2px solid #fff;
    }
    .ch-card.active {
      background: var(--active-bg);
      border-color: var(--active-border);
    }
    .ch-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .ch-logo-box {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .ch-logo-box img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
    .ch-name { font-size: 0.95rem; font-weight: 700; }
    .ch-meta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

    .anim-dots {
      display: none;
      align-items: center;
      gap: 4px;
      padding-right: 6px;
    }
    .ch-card.active .anim-dots { display: inline-flex; }
    .anim-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #60a5fa;
      animation: dotWave 1.1s ease-in-out infinite;
    }
    .anim-dots span:nth-child(2) { animation-delay: 0.18s; }
    .anim-dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dotWave {
      0%, 100% { transform: scale(0.65); opacity: 0.35; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    .yplay-list { display: flex; flex-direction: column; gap: 8px; }
    .yp-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .yp-card:hover, .yp-card:focus-visible {
      background: var(--card-hover);
      outline: 2px solid #fff;
    }
    .yp-card.active {
      background: var(--active-bg);
      border-color: var(--active-border);
    }
    .yp-title { font-size: 0.9rem; font-weight: 700; word-break: break-word; }
    .yp-meta { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="player-stage" id="stage">
    <div class="video-box">
      <video id="video" playsinline preload="auto"></video>
      <button id="fsIconBtn" class="fs-icon-btn" title="Fullscreen" onclick="toggleLiveFullscreen()">&#x26F6;</button>
    </div>

    <div id="emptyNotice" class="empty-notice"></div>

    <div id="vodBar" class="vod-bar">
      <div>
        <div id="vodTitle" class="vod-title">Movie</div>
        <div id="vodSub" class="vod-sub">Ready</div>
      </div>
      <div class="vod-seek">
        <span id="curTxt">00:00</span>
        <input id="seekInput" type="range" min="0" max="1000" value="0" step="1" />
        <span id="durTxt">00:00</span>
      </div>
      <div class="vod-btns">
        <div class="btn-grp">
          <button id="vodPlayBtn" class="red" onclick="toggleVodPlay()">Play</button>
          <button onclick="seekOffset(-10)">-10s</button>
          <button onclick="seekOffset(10)">+10s</button>
          <button onclick="playNextYPlay()">Next</button>
        </div>
        <div class="btn-grp">
          <button onclick="toggleMute()">Mute</button>
          <button onclick="toggleLiveFullscreen()">&#x26F6;</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="sec-head">
      <div>
        <div class="sec-title">Live Channels</div>
        <div class="sec-sub">Tap any channel to start watching</div>
      </div>
      <div class="live-pill">6 LIVE</div>
    </div>
    <div id="channelList" class="channel-list"></div>

    <div class="sec-head" style="margin-top:22px;">
      <div>
        <div class="sec-title">YPlay Movies</div>
        <div class="sec-sub">Telegram bot queue (first movie auto-loaded)</div>
      </div>
      <button onclick="fetchYPlay(true)">Refresh</button>
    </div>
    <div id="yplayList" class="yplay-list"></div>
  </div>

  <script>
    const BACKEND_URL = "https://finances-companies-suspected-simulations.trycloudflare.com";

    const CHANNELS = [
      {
        id: "suntv",
        num: "#01",
        name: "Sun TV",
        cat: "Entertainment • Live",
        type: "hls",
        url: "https://d2px1d6ssc60fw.cloudfront.net/SunTV/SunTV-HDR10-IN-index.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/3/3e/Sun_TV_logo.svg/240px-Sun_TV_logo.svg.png"
      },
      {
        id: "zeetamil",
        num: "#02",
        name: "Zee Tamil HD",
        cat: "Entertainment • HD",
        type: "hls",
        url: "https://da86m1sqpm3o0.cloudfront.net/28072023/smil:zeetamil1.smil/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/51/Zee_Tamil_logo.svg/240px-Zee_Tamil_logo.svg.png"
      },
      {
        id: "colorstamil",
        num: "#03",
        name: "Colors Tamil HD",
        cat: "Entertainment • HD",
        type: "hls",
        url: "https://da86m1sqpm3o0.cloudfront.net/28072023/smil:colorstamilhd11.smil/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/2/2f/Colors_Tamil_logo.svg/240px-Colors_Tamil_logo.svg.png"
      },
      {
        id: "makkaltv",
        num: "#04",
        name: "Makkal TV",
        cat: "General • Live",
        type: "hls",
        url: "https://5k8q87azdy4v-hls-live.wmncdn.net/MAKKAL/271ddf829afeece44d8732757fba1a66.sdp/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/8/87/Makkal_TV_logo.png/240px-Makkal_TV_logo.png"
      },
      {
        id: "historytv18",
        num: "#05",
        name: "History TV18 HD",
        cat: "Infotainment • HD",
        type: "dash-clearkey",
        url: "https://login.bheem.tv/bpk-tv/22652/output/index.mpd",
        kid: "c6cb0bcbeac25fb286fed851e41de38c",
        key: "955c54f2cac8783fafccae5e5f9cdf8d",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/History_Channel_logo.svg/240px-History_Channel_logo.svg.png"
      },
      {
        id: "discoverytamil",
        num: "#06",
        name: "Discovery Tamil",
        cat: "Infotainment • HD",
        type: "dash-clearkey",
        url: "https://login.bheem.tv/bpk-tv/22652/output/index.mpd",
        kid: "c6cb0bcbeac25fb286fed851e41de38c",
        key: "955c54f2cac8783fafccae5e5f9cdf8d",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Discovery_Channel_logo_2019.svg/240px-Discovery_Channel_logo_2019.svg.png"
      }
    ];

    const stage = document.getElementById("stage");
    const video = document.getElementById("video");
    const fsIconBtn = document.getElementById("fsIconBtn");
    const emptyNotice = document.getElementById("emptyNotice");
    const vodBar = document.getElementById("vodBar");
    const vodTitle = document.getElementById("vodTitle");
    const vodSub = document.getElementById("vodSub");
    const vodPlayBtn = document.getElementById("vodPlayBtn");
    const seekInput = document.getElementById("seekInput");
    const curTxt = document.getElementById("curTxt");
    const durTxt = document.getElementById("durTxt");

    let hls = null;
    let shakaPlayer = null;
    let activeChannelId = "suntv";
    let yplayItems = [];
    let activeYPlayIdx = -1;
    let isVod = false;
    let seeking = false;
    let redirectTimer = null;
    let redirectCountdown = 0;

    function clearRedirectTimer() {
      if (redirectTimer) {
        clearInterval(redirectTimer);
        redirectTimer = null;
      }
      emptyNotice.classList.remove("show");
      emptyNotice.textContent = "";
    }

    function setMode(vod) {
      isVod = vod;
      vodBar.classList.toggle("show", vod);
      fsIconBtn.classList.toggle("show", !vod);
    }

    async function cleanupPlayers() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      if (shakaPlayer) {
        try { await shakaPlayer.destroy(); } catch (_) {}
        shakaPlayer = null;
      }
    }

    function fallbackToNextChannel(currentId) {
      const idx = CHANNELS.findIndex((c) => c.id === currentId);
      for (let step = 1; step < CHANNELS.length; step++) {
        const candidate = CHANNELS[(idx + step) % CHANNELS.length];
        if (candidate.url) {
          playChannel(candidate, true, false);
          return;
        }
      }
    }

    async function playChannel(ch, autoPlay = true, allowFallback = true) {
      clearRedirectTimer();
      await cleanupPlayers();
      activeChannelId = ch.id;
      activeYPlayIdx = -1;
      setMode(false);
      renderChannels();
      renderYPlay();

      if (ch.type === "dash-clearkey" && window.shaka && shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player();
        await shakaPlayer.attach(video);
        shakaPlayer.configure({
          drm: { clearKeys: { [ch.kid]: ch.key } },
          streaming: { bufferingGoal: 4, rebufferingGoal: 1, jumpLargeGaps: true }
        });
        try {
          await shakaPlayer.load(ch.url);
          if (autoPlay) video.play().catch(() => {});
        } catch (_) {
          if (allowFallback) fallbackToNextChannel(ch.id);
        }
        return;
      }

      if (ch.url.includes(".m3u8") && window.Hls && window.Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxBufferLength: 5,
          maxMaxBufferLength: 8,
          backBufferLength: 5,
          manifestLoadingTimeOut: 5000,
          fragLoadingTimeOut: 5000
        });
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (autoPlay) video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal && allowFallback) fallbackToNextChannel(ch.id);
        });
      } else {
        video.src = ch.url;
        video.load();
        if (autoPlay) video.play().catch(() => {});
      }
    }

    async function loadYPlay(idx, autoPlay = false) {
      if (idx < 0 || idx >= yplayItems.length) return;
      clearRedirectTimer();
      await cleanupPlayers();
      activeChannelId = "";
      activeYPlayIdx = idx;
      setMode(true);
      renderChannels();
      renderYPlay();

      const item = yplayItems[idx];
      vodTitle.textContent = item.title;
      vodSub.textContent = item.cached ? "Cached • Ready" : "Pre-caching • Ready";

      video.src = `${BACKEND_URL}/api/yplay/stream/${idx}`;
      video.load();
      if (autoPlay) video.play().catch(() => {});
    }

    function triggerEmptyQueueNotice() {
      clearRedirectTimer();
      redirectCountdown = 30;
      emptyNotice.classList.add("show");
      emptyNotice.textContent = `No movie in the queue — first send a movie to the bot. Switching to Live TV in ${redirectCountdown}s...`;
      redirectTimer = setInterval(() => {
        if (yplayItems.length > 0) {
          clearRedirectTimer();
          loadYPlay(0, true);
          return;
        }
        redirectCountdown -= 1;
        if (redirectCountdown <= 0) {
          clearRedirectTimer();
          playChannel(CHANNELS[0], true, true);
        } else {
          emptyNotice.textContent = `No movie in the queue — first send a movie to the bot. Switching to Live TV in ${redirectCountdown}s...`;
        }
      }, 1000);
    }

    function playNextYPlay() {
      if (!yplayItems.length) {
        triggerEmptyQueueNotice();
        return;
      }
      const next = activeYPlayIdx + 1 < yplayItems.length ? activeYPlayIdx + 1 : 0;
      loadYPlay(next, true);
    }

    function toggleVodPlay() {
      if (!yplayItems.length) {
        triggerEmptyQueueNotice();
        return;
      }
      if (!isVod) {
        loadYPlay(0, true);
        return;
      }
      if (video.paused) video.play().catch(() => {});
      else video.pause();
    }

    function seekOffset(sec) {
      if (!isVod || !isFinite(video.duration)) return;
      video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + sec));
    }

    function toggleMute() {
      video.muted = !video.muted;
    }

    async function toggleLiveFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (stage.requestFullscreen) await stage.requestFullscreen();
          else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock("landscape").catch(() => {});
          }
        } else {
          if (document.exitFullscreen) await document.exitFullscreen();
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        }
      } catch (_) {}
    }

    function fmt(t) {
      if (!isFinite(t) || t < 0) return "00:00";
      return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
    }

    video.addEventListener("error", () => {
      if (!isVod && activeChannelId) fallbackToNextChannel(activeChannelId);
    });
    video.addEventListener("play", () => { vodPlayBtn.textContent = "Pause"; });
    video.addEventListener("pause", () => { vodPlayBtn.textContent = "Play"; });
    video.addEventListener("timeupdate", () => {
      if (!isVod || seeking || !isFinite(video.duration) || video.duration <= 0) return;
      seekInput.value = String(Math.round((video.currentTime / video.duration) * 1000));
      curTxt.textContent = fmt(video.currentTime);
      durTxt.textContent = fmt(video.duration);
    });
    video.addEventListener("ended", () => {
      if (isVod && activeYPlayIdx + 1 < yplayItems.length) {
        loadYPlay(activeYPlayIdx + 1, true);
      }
    });

    seekInput.addEventListener("input", () => { seeking = true; });
    seekInput.addEventListener("change", () => {
      if (isVod && isFinite(video.duration) && video.duration > 0) {
        video.currentTime = (Number(seekInput.value) / 1000) * video.duration;
      }
      seeking = false;
    });

    function renderChannels() {
      const box = document.getElementById("channelList");
      box.innerHTML = CHANNELS.map((ch) => {
        const active = ch.id === activeChannelId ? "ch-card active" : "ch-card";
        return `
          <div class="${active}" tabindex="0" onclick='playChannelById("${ch.id}")' onkeydown='if(event.key==="Enter")playChannelById("${ch.id}")'>
            <div class="ch-left">
              <div class="ch-logo-box">
                <img src="${esc(ch.logo)}" alt="${esc(ch.name)}" onerror="this.style.display='none'" />
              </div>
              <div>
                <div class="ch-name">${esc(ch.name)}</div>
                <div class="ch-meta">${esc(ch.num)} • ${esc(ch.cat)}</div>
              </div>
            </div>
            <div class="anim-dots"><span></span><span></span><span></span></div>
          </div>
        `;
      }).join("");
    }

    function playChannelById(id) {
      const ch = CHANNELS.find((c) => c.id === id);
      if (ch) playChannel(ch, true, true);
    }

    function renderYPlay() {
      const box = document.getElementById("yplayList");
      if (!yplayItems.length) {
        box.innerHTML = `<div class="yp-card" tabindex="0" onclick="triggerEmptyQueueNotice()"><div><div class="yp-title">No movie in the queue</div><div class="yp-meta">First send a movie to the bot</div></div></div>`;
        return;
      }
      box.innerHTML = yplayItems.map((m, i) => {
        const mb = m.file_size ? `${(m.file_size / (1024 * 1024)).toFixed(0)} MB` : "Video";
        const cls = i === activeYPlayIdx ? "yp-card active" : "yp-card";
        return `
          <div class="${cls}" tabindex="0" onclick="loadYPlay(${i}, true)" onkeydown="if(event.key==='Enter')loadYPlay(${i},true)">
            <div>
              <div class="yp-title">${esc(m.title)}</div>
              <div class="yp-meta">#${i + 1} • ${mb} • ${m.cached ? "Ready" : "Caching"}</div>
            </div>
            <button class="red" onclick="event.stopPropagation();loadYPlay(${i},true)">Play</button>
          </div>
        `;
      }).join("");
    }

    async function fetchYPlay(forceFirst = false) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/yplay/library?t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();
        const prevFirst = yplayItems[0] ? yplayItems[0].id : null;
        yplayItems = Array.isArray(data.items) ? data.items : [];
        renderYPlay();

        if (yplayItems.length > 0) {
          clearRedirectTimer();
          if (forceFirst || activeYPlayIdx < 0 || prevFirst !== yplayItems[0].id) {
            loadYPlay(0, false);
          }
        }
      } catch (_) {}
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    renderChannels();
    playChannel(CHANNELS[0], true, true);
    fetchYPlay(true);
    setInterval(() => fetchYPlay(false), 5000);
  </script>
</body>
</html>
