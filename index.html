<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>YStream</title>
  <link rel="preconnect" href="https://ystream.hiddencreator-account.workers.dev" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.12/dist/shaka-player.compiled.js"></script>
  <style>
    :root {
      --drawer-bg: rgba(11, 14, 21, 0.96);
      --card: rgba(255, 255, 255, 0.055);
      --active-bg: rgba(255, 255, 255, 0.14);
      --accent: #e50914;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-focus-ring-color: transparent !important;
      outline: none !important;
    }

    html:focus, body:focus, div:focus, video:focus, aside:focus,
    html:focus-visible, body:focus-visible, div:focus-visible, video:focus-visible, aside:focus-visible {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }

    .hidden {
      display: none !important;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      user-select: none;
    }

    /* 100% Fullscreen Stage */
    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
      border: 0 !important;
    }

    /* Simple & Elegant Loading Screen */
    .loading-stage {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #07090e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .loading-stage.show { opacity: 1; }

    .sleek-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.14);
      border-top-color: #ffffff;
      animation: spinRing 0.75s linear infinite;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    .load-title {
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      font-weight: 700;
      color: #f8fafc;
      text-align: center;
      max-width: 80vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .load-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: -6px;
    }

    /* Exit Toast (Double-Back to Exit) */
    .exit-toast {
      position: fixed;
      bottom: 34px;
      left: 50%;
      transform: translate3d(-50%, 10px, 0);
      z-index: 80;
      background: rgba(16, 20, 28, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 99px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .exit-toast.show {
      opacity: 1;
      transform: translate3d(-50%, 0, 0);
    }

    /* Subtitle Overlay */
    .sub-overlay {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 15%;
      z-index: 12;
      text-align: center;
      pointer-events: none;
      display: none;
    }
    .sub-overlay.show { display: block; }
    .sub-text {
      display: inline-block;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: clamp(0.9rem, 2.2vw, 1.3rem);
      font-weight: 600;
      line-height: 1.38;
      padding: 5px 14px;
      border-radius: 8px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.95);
      white-space: pre-line;
    }

    /* Double-Tap Seek Pill */
    .seek-flash {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(14, 18, 26, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 11px 18px;
      border-radius: 99px;
      z-index: 18;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }
    .seek-flash.left { left: 12%; }
    .seek-flash.right { right: 12%; }
    .seek-flash.show { opacity: 1; }

    /* Error Overlay */
    .player-error {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: rgba(6, 9, 16, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .player-error.show { opacity: 1; pointer-events: auto; }
    .err-card {
      max-width: 380px;
      width: 100%;
      background: #141925;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .err-title { font-size: 1.05rem; font-weight: 800; color: #fff; }
    .err-msg { font-size: 0.84rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .err-actions { margin-top: 16px; display: flex; justify-content: center; gap: 10px; }
    .err-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      border: 1.5px solid transparent;
      cursor: pointer;
    }

    /* Unified Fullscreen Player HUD (Shows & Hides Everything Together) */
    .hud {
      position: absolute;
      inset: 0;
      z-index: 16;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.72) 0%,
        rgba(0, 0, 0, 0.0) 24%,
        rgba(0, 0, 0, 0.0) 68%,
        rgba(0, 0, 0, 0.84) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 2.8vw, 28px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      will-change: opacity;
    }

    .hud.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Top Bar: Settings Icon + Title (YPlay) + Dish Channel Card (Live TV) */
    .hud-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .hud-top-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.07) 100%);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .hud-meta { min-width: 0; }

    .hud-title {
      font-size: clamp(0.98rem, 2.2vw, 1.32rem);
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-sub {
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    /* Big DTH Dish Channel Banner (Unified inside HUD) */
    .dish-osd {
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(180deg, rgba(22, 26, 36, 0.94) 0%, rgba(10, 13, 20, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7);
      padding: 10px 18px;
      border-radius: 16px;
      flex-shrink: 0;
    }

    .dish-num {
      font-size: clamp(1.85rem, 3.6vw, 2.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.5px;
      color: #fff;
      font-variant-numeric: tabular-nums;
      padding-right: 14px;
      border-right: 1px solid rgba(255, 255, 255, 0.16);
    }

    .dish-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .dish-name {
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      font-weight: 800;
      color: #fff;
    }

    .dish-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* Center Play/Pause Button (YPlay only) */
    .center-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(15, 18, 26, 0.78) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    /* Bottom Controls & Custom YouTube Progress Bar */
    .hud-bottom {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .yt-progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .time-lbl {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
      min-width: 44px;
    }
    .time-lbl.end { text-align: right; }

    /* Custom Sleek YouTube Progress Track */
    .yt-track-wrap {
      position: relative;
      flex: 1;
      height: 32px;
      display: flex;
      align-items: center;
      cursor: pointer;
      border-radius: 99px;
      padding: 0 8px;
      border: 1.5px solid transparent;
      transition: background 0.16s ease, border-color 0.16s ease;
    }

    .yt-track-bg {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.26);
      overflow: visible;
      transition: height 0.15s ease;
    }

    .yt-track-wrap:focus-visible .yt-track-bg,
    .yt-track-wrap.scrubbing .yt-track-bg {
      height: 7px;
      background: rgba(255, 255, 255, 0.38);
    }

    .yt-track-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #ff2a36 0%, #ff5a63 100%);
    }

    .yt-track-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ff2a36;
      border: 2px solid #fff;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .yt-track-wrap:focus-visible .yt-track-thumb {
      transform: translate(-50%, -50%) scale(1.18);
    }

    .yt-track-wrap.scrubbing .yt-track-thumb {
      transform: translate(-50%, -50%) scale(1.42);
      background: #fff;
      border-color: #ff2a36;
    }

    .scrub-bubble {
      position: absolute;
      bottom: 30px;
      left: 0%;
      transform: translateX(-50%);
      background: #121620;
      border: 1px solid rgba(255, 255, 255, 0.34);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease;
    }

    .yt-track-wrap.scrubbing .scrub-bubble {
      opacity: 1;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-grp {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.07) 100%);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 11px;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    /* Popover Menus */
    .pop-wrap { position: relative; }

    .pop-menu {
      position: absolute;
      bottom: 46px;
      right: 0;
      background: #10141e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 126px;
      max-height: 220px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 40;
    }

    .pop-menu.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .pop-opt {
      width: 100%;
      text-align: center;
      background: transparent;
      border: 1.5px solid transparent;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .pop-opt.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Left Slide-Over Side Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.62);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .side-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(390px, 86vw);
      z-index: 60;
      background: var(--drawer-bg);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 18px 0 42px rgba(0, 0, 0, 0.78);
      display: flex;
      flex-direction: column;
      transform: translate3d(-102%, 0, 0);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .side-drawer.open { transform: translate3d(0, 0, 0); }

    .drawer-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .drawer-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-brand {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      color: #fff;
    }

    .drawer-brand span { color: var(--accent); }

    .drawer-hint { font-size: 0.72rem; color: var(--muted); }

    .drawer-tabs { display: flex; gap: 8px; }

    .d-tab {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid transparent;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .d-tab.active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .d-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    .drawer-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .d-item {
      background: var(--card);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .d-item.active {
      background: var(--active-bg);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .d-item-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }

    .ch-logo {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: #161c28;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .ch-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 2;
    }

    .ch-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: #fff;
      z-index: 1;
    }

    .yp-badge {
      width: 44px;
      height: 54px;
      border-radius: 9px;
      background: linear-gradient(160deg, #1e2430 0%, #0f131a 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 3px 4px;
      flex-shrink: 0;
      color: #fff;
    }

    .d-item.active .yp-badge {
      background: linear-gradient(160deg, #dc2626 0%, #7f1d1d 100%);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .yp-num {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.45);
    }

    .d-info { min-width: 0; flex: 1; }

    .d-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .d-meta {
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .d-tag {
      font-size: 0.66rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }

    .d-tag.live {
      background: rgba(229, 9, 20, 0.28);
      color: #fca5a5;
    }

    /* Glossy Fade + Minimal White Border Focus */
    .icon-btn:focus-visible,
    .icon-btn:hover,
    .ctrl-btn:focus-visible,
    .ctrl-btn:hover,
    .pop-opt:focus-visible,
    .pop-opt:hover,
    .d-tab:focus-visible,
    .d-tab:hover,
    .d-item:focus-visible,
    .d-item:hover,
    .err-btn:focus-visible,
    .err-btn:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.11) 100%) !important;
      border-color: rgba(255, 255, 255, 0.85) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 6px 18px rgba(0, 0, 0, 0.45);
      transform: scale(1.04);
    }

    .center-play-btn:focus-visible,
    .center-play-btn:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.12) 100%) !important;
      border-color: rgba(255, 255, 255, 0.85) !important;
    }

    .yt-track-wrap:focus-visible {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.72);
    }

    .yt-track-wrap.scrubbing {
      background: rgba(229, 9, 20, 0.16);
      border-color: #ffffff;
    }

    @keyframes clickBounce {
      0% { transform: scale(1.04); }
      40% { transform: scale(0.92); }
      75% { transform: scale(1.08); }
      100% { transform: scale(1.04); }
    }

    .click-bounce {
      animation: clickBounce 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" tabindex="-1">
    <video id="video" tabindex="-1" playsinline preload="auto" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>

    <!-- Simple & Elegant Loading Screen -->
    <div id="loadingStage" class="loading-stage show">
      <div class="sleek-ring"></div>

    function armHistoryAnchor() {
      try {
        history.pushState({ ystreamAnchor: Date.now() }, "");

    function showExitToast() {
      exitConfirmReady = true;
      exitToast.classList.add("show");
      clearTimeout(exitToastTimer);
      exitToastTimer = setTimeout(() => {
        exitConfirmReady = false;
        exitToast.classList.remove("show");
      }, 2200);
    }

    function processBackAction() {
      const now = Date.now();
      if (now - lastBackTime < 140) return true;
      lastBackTime = now;

      if (isScrubbing) {
        exitScrubMode(false);
        progressBar.focus({ preventScroll: true });
        return true;
      }
      if (hasOpenPop()) {
        const openMenu = document.querySelector(".pop-menu.open");
        const trigger = openMenu ? openMenu.parentElement.querySelector("button") : null;
        closeAllPops();
        if (trigger) trigger.focus({ preventScroll: true });
        resetHudTimer();
        return true;
      }
      if (drawerOpen) {
        closeDrawer(true);
        return true;
      }
      if (isHudVisible()) {
        hideHud();
        return true;
      }

      /* Pure Fullscreen: Require 2nd Back Press within 2.2s to Exit */
      if (!exitConfirmReady) {
        showExitToast();
        return true;
      }
      return false; // Allow real exit on 2nd Back press
    }

    window.addEventListener("popstate", () => {
      const intercepted = processBackAction();
      if (intercepted) {
        armHistoryAnchor();
      }

          const gbStr = fmtGB(m.file_size);
          const durStr = fmtDurShort(m.duration);
          return `
            <div class="d-item ${isCur ? "active" : ""}" tabindex="0" onclick="triggerBounce(this); pickMovie(${i});">
              <div class="d-item-left">
                <div class="yp-badge">
                  ${ICONS.cinema}
                  <span class="yp-num">#${num}</span>
                </div>
                <div class="d-info">
                  <div class="d-title">${esc(m.title)}</div>
                  <div class="d-meta">
                    ${isCur ? `<span class="d-tag live">PLAYING</span>` : ""}
                    <span class="d-tag">${esc(qStr)}</span>
                    <span class="d-tag">${esc(gbStr)}</span>
                    ${durStr ? `<span>${esc(durStr)}</span>` : ""}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join("");
      }
    }

    function pickChannel(id) {
      const ch = CHANNELS.find((c) => c.id === id);
      if (!ch) return;
      wasPlayingBeforeDrawer = false;
      closeDrawer(false);
      playChannel(ch, true, true);
    }

    function pickMovie(idx) {
      wasPlayingBeforeDrawer = false;
      closeDrawer(false);
      loadYPlay(idx, true);
    }

    /* Mode Configuration: Live TV vs YPlay */
    function configureHudMode(vod) {
      isLive = !vod;
      dishOsd.classList.toggle("hidden", vod);
      hudMeta.classList.toggle("hidden", !vod);
      centerPlayBtn.classList.toggle("hidden", !vod);
      progressRow.classList.toggle("hidden", !vod);
      nextBtn.classList.toggle("hidden", !(vod && yplayItems.length > 1));
      muteBtn.classList.toggle("hidden", !vod);
      speedWrap.classList.toggle("hidden", !vod);

      if (!vod) {
        subWrap.classList.add("hidden");
        subOverlay.classList.remove("show");
        updateLiveAudioUi();
        updateLiveQualUi();
      } else {
        qualWrap.classList.remove("hidden");
        renderVodQualMenu();
      }
    }

    /* Live TV Audio (Shown ONLY when >= 2 languages exist) */
    function normLangName(raw, idx) {
      const k = String(raw || "").trim().toLowerCase();
      if (LANG_MAP[k]) return LANG_MAP[k];
      if (k && k !== "und" && k !== "unknown") return k.toUpperCase();
      return `Audio ${idx + 1}`;
    }

    function updateLiveAudioUi() {
      if (!isLive) return;
      if (liveAudioOptions.length < 2) {
        langWrap.classList.add("hidden");
        langMenu.innerHTML = "";
        return;
      }
      langWrap.classList.remove("hidden");
      const activeObj = liveAudioOptions.find((x) => String(x.id) === String(selectedLiveAudio)) || liveAudioOptions[0];
      langBtn.textContent = activeObj.label;
      langMenu.innerHTML = liveAudioOptions.map((x) =>
        `<button class="pop-opt ${String(x.id) === String(activeObj.id) ? "active" : ""}" data-la="${esc(x.id)}" onclick="triggerBounce(this); setLiveAudio('${esc(x.id)}');">${esc(x.label)}</button>`
      ).join("");
    }

    function setLiveAudio(id) {
      selectedLiveAudio = id;
      if (hls && Array.isArray(hls.audioTracks)) {
        hls.audioTrack = Number(id);
      } else if (shakaPlayer) {
        shakaPlayer.selectAudioLanguage(String(id));
      }
      updateLiveAudioUi();
      closeAllPops();
      langBtn.focus({ preventScroll: true });
      resetHudTimer();
    }

    /* Live TV Quality (Shown ONLY when >= 2 qualities exist) */
    function updateLiveQualUi() {
      if (!isLive) return;
      if (liveAvailableHeights.length < 2) {
        qualWrap.classList.add("hidden");
        qualMenu.innerHTML = "";
        return;
      }
      qualWrap.classList.remove("hidden");
      const opts = [`<button class="pop-opt ${selectedLiveQuality === "auto" ? "active" : ""}" data-q="auto" onclick="triggerBounce(this); setLiveQuality('auto');">Auto</button>`];
      for (const h of liveAvailableHeights) {
        const label = h >= 2160 ? "4K" : `${h}p`;
        opts.push(`<button class="pop-opt ${selectedLiveQuality === h ? "active" : ""}" data-q="${h}" onclick="triggerBounce(this); setLiveQuality(${h});">${label}</button>`);
      }
      qualMenu.innerHTML = opts.join("");
      qualBtn.textContent = selectedLiveQuality === "auto" ? "Auto" : (selectedLiveQuality >= 2160 ? "4K" : `${selectedLiveQuality}p`);
    }

    function setLiveQuality(q) {
      selectedLiveQuality = q;
      if (hls && hls.levels && hls.levels.length) {
        if (q === "auto") hls.currentLevel = -1;
        else {
          let bestIdx = -1, bestBr = -1;
          hls.levels.forEach((lv, i) => {
            if (lv.height === q && (lv.bitrate || 0) >= bestBr) { bestBr = lv.bitrate || 0; bestIdx = i; }
          });
          if (bestIdx >= 0) hls.currentLevel = bestIdx;
        }
      } else if (shakaPlayer) {
        if (q === "auto") shakaPlayer.configure({ abr: { enabled: true } });
        else {
          shakaPlayer.configure({ abr: { enabled: false } });
          const tracks = shakaPlayer.getVariantTracks().filter((t) => t.height === q).sort((a, b) => (b.bandwidth || 0) - (a.bandwidth || 0));
          if (tracks.length) shakaPlayer.selectVariantTrack(tracks[0], true);
        }
      }
      updateLiveQualUi();
      closeAllPops();
      qualBtn.focus({ preventScroll: true });
      resetHudTimer();
    }

    /* YPlay Quality, Deduplicated Audio (Default Tamil) & Subtitles */
    function renderVodQualMenu() {
      const list = [
        { q: "orig", label: "Original" },
        { q: "720", label: "720p" },
        { q: "480", label: "480p" },
        { q: "360", label: "360p" }
      ];
      qualMenu.innerHTML = list.map((x) =>
        `<button class="pop-opt ${vodQuality === x.q ? "active" : ""}" data-q="${x.q}" onclick="triggerBounce(this); setVodQuality('${x.q}');">${x.label}</button>`
      ).join("");
      qualBtn.textContent = vodQuality === "orig" ? "Orig" : `${vodQuality}p`;
    }

    function setVodQuality(q) {
      vodQuality = q;
      renderVodQualMenu();
      closeAllPops();
      qualBtn.focus({ preventScroll: true });
      if (!isLive && activeYPlayIdx >= 0) restartYPlayAt(getEffectiveTime());
    }

    function getCleanVodAudioTracks(item) {
      const raw = Array.isArray(item.audio_tracks) ? item.audio_tracks : [];
      if (!raw.length) return [];

      const seen = new Set();
      const unique = [];
      for (const t of raw) {
        const baseLabel = String(t.label || "Audio").trim();
        const codec = String(t.codec || "").toLowerCase();
        const key = `${baseLabel.toLowerCase()}|${codec}`;
        if (seen.has(key)) continue;
        seen.add(key);
        unique.push({ ...t, cleanLabel: baseLabel });
      }

      const counts = {};
      for (const u of unique) counts[u.cleanLabel] = (counts[u.cleanLabel] || 0) + 1;
      const seenNum = {};
      for (const u of unique) {
        if (counts[u.cleanLabel] > 1) {
          const c = (u.codec || "").toLowerCase();
          if (c === "eac3" || c === "ac3" || c === "dts") u.cleanLabel = `${u.cleanLabel} (5.1)`;
          else {
            seenNum[u.cleanLabel] = (seenNum[u.cleanLabel] || 0) + 1;
            if (seenNum[u.cleanLabel] > 1) u.cleanLabel = `${u.cleanLabel} (${seenNum[u.cleanLabel]})`;
          }
        }
      }
      return unique;
    }

    function populateYPlayTracks(item) {
      const tracks = getCleanVodAudioTracks(item);
      if (tracks.length >= 2) {
        langWrap.classList.remove("hidden");
        const tamilTrack = tracks.find((t) => t.is_tamil || t.cleanLabel.toLowerCase().startsWith("tamil"));
        const defTrack = tamilTrack || tracks.find((t) => t.index === item.default_audio_idx) || tracks[0];
        vodAudioIdx = defTrack.index;
        langBtn.textContent = defTrack.cleanLabel;
        langMenu.innerHTML = tracks.map((t) =>
          `<button class="pop-opt ${t.index === vodAudioIdx ? "active" : ""}" data-a="${t.index}" onclick="triggerBounce(this); setVodAudio(${t.index});">${esc(t.cleanLabel)}</button>`
        ).join("");
      } else {
        langWrap.classList.add("hidden");
        const tamilSingle = tracks.find((t) => t.is_tamil);
        vodAudioIdx = tamilSingle ? tamilSingle.index : (typeof item.default_audio_idx === "number" ? item.default_audio_idx : 0);
        langMenu.innerHTML = "";
      }

      const subs = Array.isArray(item.subtitles) ? item.subtitles : [];
      if (subs.length > 0) {
        subWrap.classList.remove("hidden");
        vodSubIdx = -1;
        subBtn.textContent = "CC";
        subMenu.innerHTML = `<button class="pop-opt active" data-s="-1" onclick="triggerBounce(this); setVodSub(-1);">Off</button>` +
          subs.map((s) => `<button class="pop-opt" data-s="${s.index}" onclick="triggerBounce(this); setVodSub(${s.index});">${esc(s.label)}</button>`).join("");
      } else {
        subWrap.classList.add("hidden");
        vodSubIdx = -1;
        subMenu.innerHTML = "";
      }
    }

    function setVodAudio(idx) {
      vodAudioIdx = idx;
      const item = yplayItems[activeYPlayIdx];
      const tracks = item ? getCleanVodAudioTracks(item) : [];
      const tr = tracks.find((t) => t.index === idx);
      langBtn.textContent = tr ? tr.cleanLabel : "Audio";
      langMenu.querySelectorAll(".pop-opt").forEach((b) => b.classList.toggle("active", Number(b.dataset.a) === idx));
      closeAllPops();
      langBtn.focus({ preventScroll: true });
      if (!isLive && activeYPlayIdx >= 0) restartYPlayAt(getEffectiveTime());
    }

    function setVodSub(idx) {
      vodSubIdx = idx;
      subMenu.querySelectorAll(".pop-opt").forEach((b) => b.classList.toggle("active", Number(b.dataset.s) === idx));
      closeAllPops();
      subBtn.focus({ preventScroll: true });
      if (idx < 0) {
        subBtn.textContent = "CC";
        subCues = [];
        subOverlay.classList.remove("show");
      } else {
        subBtn.textContent = "CC On";
        loadSubtitleWindow(getEffectiveTime());
      }
    }

    function setSpeed(rate) {
      currentSpeed = rate;
      video.playbackRate = rate;
      speedBtn.textContent = `${rate}x`;
      document.querySelectorAll("#speedMenu .pop-opt").forEach((b) => b.classList.toggle("active", Number(b.dataset.rate) === rate));
      closeAllPops();
      speedBtn.focus({ preventScroll: true });
      resetHudTimer();
    }

    /* YouTube 2-Step Progress Bar Functions */
    function renderProgressVisual(curSec, durSec) {
      const pct = durSec > 0 ? Math.max(0, Math.min(100, (curSec / durSec) * 100)) : 0;
      progressFill.style.width = `${pct}%`;
      progressThumb.style.left = `${pct}%`;
      scrubBubble.style.left = `${pct}%`;
      scrubBubble.textContent = isScrubbing ? `${fmt(curSec)} • OK` : fmt(curSec);
      curTxt.textContent = fmt(curSec);
      if (durSec > 0) durTxt.textContent = fmt(durSec);
    }

    function enterScrubMode() {
      const dur = getEffectiveDuration();
      if (isLive || dur <= 0) return;
      isScrubbing = true;
      scrubPreviewSec = getEffectiveTime();
      progressBar.classList.add("scrubbing");
      progressBar.focus({ preventScroll: true });
      renderProgressVisual(scrubPreviewSec, dur);
      clearTimeout(hudTimer);
    }

    function exitScrubMode(commitSeek = false) {
      if (!isScrubbing) return;
      const target = scrubPreviewSec;
      isScrubbing = false;
      progressBar.classList.remove("scrubbing");
      if (commitSeek) {
        seekYPlayTo(target);
      } else {
        renderProgressVisual(getEffectiveTime(), getEffectiveDuration());
      }
      resetHudTimer();
    }

    function stepScrubPreview(deltaSec) {
      const dur = getEffectiveDuration();
      if (dur <= 0) return;
      scrubPreviewSec = Math.max(0, Math.min(dur - 1, scrubPreviewSec + deltaSec));
      renderProgressVisual(scrubPreviewSec, dur);
    }

    progressBar.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isLive) return;
      const dur = getEffectiveDuration();
      if (dur <= 0) return;
      const rect = progressBar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const target = ratio * dur;
      if (isScrubbing) exitScrubMode(false);
      seekYPlayTo(target);
      resetHudTimer();
    });

    /* Seek Helpers (Double-Tap / Double-Press -10s / +10s) */
    function getEffectiveDuration() {
      if (transcodeMode) {
        const item = yplayItems[activeYPlayIdx];
        if (item && item.duration > 0) return Number(item.duration);
        return isFinite(video.duration) && video.duration > 0 ? baseOffset + video.duration : 0;
      }
      return isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
    }

    function getEffectiveTime() {
      const cur = video.currentTime || 0;
      return transcodeMode ? baseOffset + cur : cur;
    }

    function showSeekPill(text, side) {
      const target = side === "left" ? seekLeftFlash : seekRightFlash;
      const other = side === "left" ? seekRightFlash : seekLeftFlash;
      other.classList.remove("show");
      target.textContent = text;
      target.classList.add("show");
      clearTimeout(seekFlashTimer);
      seekFlashTimer = setTimeout(() => {
        seekLeftFlash.classList.remove("show");
        seekRightFlash.classList.remove("show");
      }, 650);
    }

    function queueSeekDelta(sec) {
      if (isLive) return;
      const dur = getEffectiveDuration();
      if (dur <= 0) return;
      pendingSeekDelta += sec;
      const side = pendingSeekDelta < 0 ? "left" : "right";
      showSeekPill(`${pendingSeekDelta > 0 ? "+" : ""}${pendingSeekDelta}s`, side);
      clearTimeout(seekExecTimer);
      seekExecTimer = setTimeout(() => {
        const delta = pendingSeekDelta;
        pendingSeekDelta = 0;
        seekYPlayTo(getEffectiveTime() + delta);
      }, 260);
    }

    function seekYPlayTo(targetSec) {
      if (isLive) return;
      const dur = getEffectiveDuration();
      const clamped = Math.max(0, dur > 1 ? Math.min(dur - 1, targetSec) : targetSec);
      renderProgressVisual(clamped, dur);
      if (transcodeMode) {
        restartYPlayAt(clamped);
      } else if (dur > 0) {
        showLoading(currentMediaTitle, `Seeking to ${fmt(clamped)}...`, false);
        video.currentTime = clamped;
        if (vodSubIdx >= 0) loadSubtitleWindow(clamped);
      }
    }

    /* Touch Tap & Double-Tap on Fullscreen Video */
    stage.addEventListener("click", (e) => {
      if (drawerOpen || playerError.classList.contains("show")) return;
      if (hasOpenPop()) { closeAllPops(); return; }

      if (isLive) {
        if (video.paused) video.play().catch(() => {});
        if (isHudVisible()) hideHud();
        else showHud(menuBtn, 4200);
        return;
      }

      const now = Date.now();
      const rect = stage.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const isLeft = x < rect.width * 0.42;
      const isRight = x > rect.width * 0.58;

      if (now - lastTouchTap < 300) {
        clearTimeout(touchSingleTimer);
        lastTouchTap = now;
        if (isLeft) queueSeekDelta(-10);
        else if (isRight) queueSeekDelta(10);
        return;
      }

      lastTouchTap = now;
      touchSingleTimer = setTimeout(() => {
        if (isHudVisible()) hideHud();
        else showHud(menuBtn, 4200);
      }, 300);
    });

    /* Subtitles Parser & Loader */
    function parseVttTime(s) {
      const p = s.trim().split(":");
      if (p.length === 3) return Number(p[0]) * 3600 + Number(p[1]) * 60 + parseFloat(p[2]);
      if (p.length === 2) return Number(p[0]) * 60 + parseFloat(p[1]);
      return 0;
    }

    function parseVttCues(vtt, offsetSec) {
      const blocks = vtt.replace(/\r/g, "").split("\n\n");
      const out = [];
      for (const blk of blocks) {
        const lines = blk.trim().split("\n");
        const arrowIdx = lines.findIndex((l) => l.includes("-->"));
        if (arrowIdx < 0) continue;
        const [a, b] = lines[arrowIdx].split("-->");
        const start = offsetSec + parseVttTime(a);
        const end = offsetSec + parseVttTime(b.split(" ")[0]);
        const text = lines.slice(arrowIdx + 1).join("\n").replace(/<[^>]+>/g, "").trim();
        if (text && end > start) out.push({ start, end, text });
      }
      return out;
    }

    async function loadSubtitleWindow(curSec) {
      if (vodSubIdx < 0 || activeYPlayIdx < 0 || subLoading) return;
      subLoading = true;
      const start = Math.max(0, Math.floor(curSec));
      try {
        const res = await fetch(`${DIRECT_STREAM_URL}/api/yplay/sub/${activeYPlayIdx}/${vodSubIdx}.vtt?t=${start}&dur=180`);
        const txt = await res.text();
        subCues = parseVttCues(txt, start);
        subFetchStart = start;
      } catch (_) {
        subCues = [];
      } finally {
        subLoading = false;
      }
    }

    function renderActiveSubtitle(curSec) {
      if (isLive || vodSubIdx < 0) {
        subOverlay.classList.remove("show");
        return;
      }
      if (subFetchStart < 0 || curSec < subFetchStart || curSec > subFetchStart + 160) {
        loadSubtitleWindow(curSec);
      }
      const cue = subCues.find((c) => curSec >= c.start && curSec <= c.end);
      if (cue) {
        subText.textContent = cue.text;
        subOverlay.classList.add("show");
      } else {
        subOverlay.classList.remove("show");
      }
    }

    /* Playback Engines */
    async function cleanupPlayers() {
      clearTimeout(liveFailTimer);
      hideError();
      if (hls) { hls.destroy(); hls = null; }
      if (shakaPlayer) { try { await shakaPlayer.destroy(); } catch (_) {} shakaPlayer = null; }
      try {
        video.pause();
        video.removeAttribute("src");
        video.load();
      } catch (_) {}
    }

    async function resolveDirectTunnel() {
      try {
        const res = await fetch(`${WORKER_URL}/health?t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();
        if (data && typeof data.tunnel_url === "string" && data.tunnel_url.startsWith("https://")) {
          DIRECT_STREAM_URL = data.tunnel_url;
        }
      } catch (_) {}
    }

    function extractUniqueLiveAudio(list) {
      const seen = new Set();
      const out = [];
      list.forEach((item, idx) => {
        const label = normLangName(item.lang, idx);
        if (seen.has(label)) return;
        seen.add(label);
        out.push({ id: item.id, label });
      });
      return out;
    }

    function startHlsUrl(url, ch, autoPlay, isRelay = false) {
      if (hls) { hls.destroy(); hls = null; }
      if (window.Hls && window.Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: false, maxBufferLength: 14, backBufferLength: 8 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (activeChannelId !== ch.id) return;
          hideError();
          liveAvailableHeights = Array.from(new Set((hls.levels || []).map((lv) => lv.height || 0).filter((h) => h > 0))).sort((a, b) => b - a);
          updateLiveQualUi();
          hls.currentLevel = -1;

          const aTracks = (hls.audioTracks || []).map((t, idx) => ({ id: idx, lang: t.lang || t.name || "" }));
          liveAudioOptions = extractUniqueLiveAudio(aTracks);
          if (liveAudioOptions.length >= 2) {
            const tam = liveAudioOptions.find((x) => x.label === "Tamil") || liveAudioOptions[0];
            selectedLiveAudio = String(tam.id);
            hls.audioTrack = Number(tam.id);
          }
          updateLiveAudioUi();
          if (autoPlay) video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal || activeChannelId !== ch.id) return;
          handleLiveFallback(ch, autoPlay, data.details || "Network error");
        });
      } else {
        liveAvailableHeights = [];
        liveAudioOptions = [];
        updateLiveQualUi();
        updateLiveAudioUi();
        video.src = url;
        video.load();
        if (autoPlay) video.play().catch(() => {});
      }
    }

    async function handleLiveFallback(ch, autoPlay, reason = "Stream offline") {
      if (activeChannelId !== ch.id || !isLive || isZapping) return;

      if (liveStage === 0 && video.canPlayType("application/vnd.apple.mpegurl")) {
        liveStage = 1;
        await cleanupPlayers();
        liveAvailableHeights = [];
        liveAudioOptions = [];
        updateLiveQualUi();
        updateLiveAudioUi();
        video.src = ch.url;
        video.load();
        if (autoPlay) video.play().catch(() => {});
        return;
      }
      if (liveStage < 2 && ch.relayPath) {
        liveStage = 2;
        await resolveDirectTunnel();
        loadSub.textContent = "Connecting backup relay...";
        startHlsUrl(`${DIRECT_STREAM_URL}${ch.relayPath}`, ch, autoPlay, true);
        return;
      }

      if (liveFailCount < CHANNELS.length - 1) {
        liveFailCount += 1;
        const curIdx = CHANNELS.findIndex((c) => c.id === ch.id);
        const nextCh = CHANNELS[(curIdx + 1) % CHANNELS.length];
        currentMediaTitle = nextCh.name;
        dishNum.textContent = nextCh.num;
        dishName.textContent = nextCh.name;
        dishCat.textContent = nextCh.cat;
        showHud(menuBtn, 4200);
        showLoading(nextCh.name, `${ch.name} offline • Switching...`, true);
        clearTimeout(liveFailTimer);
        liveFailTimer = setTimeout(() => {
          if (isLive && activeChannelId === ch.id) playChannel(nextCh, true, false);
        }, 700);
        return;
      }

      showError("Live TV Unavailable", `All channels failed to load (${reason}). Check internet and tap Retry.`);
    }

    /* Fast Dish Channel Zapping (Up / Down) */
    function zapChannel(step) {
      const curIdx = CHANNELS.findIndex((c) => c.id === activeChannelId);
      const baseIdx = curIdx >= 0 ? curIdx : 0;
      const nextIdx = (baseIdx + step + CHANNELS.length) % CHANNELS.length;
      const nextCh = CHANNELS[nextIdx];

      isZapping = true;
      activeChannelId = nextCh.id;
      currentMediaTitle = nextCh.name;
      dishNum.textContent = nextCh.num;
      dishName.textContent = nextCh.name;
      dishCat.textContent = nextCh.cat;
      liveAvailableHeights = [];
      liveAudioOptions = [];
      updateLiveAudioUi();
      updateLiveQualUi();

      cleanupPlayers();
      showHud(menuBtn, 4200);
      showLoading(nextCh.name, `#${nextCh.num} • ${nextCh.cat}`, true);

      clearTimeout(zapDebounceTimer);
      zapDebounceTimer = setTimeout(() => {
        isZapping = false;
        playChannel(nextCh, true, true);
      }, 220);
    }

    async function playChannel(ch, autoPlay = true, resetFail = true) {
      isZapping = false;
      await cleanupPlayers();
      if (resetFail) liveFailCount = 0;
      activeChannelId = ch.id;
      activeYPlayIdx = -1;
      currentMediaTitle = ch.name;
      dishNum.textContent = ch.num;
      dishName.textContent = ch.name;
      dishCat.textContent = ch.cat;
      pendingResumeTime = 0;
      transcodeMode = false;
      baseOffset = 0;
      liveStage = 0;
      selectedLiveQuality = "auto";
      liveAvailableHeights = [];
      liveAudioOptions = [];
      selectedLiveAudio = "";
      video.playbackRate = 1;

      configureHudMode(false);
      showHud(menuBtn, 4200);
      showLoading(ch.name, `#${ch.num} • ${ch.cat}`, true);

      if (ch.type === "dash-clearkey" && window.shaka && shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player();
        await shakaPlayer.attach(video);
        shakaPlayer.configure({
          drm: { clearKeys: { [ch.kid]: ch.key } },
          abr: { enabled: true },
          streaming: { bufferingGoal: 10, rebufferingGoal: 2 }
        });
        shakaPlayer.addEventListener("error", (ev) => {
          if (activeChannelId === ch.id) {
            handleLiveFallback(ch, autoPlay, `Code ${ev && ev.detail ? ev.detail.code : "Network"}`);
          }
        });
        try {
          await shakaPlayer.load(ch.url);
          if (activeChannelId !== ch.id) return;
          hideError();
          liveAvailableHeights = Array.from(new Set(shakaPlayer.getVariantTracks().map((t) => t.height || 0).filter((h) => h > 0))).sort((a, b) => b - a);
          updateLiveQualUi();

          const langs = (shakaPlayer.getAudioLanguages() || []).map((l) => ({ id: l, lang: l }));
          liveAudioOptions = extractUniqueLiveAudio(langs);
          if (liveAudioOptions.length >= 2) {
            const tam = liveAudioOptions.find((x) => x.label === "Tamil") || liveAudioOptions[0];
            selectedLiveAudio = String(tam.id);
            shakaPlayer.selectAudioLanguage(String(tam.id));
          }
          updateLiveAudioUi();
          if (autoPlay) video.play().catch(() => {});
        } catch (_) {
          if (activeChannelId === ch.id) handleLiveFallback(ch, autoPlay, "Stream offline");
        }
        return;
      }

      if (ch.url.includes(".m3u8")) startHlsUrl(ch.url, ch, autoPlay, false);
      else {
        video.src = ch.url;
        video.load();
        if (autoPlay) video.play().catch(() => {});
      }
    }

    function restartYPlayAt(targetSec) {
      const item = yplayItems[activeYPlayIdx];
      if (!item) return;
      const clamped = Math.max(0, Math.floor(targetSec));
      const needsTranscode = Boolean(item.compat_audio) || vodQuality !== "orig" || vodAudioIdx !== 0;
      transcodeMode = needsTranscode;

      showLoading(item.title, `Loading at ${fmt(clamped)}...`, true);
      if (transcodeMode) {
        baseOffset = clamped;
        pendingResumeTime = 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/play/${activeYPlayIdx}?t=${baseOffset}&q=${vodQuality}&a=${vodAudioIdx}`;
      } else {
        baseOffset = 0;
        pendingResumeTime = clamped > 2 ? clamped : 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/stream/${activeYPlayIdx}`;
      }
      video.load();
      video.playbackRate = currentSpeed;
      video.play().catch(() => hideLoading());
      if (vodSubIdx >= 0) loadSubtitleWindow(clamped);
    }

    async function loadYPlay(idx, autoPlay = true, forceOffset = null) {
      if (idx < 0 || idx >= yplayItems.length) return;
      isZapping = false;
      await cleanupPlayers();
      activeChannelId = "";
      activeYPlayIdx = idx;
      errorRetries = 0;
      audioAutoChecked = false;
      vodQuality = "orig";
      subCues = [];
      subFetchStart = -1;
      subOverlay.classList.remove("show");
      exitScrubMode(false);

      const item = yplayItems[idx];
      currentMediaTitle = item.title;
      populateYPlayTracks(item);
      configureHudMode(true);

      const gbStr = fmtGB(item.file_size);
      const qStr = item.quality || "HD";
      transcodeMode = Boolean(item.compat_audio) || vodAudioIdx !== 0 || forceOffset !== null;

      hudTitle.textContent = item.title;
      hudSub.textContent = `${qStr} • ${gbStr}`;
      showHud(menuBtn, 4200);
      showLoading(item.title, `${qStr} • ${gbStr}`, true);

      const saved = forceOffset !== null
        ? forceOffset
        : Number(localStorage.getItem(`yp_pos_${item.id}`) || "0");

      if (transcodeMode) {
        baseOffset = saved > 5 ? Math.floor(saved) : 0;
        pendingResumeTime = 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/play/${idx}?t=${baseOffset}&q=${vodQuality}&a=${vodAudioIdx}`;
      } else {
        baseOffset = 0;
        pendingResumeTime = saved > 5 ? saved : 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/stream/${idx}`;
      }

      const initDur = Number(item.duration || 0);
      renderProgressVisual(saved > 5 ? saved : 0, initDur);

      video.load();
      video.playbackRate = currentSpeed;
      if (autoPlay) video.play().catch(() => hideLoading());
    }

    function playNextYPlay() {
      if (!yplayItems.length) return;
      loadYPlay(activeYPlayIdx + 1 < yplayItems.length ? activeYPlayIdx + 1 : 0, true);
    }

    function toggleVodPlay() {
      if (isLive) return;
      if (video.paused) {
        video.play().catch(() => {});
        resetHudTimer(2200);
      } else {
        video.pause();
        clearTimeout(hudTimer);
      }
    }

    function toggleMute() {
      video.muted = !video.muted;
      syncIcons();
      resetHudTimer();
    }

    /* Video Events */
    video.addEventListener("loadedmetadata", () => {
      hideError();
      if (!isLive) {
        video.playbackRate = currentSpeed;
        if (!transcodeMode && pendingResumeTime > 0 && isFinite(video.duration) && pendingResumeTime < video.duration - 2) {
          video.currentTime = pendingResumeTime;
          pendingResumeTime = 0;
        }
      }
    });

    video.addEventListener("loadeddata", () => { hideError(); hideLoading(); });

    video.addEventListener("playing", () => {
      hideError();
      hideLoading();
      syncIcons();
      if (isLive) liveFailCount = 0;
      if (isHudVisible() && !isScrubbing) resetHudTimer(3200);
    });

    video.addEventListener("waiting", () => {
      if (!video.paused && !isZapping) {
        showLoading(currentMediaTitle, "Buffering...", false);
      }
    });

    video.addEventListener("pause", () => {
      hideLoading();
      syncIcons();
      if (!isLive && !drawerOpen && !shuttingDown && video.getAttribute("src")) {
        showHud(centerPlayBtn, 6000);
        clearTimeout(hudTimer);
      }
    });

    video.addEventListener("error", async () => {
      if (shuttingDown || isZapping || !video.getAttribute("src")) return;
      if (isLive) {
        const ch = CHANNELS.find((c) => c.id === activeChannelId);
        if (ch) handleLiveFallback(ch, true, "Stream failed");
        return;
      }
      if (!isLive && activeYPlayIdx >= 0 && errorRetries < 2) {
        errorRetries += 1;
        await resolveDirectTunnel();
        restartYPlayAt(getEffectiveTime());
      } else {
        showError("Playback Error", "Unable to load this video from server. Check internet and tap Retry.");
      }
    });

    video.addEventListener("timeupdate", () => {
      if (isLive) return;
      const cur = getEffectiveTime();
      const dur = getEffectiveDuration();

      if (!transcodeMode && !audioAutoChecked && !video.muted && (video.currentTime || 0) > 2.2) {
        audioAutoChecked = true;
        if (typeof video.webkitAudioDecodedByteCount === "number" && video.webkitAudioDecodedByteCount === 0) {
          loadYPlay(activeYPlayIdx, true, Math.floor(cur));
          return;
        }
      }

      if (!isScrubbing) {
        renderProgressVisual(cur, dur);
      }
      renderActiveSubtitle(cur);

      const now = Date.now();
      const item = yplayItems[activeYPlayIdx];
      if (item && cur > 2 && now - lastSavedPosTime > 2500) {
        lastSavedPosTime = now;
        localStorage.setItem(`yp_pos_${item.id}`, String(Math.floor(cur)));
      }
    });

    video.addEventListener("ended", () => {
      hideLoading();
      const item = yplayItems[activeYPlayIdx];
      if (item) localStorage.removeItem(`yp_pos_${item.id}`);
      if (!isLive && activeYPlayIdx + 1 < yplayItems.length) loadYPlay(activeYPlayIdx + 1, true);
    });

    /* =========================================================================
       ANDROID TV 4-WAY REMOTE + OK + BACK CONTROLLER
    ========================================================================= */
    function isBackKey(e) {
      return (
        e.key === "Escape" ||
        e.key === "Backspace" ||
        e.key === "BrowserBack" ||
        e.key === "GoBack" ||
        e.keyCode === 4 ||
        e.keyCode === 27 ||
        e.keyCode === 461
      );
    }

    function isOkKey(e) {
      return (
        e.key === "Enter" ||
        e.key === "Select" ||
        e.key === " " ||
        e.keyCode === 13 ||
        e.keyCode === 23
      );
    }

    function getVisibleRowButtons() {
      const ids = isLive
        ? ["menuBtn", "langBtn", "qualBtn"]
        : ["nextBtn", "muteBtn", "langBtn", "subBtn", "qualBtn", "speedBtn"];
      return ids
        .map((id) => document.getElementById(id))
        .filter((el) => el && !el.classList.contains("hidden") && el.closest(".hidden") === null);
    }

    document.addEventListener("keydown", (e) => {
      const k = e.key;
      const active = document.activeElement;

      /* 1. Back Button (Never exits prematurely; Double-Back to exit) */
      if (isBackKey(e)) {
        if (processBackAction()) {
          e.preventDefault();
          e.stopPropagation();
        }
        return;
      }

      /* 2. Hardware Channel / Media Keys */
      if ((k === "ChannelUp" || k === "PageUp") && isLive && !drawerOpen) {
        e.preventDefault();
        zapChannel(1);
        return;
      }
      if ((k === "ChannelDown" || k === "PageDown") && isLive && !drawerOpen) {
        e.preventDefault();
        zapChannel(-1);
        return;
      }
      if ((k === "MediaPlayPause" || k === " ") && !isLive && !drawerOpen && active !== progressBar) {
        if (active && active.tagName === "BUTTON") return;
        e.preventDefault();
        toggleVodPlay();
        return;
      }
      if (k === "MediaFastForward" && !isLive) { e.preventDefault(); queueSeekDelta(10); return; }
      if (k === "MediaRewind" && !isLive) { e.preventDefault(); queueSeekDelta(-10); return; }

      /* 3. Error Overlay */
      if (playerError.classList.contains("show")) {
        const retryBtn = document.getElementById("errRetryBtn");
        const eMenuBtn = document.getElementById("errMenuBtn");
        if (k === "ArrowLeft" || k === "ArrowRight") {
          e.preventDefault();
          (active === retryBtn ? eMenuBtn : retryBtn).focus();
        } else if (isOkKey(e) && active) {
          e.preventDefault();
          triggerBounce(active);
          active.click();
        }
        return;
      }

      /* 4. Side Drawer Navigation */
      if (drawerOpen) {
        const items = Array.from(drawerList.querySelectorAll(".d-item"));
        const curIdx = items.indexOf(active);

        if (active === tabLive || active === tabYPlay) {
          if (k === "ArrowLeft" || k === "ArrowRight") {
            e.preventDefault();
            const nextTab = active === tabLive ? "yplay" : "live";
            selectDrawerTab(nextTab);
            (nextTab === "live" ? tabLive : tabYPlay).focus({ preventScroll: true });
          } else if (k === "ArrowDown" && items.length > 0) {
            e.preventDefault();
            const activeItem = drawerList.querySelector(".d-item.active") || items[0];
            activeItem.scrollIntoView({ block: "nearest", behavior: "smooth" });
            activeItem.focus({ preventScroll: true });
          } else if (isOkKey(e)) {
            e.preventDefault();
            triggerBounce(active);
            active.click();
          }
          return;
        }

        if (curIdx >= 0) {
          if (k === "ArrowDown") {
            e.preventDefault();
            const next = items[Math.min(items.length - 1, curIdx + 1)];
            next.scrollIntoView({ block: "nearest", behavior: "smooth" });
            next.focus({ preventScroll: true });
          } else if (k === "ArrowUp") {
            e.preventDefault();
            if (curIdx === 0) {
              (drawerTab === "live" ? tabLive : tabYPlay).focus({ preventScroll: true });
            } else {
              const prev = items[curIdx - 1];
              prev.scrollIntoView({ block: "nearest", behavior: "smooth" });
              prev.focus({ preventScroll: true });
            }
          } else if (isOkKey(e)) {
            e.preventDefault();
            triggerBounce(items[curIdx]);
            items[curIdx].click();
          }
          return;
        }

        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) {
          e.preventDefault();
          const activeItem = drawerList.querySelector(".d-item.active") || items[0];
          if (activeItem) activeItem.focus({ preventScroll: true });
        }
        return;
      }

      /* 5. Open Popup Submenu */
      if (hasOpenPop()) {
        const openMenu = document.querySelector(".pop-menu.open");
        const opts = Array.from(openMenu.querySelectorAll(".pop-opt"));
        const idx = opts.indexOf(active);
        if (k === "ArrowDown") {
          e.preventDefault();
          opts[(idx + 1) % opts.length].focus({ preventScroll: true });
        } else if (k === "ArrowUp") {
          e.preventDefault();
          opts[(idx - 1 + opts.length) % opts.length].focus({ preventScroll: true });
        } else if (isOkKey(e) && idx >= 0) {
          e.preventDefault();
          triggerBounce(opts[idx]);
          opts[idx].click();
        }
        return;
      }

      /* 6. LIVE TV REMOTE RULES (Up/Down = Dish Channel Change + Unified HUD; Left/Right = Options) */
      if (isLive) {
        if (k === "ArrowUp") {
          e.preventDefault();
          zapChannel(1);
          return;
        }
        if (k === "ArrowDown") {
          e.preventDefault();
          zapChannel(-1);
          return;
        }
        if (k === "ArrowLeft" || k === "ArrowRight" || isOkKey(e)) {
          if (!isHudVisible()) {
            e.preventDefault();
            if (video.paused) video.play().catch(() => {});
            showHud(menuBtn, 4200);
            return;
          }
          resetHudTimer(4200);
          const liveBtns = getVisibleRowButtons(); // [menuBtn, langBtn (if >=2), qualBtn (if >=2)]
          const idx = liveBtns.indexOf(active);
          if (k === "ArrowRight") {
            e.preventDefault();
            const next = idx >= 0 ? liveBtns[(idx + 1) % liveBtns.length] : liveBtns[0];
            next.focus({ preventScroll: true });
          } else if (k === "ArrowLeft") {
            e.preventDefault();
            const prev = idx >= 0 ? liveBtns[(idx - 1 + liveBtns.length) % liveBtns.length] : liveBtns[0];
            prev.focus({ preventScroll: true });
          } else if (isOkKey(e)) {
            e.preventDefault();
            const targetBtn = (active && liveBtns.includes(active)) ? active : menuBtn;
            targetBtn.focus({ preventScroll: true });
            triggerBounce(targetBtn);
            targetBtn.click();
          }
        }
        return;
      }

      /* 7. YPLAY PURE FULLSCREEN (HUD Hidden) */
      if (!isHudVisible()) {
        if (k === "ArrowLeft" || k === "ArrowRight") {
          e.preventDefault();
          const now = Date.now();
          const side = k === "ArrowLeft" ? "left" : "right";
          const delta = k === "ArrowLeft" ? -10 : 10;
          if (lastRemoteArrow === k && now - lastRemoteArrowTime < 650) {
            lastRemoteArrowTime = now;
            queueSeekDelta(delta);
          } else {
            lastRemoteArrow = k;
            lastRemoteArrowTime = now;
            showSeekPill(delta > 0 ? "+10s (Press again)" : "-10s (Press again)", side);
          }
          return;
        }
        if (["ArrowUp", "ArrowDown"].includes(k) || isOkKey(e)) {
          e.preventDefault();
          showHud(menuBtn, 4200);
        }
        return;
      }

      /* 8. YPLAY HUD VISIBLE: Locked Progress Bar Scrubbing + 1-by-1 Controls */
      resetHudTimer(4200);
      const bottomBtns = getVisibleRowButtons();
      const bIdx = bottomBtns.indexOf(active);

      if (active === progressBar) {
        if (isOkKey(e)) {
          e.preventDefault();
          e.stopPropagation();
          if (!isScrubbing) enterScrubMode();
          else exitScrubMode(true);
          return;
        }
        if (k === "ArrowLeft" || k === "ArrowRight") {
          e.preventDefault();
          e.stopPropagation();
          if (!isScrubbing) enterScrubMode();
          const step = e.repeat ? 30 : 10;
          stepScrubPreview(k === "ArrowRight" ? step : -step);
          return;
        }
        if (k === "ArrowUp") {
          e.preventDefault();
          e.stopPropagation();
          exitScrubMode(false);
          centerPlayBtn.focus({ preventScroll: true });
          return;
        }
        if (k === "ArrowDown") {
          e.preventDefault();
          e.stopPropagation();
          exitScrubMode(false);
          bottomBtns[0]?.focus({ preventScroll: true });
          return;
        }
        return;
      }

      if (active === menuBtn) {
        if (k === "ArrowDown") {
          e.preventDefault();
          centerPlayBtn.focus({ preventScroll: true });
        } else if (k === "ArrowRight") {
          e.preventDefault();
          centerPlayBtn.focus({ preventScroll: true });
        } else if (isOkKey(e)) {
          e.preventDefault();
          triggerBounce(menuBtn);
          menuBtn.click();
        }
        return;
      }

      if (active === centerPlayBtn) {
        if (k === "ArrowUp" || k === "ArrowLeft") {
          e.preventDefault();
          menuBtn.focus({ preventScroll: true });
        } else if (k === "ArrowDown" || k === "ArrowRight") {
          e.preventDefault();
          progressBar.focus({ preventScroll: true });
        } else if (isOkKey(e)) {
          e.preventDefault();
          centerPlayBtn.click();
        }
        return;
      }

      if (bIdx >= 0) {
        if (k === "ArrowRight") {
          e.preventDefault();
          bottomBtns[Math.min(bottomBtns.length - 1, bIdx + 1)].focus({ preventScroll: true });
        } else if (k === "ArrowLeft") {
          e.preventDefault();
          bottomBtns[Math.max(0, bIdx - 1)].focus({ preventScroll: true });
        } else if (k === "ArrowUp") {
          e.preventDefault();
          progressBar.focus({ preventScroll: true });
        } else if (isOkKey(e)) {
          e.preventDefault();
          triggerBounce(active);
          active.click();
        }
        return;
      }

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k) || isOkKey(e)) {
        e.preventDefault();
        menuBtn.focus({ preventScroll: true });
      }
    }, true);

    /* Formatting & Library Sync */
    function fmt(t) {
      if (!isFinite(t) || t < 0) return "00:00";
      const total = Math.floor(t);
      const hrs = Math.floor(total / 3600);
      const mins = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hrs > 0) return `${hrs}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function fmtGB(bytes) {
      if (!bytes || bytes <= 0) return "Stream";
      const gb = bytes / (1024 * 1024 * 1024);
      return gb >= 10 ? `${gb.toFixed(1)} GB` : `${gb.toFixed(2)} GB`;
    }

    function fmtDurShort(sec) {
      if (!sec || sec <= 0) return "";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return h > 0 ? `${h}h ${m}m` : `${Math.max(1, m)}m`;
    }

    async function fetchYPlay(refreshUi = true) {
      if (document.visibilityState === "hidden") return;
      try {
        const res = await fetch(`${WORKER_URL}/api/yplay/library?t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();
        const nextItems = Array.isArray(data.items) ? data.items : [];
        const sig = JSON.stringify(nextItems.map((x) => [x.id, x.quality, x.compat_audio, x.duration, (x.audio_tracks || []).length, (x.subtitles || []).length]));
        if (sig !== yplaySig) {
          yplaySig = sig;
          yplayItems = nextItems;
          document.getElementById("yplayBadge").textContent = String(yplayItems.length);
          if (!isLive) {
            nextBtn.classList.toggle("hidden", yplayItems.length <= 1);
          }
          if (refreshUi && drawerOpen && drawerTab === "yplay") renderDrawer();
          if (!isLive && activeYPlayIdx >= 0 && yplayItems[activeYPlayIdx]) {
            populateYPlayTracks(yplayItems[activeYPlayIdx]);
          }
        }
      } catch (_) {}
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    window.addEventListener("pagehide", () => {
      shuttingDown = true;
      if (!isLive && yplayItems[activeYPlayIdx]) {
        const cur = getEffectiveTime();
        if (cur > 2) localStorage.setItem(`yp_pos_${yplayItems[activeYPlayIdx].id}`, String(Math.floor(cur)));
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
    });

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible") {
        shuttingDown = false;
        if (!isLive && activeYPlayIdx >= 0 && !video.getAttribute("src")) {
          await resolveDirectTunnel();
          loadYPlay(activeYPlayIdx, false);
        } else if (isLive && video.paused && !drawerOpen) {
          video.play().catch(() => {});
        }
      }
    });

    /* Init Fullscreen TV Experience */
    syncIcons();
    resolveDirectTunnel().then(() => {
      playChannel(CHANNELS[0], true, true);
      fetchYPlay(false);
    });
    setInterval(() => fetchYPlay(true), 15000);
  </script>
</body>
