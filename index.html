<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YStream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.12/dist/shaka-player.compiled.js"></script>
  <style>
    :root {
      --bg: #080a0f;
      --card: #121620;
      --card-hover: #191f2e;
      --active-bg: #13223b;
      --active-border: #2563eb;
      --accent: #e50914;
      --text: #f3f5f8;
      --muted: #8e98a8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .player-stage {
      position: sticky;
      top: 0;
      z-index: 25;
      background: #000;
      border-bottom: 1px solid var(--border);
    }
    .video-wrap {
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
      user-select: none;
    }
    video {
      width: 100%;
      max-height: 44vh;
      aspect-ratio: 16 / 9;
      display: block;
      background: #000;
    }
    .player-stage:fullscreen video,
    .player-stage:-webkit-full-screen video {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
    }

    .buf-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.22);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      z-index: 18;
      display: none;
      pointer-events: none;
    }
    .buf-spinner.show { display: block; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    .tap-flash {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 24px;
      z-index: 17;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .tap-flash.left { left: 14%; }
    .tap-flash.right { right: 14%; }
    .tap-flash.show { opacity: 1; }

    .live-fs-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 14;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(10, 13, 20, 0.72);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .live-fs-btn.show { display: inline-flex; }

    .yt-overlay {
      position: absolute;
      inset: 0;
      z-index: 14;
      background: linear-gradient(to top, rgba(0,0,0,0.84) 0%, rgba(0,0,0,0.12) 45%, rgba(0,0,0,0.35) 100%);
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px 12px;
      opacity: 0;
      transition: opacity 0.22s ease;
      pointer-events: none;
    }
    .yt-overlay.enabled { display: flex; }
    .yt-overlay.visible { opacity: 1; pointer-events: auto; }

    .yt-center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.68);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .yt-center-btn.hide { display: none; }

    .yt-bottom {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .yt-seek-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.74rem;
      color: #fff;
      font-weight: 600;
    }
    .yt-track {
      position: relative;
      flex: 1;
      height: 16px;
      display: flex;
      align-items: center;
    }
    .yt-track-bg {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 3px;
      overflow: hidden;
    }
    .yt-buf-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: rgba(255, 255, 255, 0.45);
    }
    .yt-prog-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--accent);
    }
    .yt-track input[type="range"] {
      position: relative;
      z-index: 2;
      width: 100%;
      margin: 0;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
      height: 16px;
    }
    .yt-track input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
    }

    .yt-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .yt-act-grp { display: flex; align-items: center; gap: 6px; }
    .yt-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .title-bar {
      background: #0e121b;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--border);
    }
    .now-title { font-size: 0.94rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now-sub { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }

    button {
      background: #1a2030;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover, button:focus-visible {
      background: #252e44;
      border-color: #ffffff;
      outline: 2px solid #ffffff;
    }
    button.red { background: var(--accent); border-color: var(--accent); color: #fff; }

    .container { max-width: 960px; margin: 0 auto; padding: 14px; }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 10px;
      gap: 8px;
    }
    .sec-title { font-size: 1.08rem; font-weight: 700; }
    .sec-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .live-pill {
      background: #17253f;
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.35);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 7px;
      flex-shrink: 0;
    }

    .channel-list { display: flex; flex-direction: column; gap: 9px; }
    .ch-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }
    .ch-card:hover, .ch-card:focus-visible {
      background: var(--card-hover);
      outline: 2px solid #ffffff;
    }
    .ch-card.active {
      background: var(--active-bg);
      border-color: var(--active-border);
    }
    .ch-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .ch-logo-box {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .ch-logo-box img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
    .ch-name { font-size: 0.95rem; font-weight: 700; }
    .ch-meta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .ch-eq { font-size: 0.85rem; color: #60a5fa; font-weight: 800; padding-right: 4px; }

    .yplay-list { display: flex; flex-direction: column; gap: 8px; }
    .yp-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .yp-card:hover, .yp-card:focus-visible {
      background: var(--card-hover);
      outline: 2px solid #ffffff;
    }
    .yp-card.active {
      background: var(--active-bg);
      border-color: var(--active-border);
    }
    .yp-title { font-size: 0.9rem; font-weight: 700; word-break: break-word; }
    .yp-meta { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="player-stage" id="stage">
    <div class="video-wrap" id="videoWrap">
      <video id="video" playsinline preload="auto"></video>
      <div id="bufSpinner" class="buf-spinner"></div>
      <div id="flashLeft" class="tap-flash left">-10s</div>
      <div id="flashRight" class="tap-flash right">+10s</div>
      <button id="liveFsBtn" class="live-fs-btn" title="Fullscreen" onclick="toggleFullscreen()">&#x26F6;</button>

      <div id="ytOverlay" class="yt-overlay">
        <button id="ytCenterBtn" class="yt-center-btn" onclick="event.stopPropagation(); toggleVodPlay();">&#9654;</button>
        <div class="yt-bottom" onclick="event.stopPropagation()">
          <div class="yt-seek-row">
            <span id="curTxt">00:00</span>
            <div class="yt-track">
              <div class="yt-track-bg">
                <div id="bufFill" class="yt-buf-fill"></div>
                <div id="progFill" class="yt-prog-fill"></div>
              </div>
              <input id="seekInput" type="range" min="0" max="1000" value="0" step="1" />
            </div>
            <span id="durTxt">00:00</span>
          </div>
          <div class="yt-actions">
            <div class="yt-act-grp">
              <button class="yt-btn" onclick="playNextYPlay()">Next</button>
              <button id="muteBtn" class="yt-btn" title="Mute/Unmute" onclick="toggleMute()">&#128266;</button>
            </div>
            <div class="yt-act-grp">
              <button class="yt-btn" title="Fullscreen" onclick="toggleFullscreen()">&#x26F6;</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="title-bar">
      <div style="min-width:0;">
        <div id="nowTitle" class="now-title">Sun TV</div>
        <div id="nowSub" class="now-sub">#01 • Entertainment • Live</div>
      </div>
      <div id="liveTag" class="live-pill">6 LIVE</div>
    </div>
  </div>

  <div class="container">
    <div class="sec-head">
      <div>
        <div class="sec-title">Live Channels</div>
        <div class="sec-sub">Tap any channel to start watching</div>
      </div>
      <div class="live-pill">6 LIVE</div>
    </div>
    <div id="channelList" class="channel-list"></div>

    <div class="sec-head" style="margin-top:22px;">
      <div>
        <div class="sec-title">YPlay Movies</div>
        <div id="yplaySub" class="sec-sub">Connecting...</div>
      </div>
      <button onclick="refreshAll()">Refresh</button>
    </div>
    <div id="yplayList" class="yplay-list"></div>
  </div>

  <script>
    const WORKER_URL = "https://ystream.hiddencreator-account.workers.dev";
    let DIRECT_STREAM_URL = WORKER_URL;
    let usingDirectTunnel = false;
    let serverOnline = false;

    const CHANNELS = [
      {
        id: "suntv",
        num: "#01",
        name: "Sun TV",
        cat: "Entertainment • Live",
        type: "hls",
        url: "https://d2px1d6ssc60fw.cloudfront.net/SunTV/SunTV-HDR10-IN-index.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/3/3e/Sun_TV_logo.svg/240px-Sun_TV_logo.svg.png"
      },
      {
        id: "zeetamil",
        num: "#02",
        name: "Zee Tamil HD",
        cat: "Entertainment • HD",
        type: "hls",
        url: "https://da86m1sqpm3o0.cloudfront.net/28072023/smil:zeetamil1.smil/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/51/Zee_Tamil_logo.svg/240px-Zee_Tamil_logo.svg.png"
      },
      {
        id: "colorstamil",
        num: "#03",
        name: "Colors Tamil HD",
        cat: "Entertainment • HD",
        type: "hls",
        url: "https://da86m1sqpm3o0.cloudfront.net/28072023/smil:colorstamilhd11.smil/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/2/2f/Colors_Tamil_logo.svg/240px-Colors_Tamil_logo.svg.png"
      },
      {
        id: "makkaltv",
        num: "#04",
        name: "Makkal TV",
        cat: "General • Live",
        type: "hls",
        url: "https://5k8q87azdy4v-hls-live.wmncdn.net/MAKKAL/271ddf829afeece44d8732757fba1a66.sdp/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/8/87/Makkal_TV_logo.png/240px-Makkal_TV_logo.png"
      },
      {
        id: "historytv18",
        num: "#05",
        name: "History TV18 HD",
        cat: "Infotainment • HD",
        type: "dash-clearkey",
        url: "https://login.bheem.tv/bpk-tv/22652/output/index.mpd",
        kid: "c6cb0bcbeac25fb286fed851e41de38c",
        key: "955c54f2cac8783fafccae5e5f9cdf8d",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/History_Channel_logo.svg/240px-History_Channel_logo.svg.png"
      },
      {
        id: "discoverytamil",
        num: "#06",
        name: "Discovery Tamil",
        cat: "Infotainment • HD",
        type: "dash-clearkey",
        url: "https://login.bheem.tv/bpk-tv/22652/output/index.mpd",
        kid: "c6cb0bcbeac25fb286fed851e41de38c",
        key: "955c54f2cac8783fafccae5e5f9cdf8d",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Discovery_Channel_logo_2019.svg/240px-Discovery_Channel_logo_2019.svg.png"
      }
    ];

    const stage = document.getElementById("stage");
    const videoWrap = document.getElementById("videoWrap");
    const video = document.getElementById("video");
    const bufSpinner = document.getElementById("bufSpinner");
    const flashLeft = document.getElementById("flashLeft");
    const flashRight = document.getElementById("flashRight");
    const liveFsBtn = document.getElementById("liveFsBtn");
    const ytOverlay = document.getElementById("ytOverlay");
    const ytCenterBtn = document.getElementById("ytCenterBtn");
    const muteBtn = document.getElementById("muteBtn");
    const nowTitle = document.getElementById("nowTitle");
    const nowSub = document.getElementById("nowSub");
    const liveTag = document.getElementById("liveTag");
    const seekInput = document.getElementById("seekInput");
    const bufFill = document.getElementById("bufFill");
    const progFill = document.getElementById("progFill");
    const curTxt = document.getElementById("curTxt");
    const durTxt = document.getElementById("durTxt");
    const yplaySub = document.getElementById("yplaySub");

    let hls = null;
    let shakaPlayer = null;
    let activeChannelId = "suntv";
    let yplayItems = [];
    let activeYPlayIdx = -1;
    let isLive = true;
    let seeking = false;
    let firstMoviePrepared = false;
    let overlayTimer = null;
    let lastTapTime = 0;
    let singleTapTimer = null;
    let pendingResumeTime = 0;
    let pendingSeekDelta = 0;
    let seekDebounceTimer = null;
    let flashTimer = null;

    function setBuffering(active) {
      bufSpinner.classList.toggle("show", active);
      ytCenterBtn.classList.toggle("hide", active);
    }

    function setVodMode(vod) {
      isLive = !vod;
      liveTag.style.display = vod ? "none" : "inline-block";
      liveFsBtn.classList.toggle("show", !vod);
      ytOverlay.classList.toggle("enabled", vod);
      if (vod) showOverlayTemporarily();
      else ytOverlay.classList.remove("visible");
    }

    function showOverlayTemporarily() {
      if (isLive) return;
      ytOverlay.classList.add("visible");
      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => {
        if (!video.paused) ytOverlay.classList.remove("visible");
      }, 3000);
    }

    function queueSeekDelta(sec) {
      if (isLive || !isFinite(video.duration) || video.duration <= 0) return;
      pendingSeekDelta += sec;
      const side = pendingSeekDelta < 0 ? "left" : "right";
      const other = side === "left" ? flashRight : flashLeft;
      const el = side === "left" ? flashLeft : flashRight;
      other.classList.remove("show");
      el.textContent = `${pendingSeekDelta > 0 ? "+" : ""}${pendingSeekDelta}s`;
      el.classList.add("show");

      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => {
        flashLeft.classList.remove("show");
        flashRight.classList.remove("show");
      }, 550);

      clearTimeout(seekDebounceTimer);
      seekDebounceTimer = setTimeout(() => {
        const delta = pendingSeekDelta;
        pendingSeekDelta = 0;
        if (!isFinite(video.duration) || video.duration <= 0) return;
        video.currentTime = Math.max(0, Math.min(video.duration - 0.5, video.currentTime + delta));
      }, 240);
    }

    videoWrap.addEventListener("click", (e) => {
      if (isLive) return;
      const now = Date.now();
      const rect = videoWrap.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const isLeft = x < rect.width * 0.45;
      const isRight = x > rect.width * 0.55;

      if (now - lastTapTime < 280) {
        clearTimeout(singleTapTimer);
        lastTapTime = now;
        if (isLeft) queueSeekDelta(-10);
        else if (isRight) queueSeekDelta(10);
        return;
      }

      lastTapTime = now;
      singleTapTimer = setTimeout(() => {
        if (ytOverlay.classList.contains("visible")) {
          ytOverlay.classList.remove("visible");
        } else {
          showOverlayTemporarily();
        }
      }, 280);
    });

    function cleanupPlayersSync() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      if (shakaPlayer) {
        const sp = shakaPlayer;
        shakaPlayer = null;
        sp.destroy().catch(() => {});
      }
      setBuffering(false);
    }

    async function resolveDirectTunnel() {
      try {
        const res = await fetch(`${WORKER_URL}/health?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) {
          serverOnline = false;
          usingDirectTunnel = false;
          return;
        }
        const data = await res.json();
        serverOnline = Boolean(data && data.status === "ok");
        if (data && typeof data.tunnel_url === "string" && data.tunnel_url.startsWith("https://")) {
          DIRECT_STREAM_URL = data.tunnel_url;
          usingDirectTunnel = true;
          return;
        }
      } catch (_) {
        serverOnline = false;
      }
      DIRECT_STREAM_URL = WORKER_URL;
      usingDirectTunnel = false;
    }

    function getStreamUrl(idx) {
      const m = yplayItems[idx];
      const fname = encodeURIComponent((m && m.filename) ? m.filename : "video.mp4");
      return `${DIRECT_STREAM_URL}/dl/${idx}/${fname}`;
    }

    async function playChannel(ch, autoPlay = true) {
      cleanupPlayersSync();
      activeChannelId = ch.id;
      activeYPlayIdx = -1;
      pendingResumeTime = 0;
      setVodMode(false);
      renderChannels();
      renderYPlay();

      nowTitle.textContent = ch.name;
      nowSub.textContent = `${ch.num} • ${ch.cat}`;

      if (ch.type === "dash-clearkey" && window.shaka && shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player();
        await shakaPlayer.attach(video);
        shakaPlayer.configure({
          drm: { clearKeys: { [ch.kid]: ch.key } },
          streaming: { bufferingGoal: 12, rebufferingGoal: 2 }
        });
        try {
          await shakaPlayer.load(ch.url);
          if (autoPlay) video.play().catch(() => {});
        } catch (_) {
          nowSub.textContent = "Unable to start stream";
        }
        return;
      }

      if (ch.url.includes(".m3u8") && window.Hls && window.Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxBufferLength: 16,
          backBufferLength: 10
        });
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (autoPlay) video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) nowSub.textContent = "Stream temporarily unavailable";
        });
      } else {
        video.src = ch.url;
        video.load();
        if (autoPlay) video.play().catch(() => {});
      }
    }

    function startYPlay(idx, autoPlay = false) {
      if (idx < 0 || idx >= yplayItems.length) return;
      cleanupPlayersSync();
      activeChannelId = "";
      activeYPlayIdx = idx;
      setVodMode(true);
      renderChannels();
      renderYPlay();

      const item = yplayItems[idx];
      const mb = item.file_size ? `${(item.file_size / (1024 * 1024)).toFixed(0)} MB` : "Video";
      nowTitle.textContent = item.title;
      nowSub.textContent = `${mb} • ${usingDirectTunnel ? "Direct Tunnel" : "Worker Proxy"}`;

      const saved = Number(localStorage.getItem(`yp_pos_${item.id}`) || "0");
      pendingResumeTime = saved > 5 ? saved : 0;

      bufFill.style.width = "0%";
      progFill.style.width = "0%";
      seekInput.value = "0";
      video.preload = "auto";
      video.src = getStreamUrl(idx);
      video.load();
      if (autoPlay) {
        setBuffering(true);
        video.play().catch(() => setBuffering(false));
      }
    }

    function playNextYPlay() {
      if (!yplayItems.length) return;
      const next = activeYPlayIdx + 1 < yplayItems.length ? activeYPlayIdx + 1 : 0;
      startYPlay(next, true);
    }

    function toggleVodPlay() {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
      showOverlayTemporarily();
    }

    function toggleMute() {
      video.muted = !video.muted;
      muteBtn.innerHTML = video.muted ? "&#128263;" : "&#128266;";
      showOverlayTemporarily();
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (stage.requestFullscreen) await stage.requestFullscreen();
          else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock("landscape").catch(() => {});
          }
        } else {
          if (document.exitFullscreen) await document.exitFullscreen();
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        }
      } catch (_) {}
    }

    function fmt(t) {
      if (!isFinite(t) || t < 0) return "00:00";
      const total = Math.floor(t);
      const hrs = Math.floor(total / 3600);
      const mins = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hrs > 0) {
        return `${hrs}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function updateBufferedBar() {
      if (isLive || !isFinite(video.duration) || video.duration <= 0) return;
      try {
        for (let i = 0; i < video.buffered.length; i++) {
          if (video.buffered.start(i) <= video.currentTime && video.buffered.end(i) >= video.currentTime) {
            const pct = Math.min(100, (video.buffered.end(i) / video.duration) * 100);
            bufFill.style.width = `${pct.toFixed(1)}%`;
            break;
          }
        }
      } catch (_) {}
    }

    video.addEventListener("loadedmetadata", () => {
      if (!isLive && pendingResumeTime > 0 && isFinite(video.duration) && pendingResumeTime < video.duration - 2) {
        video.currentTime = pendingResumeTime;
        pendingResumeTime = 0;
      }
    });
    video.addEventListener("progress", updateBufferedBar);
    video.addEventListener("waiting", () => { if (!isLive) setBuffering(true); });
    video.addEventListener("seeking", () => { if (!isLive) setBuffering(true); });
    video.addEventListener("playing", () => {
      setBuffering(false);
      ytCenterBtn.innerHTML = "&#10074;&#10074;";
      showOverlayTemporarily();
    });
    video.addEventListener("canplay", () => setBuffering(false));
    video.addEventListener("seeked", () => setBuffering(false));
    video.addEventListener("pause", () => {
      setBuffering(false);
      ytCenterBtn.innerHTML = "&#9654;";
      if (!isLive) ytOverlay.classList.add("visible");
    });
    video.addEventListener("error", () => {
      setBuffering(false);
      if (isLive) return;
      const code = video.error ? video.error.code : 0;
      if (code === 4) {
        nowSub.textContent = "Format not supported in browser (use MP4 H.264/AAC)";
      } else if (code === 3) {
        nowSub.textContent = "Video decode error";
      } else if (code === 2) {
        nowSub.textContent = "Network/tunnel error — tap Refresh or check /health";
      } else {
        nowSub.textContent = "Unable to play stream";
      }
      ytOverlay.classList.add("visible");
    });
    video.addEventListener("timeupdate", () => {
      if (isLive || seeking || !isFinite(video.duration) || video.duration <= 0) return;
      const pct = (video.currentTime / video.duration) * 100;
      seekInput.value = String(Math.round(pct * 10));
      progFill.style.width = `${pct.toFixed(2)}%`;
      curTxt.textContent = fmt(video.currentTime);
      durTxt.textContent = fmt(video.duration);
      updateBufferedBar();
      const item = yplayItems[activeYPlayIdx];
      if (item && video.currentTime > 2) {
        localStorage.setItem(`yp_pos_${item.id}`, String(Math.floor(video.currentTime)));
      }
    });
    video.addEventListener("ended", () => {
      setBuffering(false);
      const item = yplayItems[activeYPlayIdx];
      if (item) localStorage.removeItem(`yp_pos_${item.id}`);
      if (!isLive && activeYPlayIdx + 1 < yplayItems.length) {
        startYPlay(activeYPlayIdx + 1, true);
      }
    });

    window.addEventListener("pagehide", () => {
      if (!isLive && yplayItems[activeYPlayIdx] && video.currentTime > 2) {
        localStorage.setItem(`yp_pos_${yplayItems[activeYPlayIdx].id}`, String(Math.floor(video.currentTime)));
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
    });

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && !isLive && activeYPlayIdx >= 0 && !video.getAttribute("src")) {
        await resolveDirectTunnel();
        startYPlay(activeYPlayIdx, false);
      }
    });

    seekInput.addEventListener("input", () => {
      seeking = true;
      const pct = Number(seekInput.value) / 10;
      progFill.style.width = `${pct.toFixed(2)}%`;
      if (isFinite(video.duration) && video.duration > 0) {
        curTxt.textContent = fmt((pct / 100) * video.duration);
      }
    });
    seekInput.addEventListener("change", () => {
      if (!isLive && isFinite(video.duration) && video.duration > 0) {
        setBuffering(true);
        video.currentTime = (Number(seekInput.value) / 1000) * video.duration;
      }
      seeking = false;
      showOverlayTemporarily();
    });

    function renderChannels() {
      const box = document.getElementById("channelList");
      box.innerHTML = CHANNELS.map((ch) => {
        const active = ch.id === activeChannelId ? "ch-card active" : "ch-card";
        return `
          <div class="${active}" tabindex="0" onclick='playChannelById("${ch.id}")' onkeydown='if(event.key==="Enter")playChannelById("${ch.id}")'>
            <div class="ch-left">
              <div class="ch-logo-box">
                <img src="${esc(ch.logo)}" alt="${esc(ch.name)}" onerror="this.style.display='none'" />
              </div>
              <div>
                <div class="ch-name">${esc(ch.name)}</div>
                <div class="ch-meta">${esc(ch.num)} • ${esc(ch.cat)}</div>
              </div>
            </div>
            <div class="ch-eq">${ch.id === activeChannelId ? "•••" : ""}</div>
          </div>
        `;
      }).join("");
    }

    function playChannelById(id) {
      const ch = CHANNELS.find((c) => c.id === id);
      if (ch) playChannel(ch, true);
    }

    function renderYPlay() {
      const box = document.getElementById("yplayList");
      const modeTxt = !serverOnline
        ? "Backend offline — check Worker /health"
        : (usingDirectTunnel ? "Direct Tunnel" : "Worker Proxy");
      yplaySub.textContent = yplayItems.length
        ? `${yplayItems.length} in queue • ${modeTxt}`
        : `Forward a movie to bot • ${modeTxt}`;

      if (!yplayItems.length) {
        box.innerHTML = `<div class="yp-card"><div><div class="yp-title">No movies in queue</div><div class="yp-meta">Forward a movie to your Telegram bot</div></div></div>`;
        return;
      }
      box.innerHTML = yplayItems.map((m, i) => {
        const mb = m.file_size ? `${(m.file_size / (1024 * 1024)).toFixed(0)} MB` : "Video";
        const cls = i === activeYPlayIdx ? "yp-card active" : "yp-card";
        return `
          <div class="${cls}" tabindex="0" onclick="startYPlay(${i}, true)" onkeydown="if(event.key==='Enter')startYPlay(${i},true)">
            <div style="min-width:0;">
              <div class="yp-title">${esc(m.title)}</div>
              <div class="yp-meta">#${i + 1} • ${mb}</div>
            </div>
            <button class="red" onclick="event.stopPropagation();startYPlay(${i},true)">Play</button>
          </div>
        `;
      }).join("");
    }

    async function fetchYPlay(forceFirst = false) {
      try {
        const res = await fetch(`${WORKER_URL}/api/yplay/library?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) {
          serverOnline = false;
          renderYPlay();
          return;
        }
        serverOnline = true;
        const data = await res.json();
        const prevFirst = yplayItems[0] ? yplayItems[0].id : null;
        yplayItems = Array.isArray(data.items) ? data.items : [];
        renderYPlay();

        if (yplayItems.length > 0 && (!firstMoviePrepared || forceFirst || (prevFirst && prevFirst !== yplayItems[0].id && !isLive))) {
          firstMoviePrepared = true;
          if (!isLive) {
            startYPlay(0, false);
          }
        }
      } catch (_) {
        serverOnline = false;
        renderYPlay();
      }
    }

    async function refreshAll() {
      await resolveDirectTunnel();
      await fetchYPlay(true);
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    renderChannels();
    playChannel(CHANNELS[0], false);
    resolveDirectTunnel().then(() => fetchYPlay(false));
    setInterval(() => fetchYPlay(false), 6000);
  </script>
</body>
</html>
