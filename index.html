<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <title>YStream</title>
  <link rel="preconnect" href="https://ystream.hiddencreator-account.workers.dev" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.12/dist/shaka-player.compiled.js"></script>
  <style>
    :root {
      --drawer-bg: rgba(11, 14, 21, 0.98);
      --card: rgba(255, 255, 255, 0.05);
      --active-bg: rgba(255, 255, 255, 0.13);
      --accent: #e50914;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.11);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-focus-ring-color: transparent !important;
      outline: none !important;
    }

    html:focus, body:focus, div:focus, video:focus, aside:focus,
    html:focus-visible, body:focus-visible, div:focus-visible, video:focus-visible, aside:focus-visible {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }

    .hidden {
      display: none !important;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      user-select: none;
    }

    /* 100% Fullscreen Video Stage */
    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
      border: 0 !important;
      opacity: 0;
    }

    video.has-frame {
      opacity: 1;
    }

    /* Full-Black System Shutdown Alert Screen */
    .shutdown-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .shutdown-screen.show {
      opacity: 1;
      pointer-events: auto;
    }

    .shutdown-card {
      max-width: 420px;
      width: 100%;
      background: linear-gradient(180deg, #151923 0%, #0c0f16 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px 26px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.96);
    }

    .shutdown-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(229, 9, 20, 0.14);
      border: 1.5px solid rgba(229, 9, 20, 0.48);
      color: #ff3b46;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutdown-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #fca5a5;
      background: rgba(229, 9, 20, 0.16);
      border: 1px solid rgba(229, 9, 20, 0.34);
      padding: 3px 11px;
      border-radius: 99px;
      margin-bottom: 10px;
    }

    .shutdown-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .shutdown-desc {
      font-size: 0.86rem;
      color: #94a3b8;
      margin-top: 8px;
      line-height: 1.45;
    }

    /* Center Loader Ring */
    .center-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(10, 13, 20, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 19;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease;
    }

    .center-loader.show {
      opacity: 1;
    }

    .center-loader::after {
      content: "";
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      animation: spinRing 0.72s linear infinite;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    /* Double-Back Exit Toast */
    .exit-toast {
      position: fixed;
      bottom: 34px;
      left: 50%;
      transform: translate3d(-50%, 10px, 0);
      z-index: 80;
      background: rgba(16, 20, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 9px 20px;
      border-radius: 99px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .exit-toast.show {
      opacity: 1;
      transform: translate3d(-50%, 0, 0);
    }

    /* Subtitle Overlay */
    .sub-overlay {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 15%;
      z-index: 12;
      text-align: center;
      pointer-events: none;
      display: none;
    }
    .sub-overlay.show { display: block; }
    .sub-text {
      display: inline-block;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: clamp(0.9rem, 2.2vw, 1.3rem);
      font-weight: 600;
      line-height: 1.38;
      padding: 5px 14px;
      border-radius: 8px;
      white-space: pre-line;
    }

    /* Double-Tap Seek Pill */
    .seek-flash {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(14, 18, 26, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 11px 18px;
      border-radius: 99px;
      z-index: 18;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease;
    }
    .seek-flash.left { left: 12%; }
    .seek-flash.right { right: 12%; }
    .seek-flash.show { opacity: 1; }

    /* Error Overlay */
    .player-error {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: rgba(6, 9, 16, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }
    .player-error.show { opacity: 1; pointer-events: auto; }
    .err-card {
      max-width: 380px;
      width: 100%;
      background: #141925;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .err-title { font-size: 1.05rem; font-weight: 800; color: #fff; }
    .err-msg { font-size: 0.84rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .err-actions { margin-top: 16px; display: flex; justify-content: center; gap: 10px; }
    .err-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      border: 1.5px solid transparent;
      cursor: pointer;
    }

    /* Unified Fullscreen Player HUD */
    .hud {
      position: absolute;
      inset: 0;
      z-index: 16;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.72) 0%,
        rgba(0, 0, 0, 0.0) 24%,
        rgba(0, 0, 0, 0.0) 68%,
        rgba(0, 0, 0, 0.84) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 2.8vw, 28px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }

    .hud.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Top Bar */
    .hud-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .hud-top-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.13);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hud-meta { min-width: 0; }

    .hud-title {
      font-size: clamp(0.98rem, 2.2vw, 1.32rem);
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-sub {
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    /* Big DTH Dish Channel Banner (Live TV) */
    .dish-osd {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(14, 17, 25, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 10px 18px;
      border-radius: 16px;
      flex-shrink: 0;
    }

    .dish-num {
      font-size: clamp(1.85rem, 3.6vw, 2.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.5px;
      color: #fff;
      font-variant-numeric: tabular-nums;
      padding-right: 14px;
      border-right: 1px solid rgba(255, 255, 255, 0.16);
    }

    .dish-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .dish-name {
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      font-weight: 800;
      color: #fff;
    }

    .dish-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* Center Play/Pause Button (YPlay Only) */
    .center-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(15, 18, 26, 0.78);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.14s ease;
    }

    .center-play-btn.loading-hide {
      opacity: 0 !important;
      pointer-events: none;
    }

    /* Bottom Controls & GPU-Accelerated YouTube Progress Bar */
    .hud-bottom {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .yt-progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .time-lbl {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
      min-width: 48px;
    }
    .time-lbl.end { text-align: right; }

    .yt-track-wrap {
      position: relative;
      flex: 1;
      height: 30px;
      display: flex;
      align-items: center;
      cursor: pointer;
      border: none !important;
      background: transparent !important;
    }

    .yt-track-bg {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.26);
      overflow: hidden;
      transition: height 0.12s ease, background 0.12s ease;
    }

    .yt-track-wrap:focus .yt-track-bg,
    .yt-track-wrap:focus-visible .yt-track-bg,
    .yt-track-wrap.scrubbing .yt-track-bg {
      height: 7px;
      background: rgba(255, 255, 255, 0.42);
    }

    .yt-track-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      background: #ff2a36;
      will-change: transform;
    }

    .yt-track-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%) scale(0.75);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ff2a36;
      border: 2px solid #fff;
      will-change: left, transform;
    }

    .yt-track-wrap:focus .yt-track-thumb,
    .yt-track-wrap:focus-visible .yt-track-thumb {
      transform: translate(-50%, -50%) scale(1.25);
    }

    .yt-track-wrap.scrubbing .yt-track-thumb {
      transform: translate(-50%, -50%) scale(1.42);
      background: #fff;
      border-color: #ff2a36;
    }

    .scrub-bubble {
      position: absolute;
      bottom: 26px;
      left: 0%;
      transform: translateX(-50%);
      background: #121620;
      border: 1px solid rgba(255, 255, 255, 0.26);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }

    .yt-track-wrap.scrubbing .scrub-bubble {
      opacity: 1;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-grp {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 11px;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      cursor: pointer;
    }

    /* Popover Menus */
    .pop-wrap { position: relative; }

    .pop-menu {
      position: absolute;
      bottom: 46px;
      right: 0;
      background: #10141e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 126px;
      max-height: 220px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.12s ease, transform 0.12s ease;
      z-index: 40;
    }

    .pop-menu.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .pop-opt {
      width: 100%;
      text-align: center;
      background: transparent;
      border: 1.5px solid transparent;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      cursor: pointer;
    }

    .pop-opt.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Left Slide-Over Side Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.62);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .side-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(390px, 86vw);
      z-index: 60;
      background: var(--drawer-bg);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      transform: translate3d(-102%, 0, 0);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      backface-visibility: hidden;
    }

    .side-drawer.open { transform: translate3d(0, 0, 0); }

    .drawer-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .drawer-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-brand {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      color: #fff;
    }

    .drawer-brand span { color: var(--accent); }

    .drawer-hint { font-size: 0.72rem; color: var(--muted); }

    .drawer-tabs { display: flex; gap: 8px; }

    .d-tab {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid transparent;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
    }

    .d-tab.active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .d-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    .drawer-scroll {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      will-change: scroll-position;
      padding: 14px 14px 44px;
    }

    .list-pane {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .d-item {
      background: var(--card);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 10px 12px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      cursor: pointer;
      contain: layout style paint;
    }

    .d-item.active {
      background: var(--active-bg);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .d-item-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }

    .ch-logo {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: #161c28;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .ch-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 2;
    }

    .ch-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      font-weight: 800;
      color: #fff;
      z-index: 1;
    }

    .yp-badge {
      width: 44px;
      height: 50px;
      border-radius: 9px;
      background: linear-gradient(160deg, #1e2430 0%, #0f131a 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px 3px 4px;
      flex-shrink: 0;
      color: #fff;
    }

    .d-item.active .yp-badge {
      background: linear-gradient(160deg, #dc2626 0%, #7f1d1d 100%);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .yp-num {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.45);
    }

    .d-info { min-width: 0; flex: 1; }

    .d-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .d-meta {
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .d-tag {
      font-size: 0.66rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }

    .d-tag.live {
      background: rgba(229, 9, 20, 0.28);
      color: #fca5a5;
    }

    /* TV Focus Styles */
    .icon-btn:focus,
    .icon-btn:focus-visible,
    .icon-btn:hover,
    .ctrl-btn:focus,
    .ctrl-btn:focus-visible,
    .ctrl-btn:hover,
    .err-btn:focus,
    .err-btn:focus-visible,
    .err-btn:hover {
      background: rgba(255, 255, 255, 0.24) !important;
      border-color: rgba(255, 255, 255, 0.85) !important;
      transform: scale(1.04);
    }

    .pop-opt:focus,
    .pop-opt:focus-visible,
    .pop-opt:hover,
    .d-tab:focus,
    .d-tab:focus-visible,
    .d-tab:hover,
    .d-item:focus,
    .d-item:focus-visible,
    .d-item:hover {
      background: rgba(255, 255, 255, 0.22) !important;
      border-color: rgba(255, 255, 255, 0.85) !important;
    }

    .center-play-btn:focus,
    .center-play-btn:focus-visible,
    .center-play-btn:hover {
      background: rgba(255, 255, 255, 0.24) !important;
      border-color: rgba(255, 255, 255, 0.85) !important;
    }

    @keyframes clickBounce {

    async function applySystemStopped(stopped) {
      const next = Boolean(stopped);
      if (next === isSystemStopped) return;
      isSystemStopped = next;

      if (isSystemStopped) {
        if (isLive) {
          shutdownSnapshot = { mode: "live", channelId: activeChannelId };
        } else {
          const curPos = Math.floor(getEffectiveTime());
          const item = yplayItems[activeYPlayIdx];

        }

        playSessionId++;
        isZapping = false;
        closeDrawer(false);
        hideHud();
        hideError();
        hideLoading();
        await cleanupPlayers();

        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
        }
        shutdownScreen.classList.add("show");
      } else {
        shutdownScreen.classList.remove("show");
        const snap = shutdownSnapshot;
        shutdownSnapshot = null;

        await resolveDirectTunnel();
        if (snap && snap.mode === "yplay" && snap.yplayIdx >= 0) {
          await fetchYPlay(false);
          if (snap.yplayIdx < yplayItems.length) {
            loadYPlay(snap.yplayIdx, true, snap.yplayPos || null);
            return;
          }
        }
        const ch = CHANNELS.find((c) => c.id === (snap?.channelId || activeChannelId)) || CHANNELS[0];
        playChannel(ch, true, true);
      }

      if (eventSource) {
        try { eventSource.close(); } catch (_) {}
        eventSource = null;
      }
      if (!window.EventSource) return;
      try {
        eventSource = new EventSource(`${DIRECT_STREAM_URL}/api/events`);
        eventSource.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg && typeof msg.stopped === "boolean") {
              applySystemStopped(msg.stopped);
            }
            if (msg && msg.type === "library") {

          } catch (_) {}

          eventSource = null;
          setTimeout(() => {
            if (document.visibilityState === "visible") {
              resolveDirectTunnel().then(connectSystemEvents);
            }

      try {

        try {
          const keys = Object.keys(localStorage).filter((x) => x.startsWith("yp_pos_"));

      const now = Date.now();

    function triggerBounce(el) {
      if (!el || el === progressBar || el === centerPlayBtn) return;
      el.classList.remove("click-bounce");
      void el.offsetWidth;
      el.classList.add("click-bounce");

    function showLoading(immediate = false) {
      if (isSystemStopped) return;
      clearTimeout(loadDebounce);
      if (immediate) {
        centerLoader.classList.add("show");
        centerPlayBtn.classList.add("loading-hide");
      } else {
        loadDebounce = setTimeout(() => {
          if (!video.paused && !playerError.classList.contains("show") && !isSystemStopped) {
            centerLoader.classList.add("show");
            centerPlayBtn.classList.add("loading-hide");
          }
        }, 220);
      }

      clearTimeout(loadDebounce);
      centerLoader.classList.remove("show");

      centerPlayBtn.innerHTML = video.paused ? ICONS.play : ICONS.pause;
      muteBtn.innerHTML = userMuted ? ICONS.volOff : ICONS.volOn;
    }

    async function safePlayVideo() {
      if (isSystemStopped) return;
      try {
        await video.play();
      } catch (err) {
        if (err && err.name === "NotAllowedError" && !video.muted) {
          autoMutedForBoot = true;
          video.muted = true;
          syncIcons();
          video.play().catch(() => {});
        }
      }
    }

    function showError(title, msg) {
      if (isSystemStopped) return;
      hideLoading();
      errTitle.textContent = title;
      errMsg.textContent = msg;
      playerError.classList.add("show");
      setTimeout(() => document.getElementById("errRetryBtn").focus(), 40);
    }

    function hideError() { playerError.classList.remove("show"); }

    function retryCurrentMedia() {
      if (isSystemStopped) return;
      hideError();
      if (isLive) {
        liveFailCount = 0;
        const ch = CHANNELS.find((c) => c.id === activeChannelId) || CHANNELS[0];
        playChannel(ch, true, true);
      } else if (activeYPlayIdx >= 0) {
        errorRetries = 0;
        loadYPlay(activeYPlayIdx, true);
      }

    /* Unified HUD Show / Hide */
    function isHudVisible() { return hud.classList.contains("visible"); }

    function showHud(preferredFocus = null, autoHideMs = 4200) {
      if (drawerOpen || isSystemStopped) return;
      hud.classList.add("visible");
      const target = getBestHudFocus(preferredFocus);
      target.focus({ preventScroll: true });
      resetHudTimer(autoHideMs);
    }

    function hideHud() {
      exitScrubMode(false);
      closeAllPops();
      hud.classList.remove("visible");
      if (document.activeElement && hud.contains(document.activeElement)) {
        document.activeElement.blur();
      }
    }

    function resetHudTimer(ms = 4200) {
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        if (!drawerOpen && !hasOpenPop() && !isScrubbing && (isLive || !video.paused)) {
          hideHud();
        }
      }, ms);

      document.querySelectorAll(".pop-menu.open").forEach((el) => {
        if (el.id !== exceptId) el.classList.remove("open");

      if (!exceptId) activePopupTrigger = null;

      const menu = document.getElementById(id);
      if (!menu) return;
      const wasOpen = menu.classList.contains("open");
      const trigger = menu.parentElement.querySelector("button");
      closeAllPops(id);
      menu.classList.toggle("open", !wasOpen);
      if (!wasOpen) {
        activePopupTrigger = trigger;
        lastHudFocusEl = trigger;
        resetHudTimer(5500);
        const activeOpt = menu.querySelector(".pop-opt.active") || menu.querySelector(".pop-opt");
        if (activeOpt) activeOpt.focus({ preventScroll: true });

        else {
          let bestIdx = -1, bestBr = -1;
          hls.levels.forEach((lv, i) => {
            if (lv.height === q && (lv.bitrate || 0) >= bestBr) { bestBr = lv.bitrate || 0; bestIdx = i; }
          });
          if (bestIdx >= 0) hls.currentLevel = bestIdx;

      } else if (shakaPlayer) {
        if (q === "auto") shakaPlayer.configure({ abr: { enabled: true } });

          if (tracks.length) shakaPlayer.selectVariantTrack(tracks[0], true);

      updateLiveQualUi();
      closeAllPops();

    function getCleanVodAudioTracks(item) {
      const raw = Array.isArray(item.audio_tracks) ? item.audio_tracks : [];
      if (!raw.length) return [];

      const seen = new Set();
      const unique = [];
      for (const t of raw) {
        const baseLabel = String(t.label || "Audio").trim();
        const codec = String(t.codec || "").toLowerCase();
        const key = `${baseLabel.toLowerCase()}|${codec}`;
        if (seen.has(key)) continue;
        seen.add(key);
        unique.push({ ...t, cleanLabel: baseLabel });
      }

      const counts = {};
      for (const u of unique) counts[u.cleanLabel] = (counts[u.cleanLabel] || 0) + 1;
      const seenNum = {};
      for (const u of unique) {
        if (counts[u.cleanLabel] > 1) {
          const c = (u.codec || "").toLowerCase();
          if (c === "eac3" || c === "ac3" || c === "dts") u.cleanLabel = `${u.cleanLabel} (5.1)`;
          else {
            seenNum[u.cleanLabel] = (seenNum[u.cleanLabel] || 0) + 1;
            if (seenNum[u.cleanLabel] > 1) u.cleanLabel = `${u.cleanLabel} (${seenNum[u.cleanLabel]})`;
          }
        }
      }
      return unique;
    }

      const subs = Array.isArray(item.subtitles) ? item.subtitles : [];

    /* GPU-Accelerated Progressive Progress Bar */
    function renderProgressVisual(curSec, durSec) {
      const ratio = durSec > 0 ? Math.max(0, Math.min(1, curSec / durSec)) : 0;
      const pct = ratio * 100;
      progressFill.style.transform = `scaleX(${ratio})`;
      progressThumb.style.left = `${pct}%`;
      scrubBubble.style.left = `${pct}%`;
      scrubBubble.textContent = fmt(curSec);
      curTxt.textContent = fmt(curSec);
      if (durSec > 0) durTxt.textContent = fmt(durSec);
    }

    function enterScrubMode() {
      const dur = getEffectiveDuration();
      if (isLive || dur <= 0) return;
      isScrubbing = true;
      scrubHoldCount = 0;
      scrubLastDir = "";
      lastHudFocusEl = progressBar;
      scrubPreviewSec = getEffectiveTime();
      progressBar.classList.add("scrubbing");
      progressBar.focus({ preventScroll: true });
      renderProgressVisual(scrubPreviewSec, dur);
      clearTimeout(hudTimer);
    }

    function exitScrubMode(commitSeek = false) {
      if (!isScrubbing) return;
      const target = scrubPreviewSec;
      isScrubbing = false;
      scrubHoldCount = 0;
      scrubLastDir = "";
      progressBar.classList.remove("scrubbing");
      if (commitSeek) {
        seekYPlayTo(target);
      } else {
        renderProgressVisual(getEffectiveTime(), getEffectiveDuration());
      }
      resetHudTimer();
    }

    function stepScrubAccelerated(dir, isRepeat) {
      const dur = getEffectiveDuration();
      if (dur <= 0) return;
      const now = Date.now();
      if (isRepeat && scrubLastDir === dir && now - scrubLastAt < 350) {
        scrubHoldCount += 1;
      } else {
        scrubHoldCount = 0;
      }
      scrubLastDir = dir;
      scrubLastAt = now;

      // Smooth velocity curve: 10s precision tap -> 20s -> 45s -> 90s -> 120s max stride
      let step = 10;
      if (scrubHoldCount > 24) step = 120;
      else if (scrubHoldCount > 14) step = 90;
      else if (scrubHoldCount > 7) step = 45;
      else if (scrubHoldCount > 2) step = 20;

      const delta = dir === "RIGHT" ? step : -step;
      scrubPreviewSec = Math.max(0, Math.min(dur - 1, scrubPreviewSec + delta));
      renderProgressVisual(scrubPreviewSec, dur);
    }

    progressBar.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isLive) return;
      const dur = getEffectiveDuration();
      if (dur <= 0) return;
      const rect = progressBar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const target = ratio * dur;
      if (isScrubbing) exitScrubMode(false);
      seekYPlayTo(target);
      resetHudTimer();
    });

    /* Seek Helpers (Guards against bogus <30s fragment duration on large movies) */
    function getEffectiveDuration() {
      const item = yplayItems[activeYPlayIdx];
      const itemDur = item && Number(item.duration) > 0 ? Number(item.duration) : 0;
      const isLargeFile = item && Number(item.file_size) > 20 * 1024 * 1024;

      if (transcodeMode) {
        if (itemDur > 0) return itemDur;
        return isFinite(video.duration) && video.duration > 0 ? baseOffset + video.duration : 0;
      }
      const vidDur = isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
      if (isLargeFile && vidDur > 0 && vidDur < 30 && itemDur >= 30) {
        return itemDur;
      }
      return Math.max(vidDur, itemDur);
    }

    function getEffectiveTime() {
      const cur = video.currentTime || 0;
      return transcodeMode ? baseOffset + cur : cur;
    }

    function showSeekPill(text, side) {
      const target = side === "left" ? seekLeftFlash : seekRightFlash;
      const other = side === "left" ? seekRightFlash : seekLeftFlash;
      other.classList.remove("show");
      target.textContent = text;
      target.classList.add("show");
      clearTimeout(seekFlashTimer);
      seekFlashTimer = setTimeout(() => {
        seekLeftFlash.classList.remove("show");
        seekRightFlash.classList.remove("show");
      }, 650);
    }

    function queueSeekDelta(sec) {
      if (isLive || isSystemStopped) return;
      const dur = getEffectiveDuration();
      if (dur <= 0) return;
      pendingSeekDelta += sec;
      const side = pendingSeekDelta < 0 ? "left" : "right";
      showSeekPill(`${pendingSeekDelta > 0 ? "+" : ""}${pendingSeekDelta}s`, side);
      clearTimeout(seekExecTimer);
      seekExecTimer = setTimeout(() => {
        const delta = pendingSeekDelta;
        pendingSeekDelta = 0;
        seekYPlayTo(getEffectiveTime() + delta);
      }, 240);
    }

    function seekYPlayTo(targetSec) {
      if (isLive || isSystemStopped) return;
      const dur = getEffectiveDuration();
      const clamped = Math.max(0, dur > 1 ? Math.min(dur - 1, targetSec) : targetSec);
      renderProgressVisual(clamped, dur);
      if (transcodeMode) {
        restartYPlayAt(clamped);
      } else if (dur > 0) {
        showLoading(false);
        video.currentTime = clamped;
        if (vodSubIdx >= 0) loadSubtitleWindow(clamped);
      }
    }

    /* Touch Tap & Double-Tap on Fullscreen Video */
    stage.addEventListener("click", (e) => {
      if (isSystemStopped || drawerOpen || playerError.classList.contains("show")) return;
      if (hasOpenPop()) {
        const trigger = activePopupTrigger;
        closeAllPops();
        if (trigger) trigger.focus({ preventScroll: true });
        return;
      }

      if (isLive) {
        if (video.paused) safePlayVideo();
        if (isHudVisible()) hideHud();
        else showHud(lastHudFocusEl, 4200);
        return;
      }

      const now = Date.now();
      const rect = stage.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const isLeft = x < rect.width * 0.42;
      const isRight = x > rect.width * 0.58;

      if (now - lastTouchTap < 320) {
        clearTimeout(touchSingleTimer);
        lastTouchTap = now;
        if (isLeft) queueSeekDelta(-10);
        else if (isRight) queueSeekDelta(10);
        return;
      }

      lastTouchTap = now;
      touchSingleTimer = setTimeout(() => {
        if (isHudVisible()) hideHud();
        else showHud(centerPlayBtn, 4200);
      }, 320);
    });

    /* Subtitles Parser & Loader */
    function parseVttTime(s) {
      const p = s.trim().split(":");
      if (p.length === 3) return Number(p[0]) * 3600 + Number(p[1]) * 60 + parseFloat(p[2]);
      if (p.length === 2) return Number(p[0]) * 60 + parseFloat(p[1]);
      return 0;
    }

    function parseVttCues(vtt, offsetSec) {
      const blocks = vtt.replace(/\r/g, "").split("\n\n");
      const out = [];
      for (const blk of blocks) {
        const lines = blk.trim().split("\n");
        const arrowIdx = lines.findIndex((l) => l.includes("-->"));
        if (arrowIdx < 0) continue;
        const [a, b] = lines[arrowIdx].split("-->");
        const start = offsetSec + parseVttTime(a);
        const end = offsetSec + parseVttTime(b.split(" ")[0]);
        const text = lines.slice(arrowIdx + 1).join("\n").replace(/<[^>]+>/g, "").trim();
        if (text && end > start) out.push({ start, end, text });
      }
      return out;
    }

    async function loadSubtitleWindow(curSec) {
      if (vodSubIdx < 0 || activeYPlayIdx < 0 || subLoading) return;
      subLoading = true;
      const start = Math.max(0, Math.floor(curSec));
      const session = playSessionId;
      try {
        const res = await fetch(`${DIRECT_STREAM_URL}/api/yplay/sub/${activeYPlayIdx}/${vodSubIdx}.vtt?t=${start}&dur=180`);
        const txt = await res.text();
        if (session === playSessionId) {
          subCues = parseVttCues(txt, start);
          subFetchStart = start;
        }
      } catch (_) {
        subCues = [];
      } finally {
        subLoading = false;
      }
    }

    function renderActiveSubtitle(curSec) {
      if (isLive || vodSubIdx < 0) {
        subOverlay.classList.remove("show");
        return;
      }
      if (subFetchStart < 0 || curSec < subFetchStart || curSec > subFetchStart + 160) {
        loadSubtitleWindow(curSec);
      }
      const cue = subCues.find((c) => curSec >= c.start && curSec <= c.end);
      if (cue) {
        subText.textContent = cue.text;
        subOverlay.classList.add("show");
      } else {
        subOverlay.classList.remove("show");
      }
    }

    /* Playback Engines */
    async function cleanupPlayers() {
      clearTimeout(liveFailTimer);
      clearTimeout(unmuteTimer);
      hideError();
      video.classList.remove("has-frame");
      video.muted = true;
      try { video.pause(); } catch (_) {}

      if (hls) {
        try { hls.stopLoad(); hls.detachMedia(); hls.destroy(); } catch (_) {}
        hls = null;
      }
      if (shakaPlayer) {
        try { await shakaPlayer.unload(); await shakaPlayer.destroy(); } catch (_) {}
        shakaPlayer = null;
      }
      try {
        video.removeAttribute("src");
        video.load();
      } catch (_) {}
    }

    async function resolveDirectTunnel() {
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 4500);
        const res = await fetch(`${WORKER_URL}/health?t=${Date.now()}`, { cache: "no-store", signal: ctrl.signal });
        clearTimeout(tid);
        const data = await res.json();
        if (data && typeof data.stopped === "boolean" && data.stopped) {
          await applySystemStopped(true);
        }
        if (data && typeof data.tunnel_url === "string" && data.tunnel_url.startsWith("https://")) {
          DIRECT_STREAM_URL = data.tunnel_url;
        }
      } catch (_) {}
    }

    function extractUniqueLiveAudio(list) {
      const seen = new Set();
      const out = [];
      list.forEach((item, idx) => {
        const label = normLangName(item.lang, idx);
        if (seen.has(label)) return;
        seen.add(label);
        out.push({ id: item.id, label });
      });
      return out;
    }

    function startHlsUrl(url, ch, autoPlay, session) {
      if (session !== playSessionId || isSystemStopped) return;
      if (hls) { hls.destroy(); hls = null; }
      if (window.Hls && window.Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxBufferLength: 10,
          maxMaxBufferLength: 20,
          backBufferLength: 6,
          startFragPrefetch: true
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (session !== playSessionId || activeChannelId !== ch.id || isSystemStopped) return;
          hideError();
          liveAvailableHeights = Array.from(new Set((hls.levels || []).map((lv) => lv.height || 0).filter((h) => h > 0))).sort((a, b) => b - a);
          updateLiveQualUi();
          hls.currentLevel = -1;

          const aTracks = (hls.audioTracks || []).map((t, idx) => ({ id: idx, lang: t.lang || t.name || "" }));
          liveAudioOptions = extractUniqueLiveAudio(aTracks);
          if (liveAudioOptions.length >= 2) {
            const tam = liveAudioOptions.find((x) => x.label === "Tamil") || liveAudioOptions[0];
            selectedLiveAudio = String(tam.id);
            hls.audioTrack = Number(tam.id);
          }
          updateLiveAudioUi();
          if (autoPlay) safePlayVideo();
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal || session !== playSessionId || activeChannelId !== ch.id) return;
          handleLiveFallback(ch, autoPlay, session, data.details || "Network error");
        });
      } else {
        liveAvailableHeights = [];
        liveAudioOptions = [];
        updateLiveQualUi();
        updateLiveAudioUi();
        video.src = url;
        video.load();
        if (autoPlay) safePlayVideo();
      }
    }

    async function handleLiveFallback(ch, autoPlay, session, reason = "Stream offline") {
      if (session !== playSessionId || activeChannelId !== ch.id || !isLive || isZapping || isSystemStopped) return;

      if (liveStage === 0 && video.canPlayType("application/vnd.apple.mpegurl")) {
        liveStage = 1;
        await cleanupPlayers();
        if (session !== playSessionId) return;
        liveAvailableHeights = [];
        liveAudioOptions = [];
        updateLiveQualUi();
        updateLiveAudioUi();
        video.src = ch.url;
        video.load();
        if (autoPlay) safePlayVideo();
        return;
      }

      if (liveFailCount < CHANNELS.length - 1) {
        liveFailCount += 1;
        const curIdx = CHANNELS.findIndex((c) => c.id === ch.id);
        const nextCh = CHANNELS[(curIdx + 1) % CHANNELS.length];
        dishNum.textContent = nextCh.num;
        dishName.textContent = nextCh.name;
        showHud(lastHudFocusEl, 4200);
        showLoading(true);
        clearTimeout(liveFailTimer);
        liveFailTimer = setTimeout(() => {
          if (session === playSessionId && isLive && activeChannelId === ch.id) {
            playChannel(nextCh, true, false);
          }
        }, 550);
        return;
      }

      showError("Live TV Unavailable", `All channels failed to load (${reason}). Check internet and tap Retry.`);
    }

    /* Fast Dish Channel Zapping */
    function zapChannel(step) {
      if (isSystemStopped) return;
      const curIdx = CHANNELS.findIndex((c) => c.id === activeChannelId);
      const baseIdx = curIdx >= 0 ? curIdx : 0;
      const nextIdx = (baseIdx + step + CHANNELS.length) % CHANNELS.length;
      const nextCh = CHANNELS[nextIdx];

      playSessionId++;
      isZapping = true;
      activeChannelId = nextCh.id;
      dishNum.textContent = nextCh.num;
      dishName.textContent = nextCh.name;
      liveAvailableHeights = [];
      liveAudioOptions = [];
      updateLiveAudioUi();
      updateLiveQualUi();

      cleanupPlayers();
      showHud(lastHudFocusEl, 4200);
      showLoading(true);

      clearTimeout(zapDebounceTimer);
      zapDebounceTimer = setTimeout(() => {
        isZapping = false;
        playChannel(nextCh, true, true);
      }, 130);
    }

    async function playChannel(ch, autoPlay = true, resetFail = true) {
      if (isSystemStopped) return;
      const session = ++playSessionId;
      isZapping = false;
      await cleanupPlayers();
      if (session !== playSessionId || isSystemStopped) return;

      if (resetFail) liveFailCount = 0;
      activeChannelId = ch.id;
      activeYPlayIdx = -1;
      dishNum.textContent = ch.num;
      dishName.textContent = ch.name;
      pendingResumeTime = 0;
      transcodeMode = false;
      baseOffset = 0;
      liveStage = 0;
      selectedLiveQuality = "auto";
      liveAvailableHeights = [];
      liveAudioOptions = [];
      selectedLiveAudio = "";
      video.playbackRate = 1;
      lastHudFocusEl = menuBtn;

      configureHudMode(false);
      showHud(menuBtn, 4200);
      showLoading(true);

      const isDash = ch.type === "dash" || ch.type === "dash-clearkey" || ch.url.includes(".mpd");
      if (isDash && window.shaka && shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player();
        await shakaPlayer.attach(video);
        if (session !== playSessionId || isSystemStopped) return;

        const cfg = {
          abr: { enabled: true },
          streaming: { bufferingGoal: 6, rebufferingGoal: 1.5 }
        };
        if (ch.kid && ch.key) {
          cfg.drm = { clearKeys: { [ch.kid]: ch.key } };
        }
        shakaPlayer.configure(cfg);
        shakaPlayer.addEventListener("error", (ev) => {
          if (session === playSessionId && activeChannelId === ch.id) {
            handleLiveFallback(ch, autoPlay, session, `Code ${ev && ev.detail ? ev.detail.code : "Network"}`);
          }
        });
        try {
          await shakaPlayer.load(ch.url);
          if (session !== playSessionId || activeChannelId !== ch.id || isSystemStopped) return;
          hideError();
          liveAvailableHeights = Array.from(new Set(shakaPlayer.getVariantTracks().map((t) => t.height || 0).filter((h) => h > 0))).sort((a, b) => b - a);
          updateLiveQualUi();

          const langs = (shakaPlayer.getAudioLanguages() || []).map((l) => ({ id: l, lang: l }));
          liveAudioOptions = extractUniqueLiveAudio(langs);
          if (liveAudioOptions.length >= 2) {
            const tam = liveAudioOptions.find((x) => x.label === "Tamil") || liveAudioOptions[0];
            selectedLiveAudio = String(tam.id);
            shakaPlayer.selectAudioLanguage(String(tam.id));
          }
          updateLiveAudioUi();
          if (autoPlay) safePlayVideo();
        } catch (_) {
          if (session === playSessionId && activeChannelId === ch.id) {
            handleLiveFallback(ch, autoPlay, session, "Stream offline");
          }
        }
        return;
      }

      if (ch.url.includes(".m3u8")) startHlsUrl(ch.url, ch, autoPlay, session);
      else {
        video.src = ch.url;
        video.load();
        if (autoPlay) safePlayVideo();
      }
    }

    function restartYPlayAt(targetSec) {
      if (isSystemStopped) return;
      const item = yplayItems[activeYPlayIdx];
      if (!item) return;
      playSessionId++;
      video.classList.remove("has-frame");
      video.muted = true;
      const clamped = Math.max(0, Math.floor(targetSec));
      const needsTranscode = Boolean(item.compat_audio) || vodQuality !== "orig" || vodAudioIdx !== 0;
      transcodeMode = needsTranscode;

      showLoading(true);
      if (transcodeMode) {
        baseOffset = clamped;
        pendingResumeTime = 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/play/${activeYPlayIdx}?t=${baseOffset}&q=${vodQuality}&a=${vodAudioIdx}`;
      } else {
        baseOffset = 0;
        pendingResumeTime = clamped > 2 ? clamped : 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/stream/${activeYPlayIdx}`;
      }
      video.load();
      video.playbackRate = currentSpeed;
      safePlayVideo();
      if (vodSubIdx >= 0) loadSubtitleWindow(clamped);
    }

    async function loadYPlay(idx, autoPlay = true, forceOffset = null) {
      if (isSystemStopped || idx < 0 || idx >= yplayItems.length) return;
      const session = ++playSessionId;
      isZapping = false;
      await cleanupPlayers();
      if (session !== playSessionId || isSystemStopped) return;

      activeChannelId = "";
      activeYPlayIdx = idx;
      errorRetries = 0;
      audioAutoChecked = false;
      vodQuality = "orig";
      subCues = [];
      subFetchStart = -1;
      subOverlay.classList.remove("show");
      exitScrubMode(false);
      lastHudFocusEl = centerPlayBtn;

      const item = yplayItems[idx];
      populateYPlayTracks(item);
      configureHudMode(true);

      const gbStr = fmtGB(item.file_size);
      const qStr = item.quality || "HD";
      transcodeMode = Boolean(item.compat_audio) || vodAudioIdx !== 0 || forceOffset !== null;

      hudTitle.textContent = item.title;
      hudSub.textContent = `${qStr} • ${gbStr}`;
      showHud(centerPlayBtn, 4200);
      showLoading(true);

      const saved = forceOffset !== null
        ? forceOffset
        : Number(safeGetStorage(`yp_pos_${item.id}`, "0"));

      if (transcodeMode) {
        baseOffset = saved > 5 ? Math.floor(saved) : 0;
        pendingResumeTime = 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/play/${idx}?t=${baseOffset}&q=${vodQuality}&a=${vodAudioIdx}`;
      } else {
        baseOffset = 0;
        pendingResumeTime = saved > 5 ? saved : 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/stream/${idx}`;
      }

      const initDur = Number(item.duration || 0);
      renderProgressVisual(saved > 5 ? saved : 0, initDur);

      video.load();
      video.playbackRate = currentSpeed;
      if (autoPlay) safePlayVideo();
    }

    function playNextYPlay() {
      if (!yplayItems.length || isSystemStopped) return;
      loadYPlay(activeYPlayIdx + 1 < yplayItems.length ? activeYPlayIdx + 1 : 0, true);
    }

    function toggleVodPlay() {
      if (isLive || isSystemStopped) return;
      lastHudFocusEl = centerPlayBtn;
      if (video.paused) {
        safePlayVideo();
        resetHudTimer(2200);
      } else {
        video.pause();
        clearTimeout(hudTimer);
      }
    }

    function toggleMute() {
      userMuted = !userMuted;
      autoMutedForBoot = false;
      video.muted = userMuted;
      lastHudFocusEl = muteBtn;
      syncIcons();
      resetHudTimer();
    }

    /* Video Events */
    video.addEventListener("loadedmetadata", () => {
      hideError();
      if (!isLive) {
        video.playbackRate = currentSpeed;
        const dur = getEffectiveDuration();
        renderProgressVisual(getEffectiveTime(), dur);
        if (!transcodeMode && pendingResumeTime > 0 && isFinite(video.duration) && pendingResumeTime < video.duration - 2) {
          video.currentTime = pendingResumeTime;
          pendingResumeTime = 0;
        }
      }
    });

    video.addEventListener("loadeddata", () => {
      hideError();
      hideLoading();
      if (video.videoWidth > 0) video.classList.add("has-frame");
    });

    video.addEventListener("playing", () => {
      if (isSystemStopped) {
        video.pause();
        return;
      }
      hideError();
      hideLoading();
      video.classList.add("has-frame");

      clearTimeout(unmuteTimer);
      unmuteTimer = setTimeout(() => {
        if (!isSystemStopped && !userMuted && !autoMutedForBoot) {
          video.muted = false;
        }
        syncIcons();
      }, 60);

      syncIcons();
      if (isLive) liveFailCount = 0;
      if (isHudVisible() && !isScrubbing) resetHudTimer(3200);
    });

    video.addEventListener("waiting", () => {
      if (!video.paused && !isZapping && !isSystemStopped) {
        showLoading(false);
      }
    });

    video.addEventListener("pause", () => {
      hideLoading();
      syncIcons();
      if (!isLive && !drawerOpen && !shuttingDown && !isSystemStopped && video.getAttribute("src")) {
        showHud(lastHudFocusEl, 6000);
        clearTimeout(hudTimer);
      }
    });

    video.addEventListener("error", async () => {
      if (shuttingDown || isZapping || isSystemStopped || !video.getAttribute("src")) return;
      if (isLive) {
        const ch = CHANNELS.find((c) => c.id === activeChannelId);
        if (ch) handleLiveFallback(ch, true, playSessionId, "Stream failed");
        return;
      }
      if (!isLive && activeYPlayIdx >= 0 && errorRetries < 2) {
        errorRetries += 1;
        await resolveDirectTunnel();
        restartYPlayAt(getEffectiveTime());
      } else {
        showError("Playback Error", "Unable to load this video from server. Check internet and tap Retry.");
      }
    });

    video.addEventListener("timeupdate", () => {
      if (isLive || isSystemStopped) return;
      const cur = getEffectiveTime();
      const dur = getEffectiveDuration();

      if (!transcodeMode && !audioAutoChecked && !video.muted && (video.currentTime || 0) > 2.2) {
        audioAutoChecked = true;
        if (typeof video.webkitAudioDecodedByteCount === "number" && video.webkitAudioDecodedByteCount === 0) {
          loadYPlay(activeYPlayIdx, true, Math.floor(cur));
          return;
        }
      }

      if (!isScrubbing) {
        renderProgressVisual(cur, dur);
      }
      renderActiveSubtitle(cur);

      const now = Date.now();
      const item = yplayItems[activeYPlayIdx];
      if (item && cur > 2 && now - lastSavedPosTime > 2500) {
        lastSavedPosTime = now;
        safeSetStorage(`yp_pos_${item.id}`, String(Math.floor(cur)));
      }
    });

    video.addEventListener("ended", () => {
      hideLoading();
      const item = yplayItems[activeYPlayIdx];
      if (item) safeRemoveStorage(`yp_pos_${item.id}`);
      if (!isLive && !isSystemStopped && activeYPlayIdx + 1 < yplayItems.length) {
        loadYPlay(activeYPlayIdx + 1, true);
      }
    });

    /* =========================================================================
       ANDROID TV 4-WAY REMOTE + OK + BACK CONTROLLER
    ========================================================================= */
    function getDir(e) {
      if (e.key === "ArrowUp" || e.keyCode === 38 || e.keyCode === 19) return "UP";
      if (e.key === "ArrowDown" || e.keyCode === 40 || e.keyCode === 20) return "DOWN";
      if (e.key === "ArrowLeft" || e.keyCode === 37 || e.keyCode === 21) return "LEFT";
      if (e.key === "ArrowRight" || e.keyCode === 39 || e.keyCode === 22) return "RIGHT";
      return "";
    }

    function isBackKey(e) {
      return (
        e.key === "Escape" ||
        e.key === "Backspace" ||
        e.key === "BrowserBack" ||
        e.key === "GoBack" ||
        e.keyCode === 4 ||
        e.keyCode === 27 ||
        e.keyCode === 461
      );
    }

    function isOkKey(e) {
      return (
        e.key === "Enter" ||
        e.key === "Select" ||
        e.key === " " ||
        e.keyCode === 13 ||
        e.keyCode === 23
      );
    }

    function getVisibleRowButtons() {
      const ids = isLive
        ? ["menuBtn", "langBtn", "qualBtn"]
        : ["nextBtn", "muteBtn", "langBtn", "subBtn", "qualBtn", "speedBtn"];
      return ids
        .map((id) => document.getElementById(id))
        .filter((el) => el && !el.classList.contains("hidden") && el.closest(".hidden") === null);
    }

    document.addEventListener("keydown", (e) => {
      const k = e.key;
      const dir = getDir(e);
      const ok = isOkKey(e);
      const active = document.activeElement;

      /* 1. Back Button */
      if (isBackKey(e)) {
        if (processBackAction()) {
          e.preventDefault();
          e.stopPropagation();
        }
        return;
      }

      if (isSystemStopped) {
        e.preventDefault();
        return;
      }

      /* 2. Hardware Channel / Media Keys */
      if ((k === "ChannelUp" || k === "PageUp") && isLive && !drawerOpen) {
        e.preventDefault();
        zapChannel(1);
        return;
      }
      if ((k === "ChannelDown" || k === "PageDown") && isLive && !drawerOpen) {
        e.preventDefault();
        zapChannel(-1);
        return;
      }
      if ((k === "MediaPlayPause" || k === " ") && !isLive && !drawerOpen && active !== progressBar) {
        if (active && active.tagName === "BUTTON") return;
        e.preventDefault();
        toggleVodPlay();
        return;
      }
      if (k === "MediaFastForward" && !isLive) { e.preventDefault(); queueSeekDelta(10); return; }
      if (k === "MediaRewind" && !isLive) { e.preventDefault(); queueSeekDelta(-10); return; }

      /* 3. Error Overlay */
      if (playerError.classList.contains("show")) {
        const retryBtn = document.getElementById("errRetryBtn");
        const eMenuBtn = document.getElementById("errMenuBtn");
        if (dir === "LEFT" || dir === "RIGHT") {
          e.preventDefault();
          (active === retryBtn ? eMenuBtn : retryBtn).focus();
        } else if (ok && active) {
          e.preventDefault();
          triggerBounce(active);
          active.click();
        }
        return;
      }

      /* 4. Side Drawer Navigation */
      if (drawerOpen) {
        const pane = drawerTab === "live" ? liveListPane : yplayListPane;
        const items = Array.from(pane.querySelectorAll(".d-item"));
        const curIdx = items.indexOf(active);
        const now = Date.now();

        if (active === tabLive || active === tabYPlay) {
          if (dir === "LEFT" || dir === "RIGHT") {
            e.preventDefault();
            const nextTab = active === tabLive ? "yplay" : "live";
            selectDrawerTab(nextTab, true);
            (nextTab === "live" ? tabLive : tabYPlay).focus({ preventScroll: true });
          } else if (dir === "DOWN" && items.length > 0) {
            e.preventDefault();
            lastDrawerNavAt = now;
            const firstItem = items[0];
            centerDrawerItem(firstItem);
            firstItem.focus({ preventScroll: true });
          } else if (ok) {
            e.preventDefault();
            active.click();
          }
          return;
        }

        if (curIdx >= 0) {
          if (dir === "DOWN" || dir === "UP") {
            e.preventDefault();
            if (e.repeat && now - lastDrawerNavAt < 150) return;
            lastDrawerNavAt = now;

            if (dir === "DOWN") {
              if (curIdx < items.length - 1) {
                const next = items[curIdx + 1];
                centerDrawerItem(next);
                next.focus({ preventScroll: true });
              }
            } else {
              if (curIdx === 0) {
                drawerScroll.scrollTop = 0;
                (drawerTab === "live" ? tabLive : tabYPlay).focus({ preventScroll: true });
              } else {
                const prev = items[curIdx - 1];
                centerDrawerItem(prev);
                prev.focus({ preventScroll: true });
              }
            }
          } else if (ok) {
            e.preventDefault();
            items[curIdx].click();
          }
          return;
        }

        if (dir) {
          e.preventDefault();
          const firstItem = items[0];
          if (firstItem) {
            centerDrawerItem(firstItem);
            firstItem.focus({ preventScroll: true });
          }
        }
        return;
      }

      /* 5. Open Popup Submenu */
      if (hasOpenPop()) {
        const openMenu = document.querySelector(".pop-menu.open");
        const opts = Array.from(openMenu.querySelectorAll(".pop-opt"));
        const idx = opts.indexOf(active);
        if (dir === "DOWN") {
          e.preventDefault();
          opts[(idx + 1) % opts.length].focus({ preventScroll: true });
        } else if (dir === "UP") {
          e.preventDefault();
          opts[(idx - 1 + opts.length) % opts.length].focus({ preventScroll: true });
        } else if (ok && idx >= 0) {
          e.preventDefault();
          opts[idx].click();
        }
        return;
      }

      /* 6. LIVE TV REMOTE RULES */
      if (isLive) {
        if (dir === "UP") {
          e.preventDefault();
          zapChannel(1);
          return;
        }
        if (dir === "DOWN") {
          e.preventDefault();
          zapChannel(-1);
          return;
        }
        if (dir === "LEFT" || dir === "RIGHT" || ok) {
          if (!isHudVisible()) {
            e.preventDefault();
            if (video.paused) safePlayVideo();
            showHud(lastHudFocusEl, 4200);
            return;
          }
          resetHudTimer(4200);
          const liveBtns = getVisibleRowButtons();
          const idx = liveBtns.indexOf(active);
          if (dir === "RIGHT") {
            e.preventDefault();
            const next = idx >= 0 ? liveBtns[(idx + 1) % liveBtns.length] : liveBtns[0];
            next.focus({ preventScroll: true });
          } else if (dir === "LEFT") {
            e.preventDefault();
            const prev = idx >= 0 ? liveBtns[(idx - 1 + liveBtns.length) % liveBtns.length] : liveBtns[0];
            prev.focus({ preventScroll: true });
          } else if (ok) {
            e.preventDefault();
            const targetBtn = (active && liveBtns.includes(active)) ? active : getBestHudFocus();
            targetBtn.focus({ preventScroll: true });
            triggerBounce(targetBtn);
            targetBtn.click();
          }
        }
        return;
      }

      /* 7. YPLAY PURE FULLSCREEN (Strict Double-Press Required) */
      if (!isHudVisible()) {
        if (dir === "LEFT" || dir === "RIGHT") {
          e.preventDefault();
          if (e.repeat) return;
          const now = Date.now();
          const delta = dir === "LEFT" ? -10 : 10;
          if (lastRemoteDir === dir && now - lastRemoteDirTime < 420) {
            lastRemoteDirTime = now;
            queueSeekDelta(delta);
          } else {
            lastRemoteDir = dir;
            lastRemoteDirTime = now;
          }
          return;
        }
        if (dir === "UP" || dir === "DOWN" || ok) {
          e.preventDefault();
          showHud(centerPlayBtn, 4200);
        }
        return;
      }

      /* 8. YPLAY HUD VISIBLE */
      resetHudTimer(4200);
      const bottomBtns = getVisibleRowButtons();
      const bIdx = bottomBtns.indexOf(active);

      if (active === progressBar) {
        if (ok) {
          e.preventDefault();
          e.stopPropagation();
          if (!isScrubbing) enterScrubMode();
          else exitScrubMode(true);
          return;
        }
        if (dir === "LEFT" || dir === "RIGHT") {
          e.preventDefault();
          e.stopPropagation();
          if (!isScrubbing) enterScrubMode();
          stepScrubAccelerated(dir, e.repeat);
          return;
        }
        if (dir === "UP") {
          e.preventDefault();
          e.stopPropagation();
          exitScrubMode(false);
          const upTarget = centerPlayBtn.classList.contains("loading-hide") ? menuBtn : centerPlayBtn;
          upTarget.focus({ preventScroll: true });
          return;
        }
        if (dir === "DOWN") {
          e.preventDefault();
          e.stopPropagation();
          exitScrubMode(false);
          bottomBtns[0]?.focus({ preventScroll: true });
          return;
        }
        return;
      }

      if (active === menuBtn) {
        if (dir === "DOWN" || dir === "RIGHT") {
          e.preventDefault();
          const downTarget = centerPlayBtn.classList.contains("loading-hide") ? progressBar : centerPlayBtn;
          downTarget.focus({ preventScroll: true });
        } else if (ok) {
          e.preventDefault();
          triggerBounce(menuBtn);
          menuBtn.click();
        }
        return;
      }

      if (active === centerPlayBtn) {
        if (dir === "UP" || dir === "LEFT") {
          e.preventDefault();
          menuBtn.focus({ preventScroll: true });
        } else if (dir === "DOWN" || dir === "RIGHT") {
          e.preventDefault();
          progressBar.focus({ preventScroll: true });
        } else if (ok) {
          e.preventDefault();
          centerPlayBtn.click();
        }
        return;
      }

      if (bIdx >= 0) {
        if (dir === "RIGHT") {
          e.preventDefault();
          bottomBtns[Math.min(bottomBtns.length - 1, bIdx + 1)].focus({ preventScroll: true });
        } else if (dir === "LEFT") {
          e.preventDefault();
          bottomBtns[Math.max(0, bIdx - 1)].focus({ preventScroll: true });
        } else if (dir === "UP") {
          e.preventDefault();
          progressBar.focus({ preventScroll: true });
        } else if (ok) {
          e.preventDefault();
          triggerBounce(active);
          active.click();
        }
        return;
      }

      if (dir || ok) {
        e.preventDefault();
        getBestHudFocus(centerPlayBtn).focus({ preventScroll: true });
      }
    }, true);

    /* Formatting & Live Library Sync */
    function fmt(t) {
      if (!isFinite(t) || t < 0) return "00:00";
      const total = Math.floor(t);
      const hrs = Math.floor(total / 3600);
      const mins = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hrs > 0) return `${hrs}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function fmtGB(bytes) {
      if (!bytes || bytes <= 0) return "Stream";
      const gb = bytes / (1024 * 1024 * 1024);
      return gb >= 10 ? `${gb.toFixed(1)} GB` : `${gb.toFixed(2)} GB`;
    }

    function fmtDurShort(sec) {
      if (!sec || sec < 30) return "";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return h > 0 ? `${h}h ${m}m` : `${Math.max(1, m)}m`;
    }

    async function fetchYPlay(preserveDrawerFocus = true) {
      if (document.visibilityState === "hidden") return;
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 8000);
        const res = await fetch(`${WORKER_URL}/api/yplay/library?t=${Date.now()}`, { cache: "no-store", signal: ctrl.signal });
        clearTimeout(tid);
        const data = await res.json();
        if (data && typeof data.stopped === "boolean") {
          await applySystemStopped(data.stopped);
        }
        const nextItems = Array.isArray(data.items) ? data.items : [];
        const sig = JSON.stringify(nextItems.map((x) => [x.id, x.quality, x.compat_audio, x.duration, (x.audio_tracks || []).length, (x.subtitles || []).length]));
        if (sig !== yplaySig) {
          const prevFocusedYpIdx = (drawerOpen && drawerTab === "yplay" && document.activeElement?.dataset?.yp !== undefined)
            ? Number(document.activeElement.dataset.yp)
            : -1;

          yplaySig = sig;
          yplayItems = nextItems;
          if (!yplayItems.length && !isLive) {
            activeYPlayIdx = -1;
          }
          renderYPlayListPane();

          /* Restore focus seamlessly if drawer was open on YPlay when new movie arrived */
          if (preserveDrawerFocus && prevFocusedYpIdx >= 0 && yplayItems.length > 0) {
            const targetEl = yplayListPane.querySelector(`.d-item[data-yp="${Math.min(prevFocusedYpIdx, yplayItems.length - 1)}"]`);
            if (targetEl) targetEl.focus({ preventScroll: true });
          }

          if (!isLive) {
            nextBtn.classList.toggle("hidden", yplayItems.length <= 1);
          }
          if (!isLive && activeYPlayIdx >= 0 && yplayItems[activeYPlayIdx]) {
            populateYPlayTracks(yplayItems[activeYPlayIdx]);
            renderProgressVisual(getEffectiveTime(), getEffectiveDuration());
          }
        }
      } catch (_) {}
    }

    async function pollSystemStatus() {
      if (document.visibilityState === "hidden") return;
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 3500);
        const res = await fetch(`${WORKER_URL}/health?t=${Date.now()}`, { cache: "no-store", signal: ctrl.signal });
        clearTimeout(tid);
        const data = await res.json();
        if (data && typeof data.stopped === "boolean") {
          await applySystemStopped(data.stopped);
        }
        if (data && typeof data.tunnel_url === "string" && data.tunnel_url.startsWith("https://")) {
          DIRECT_STREAM_URL = data.tunnel_url;
        }
      } catch (_) {}
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    window.addEventListener("pagehide", () => {
      shuttingDown = true;
      if (!isLive && yplayItems[activeYPlayIdx]) {
        const cur = getEffectiveTime();
        if (cur > 2) safeSetStorage(`yp_pos_${yplayItems[activeYPlayIdx].id}`, String(Math.floor(cur)));
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
    });

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible") {
        shuttingDown = false;
        await resolveDirectTunnel();
        connectSystemEvents();
        if (isSystemStopped) return;
        if (!isLive && activeYPlayIdx >= 0 && !video.getAttribute("src")) {
          loadYPlay(activeYPlayIdx, false);
        } else if (isLive && video.paused && !drawerOpen) {
          safePlayVideo();
        }
      }
    });

    /* Init Fullscreen TV Experience */
    syncIcons();
    buildLiveListOnce();
    renderYPlayListPane();
    resolveDirectTunnel().then(() => {
      connectSystemEvents();
      if (!isSystemStopped) {
        playChannel(CHANNELS[0], true, true);
        fetchYPlay(false);
      }
    });
    setInterval(pollSystemStatus, 3500);
    setInterval(() => {
      if (drawerOpen && drawerTab === "yplay") fetchYPlay(true);
    }, 4500);
    setInterval(() => fetchYPlay(true), 15000);
  </script>
</body>
</html>
