<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>YStream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.12/dist/shaka-player.compiled.js"></script>
  <style>
    :root {
      --bg: #05070b;
      --drawer-bg: rgba(11, 15, 24, 0.94);
      --card: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.11);
      --active-bg: rgba(59, 130, 246, 0.22);
      --active-border: #3b82f6;
      --accent: #e50914;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      user-select: none;
    }

    button, [tabindex] {
      outline: none;
    }

    /* 100% Fullscreen Stage */
    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    /* Trendy Ambient Loading / Blank Screen Overlay */
    .loading-stage {
      position: absolute;
      inset: 0;
      z-index: 10;
      background:
        radial-gradient(circle at 22% 28%, rgba(229, 9, 20, 0.22), transparent 52%),
        radial-gradient(circle at 78% 72%, rgba(59, 130, 246, 0.24), transparent 55%),
        linear-gradient(145deg, #06080f 0%, #0b101d 50%, #06080f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .loading-stage.show {
      opacity: 1;
    }

    .wave-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
    }

    .wave-loader span {
      width: 5px;
      height: 14px;
      border-radius: 99px;
      background: linear-gradient(180deg, #ff3b46, #3b82f6);
      animation: wavePulse 1s ease-in-out infinite;
    }

    .wave-loader span:nth-child(2) { animation-delay: 0.14s; }
    .wave-loader span:nth-child(3) { animation-delay: 0.28s; }
    .wave-loader span:nth-child(4) { animation-delay: 0.42s; }
    .wave-loader span:nth-child(5) { animation-delay: 0.56s; }

    @keyframes wavePulse {
      0%, 100% { height: 12px; opacity: 0.45; }
      50% { height: 34px; opacity: 1; }
    }

    .load-pill {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #93c5fd;
    }

    .load-title {
      font-size: clamp(1.1rem, 2.6vw, 1.55rem);
      font-weight: 800;
      color: #fff;
      text-align: center;
      max-width: 82vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .load-sub {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: -8px;
    }

    /* Subtitle Overlay */
    .sub-overlay {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 14%;
      z-index: 12;
      text-align: center;
      pointer-events: none;
      display: none;
    }
    .sub-overlay.show { display: block; }
    .sub-text {
      display: inline-block;
      background: rgba(0, 0, 0, 0.74);
      color: #fff;
      font-size: clamp(0.9rem, 2.2vw, 1.3rem);
      font-weight: 600;
      line-height: 1.38;
      padding: 5px 14px;
      border-radius: 8px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.95);
      white-space: pre-line;
    }

    /* Double-Tap / Seek Flash Pill */
    .seek-flash {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(12, 16, 26, 0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 11px 18px;
      border-radius: 99px;
      z-index: 18;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .seek-flash.left { left: 12%; }
    .seek-flash.right { right: 12%; }
    .seek-flash.show { opacity: 1; }

    /* Error Overlay */
    .player-error {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: rgba(6, 9, 16, 0.88);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .player-error.show { opacity: 1; pointer-events: auto; }
    .err-card {
      max-width: 380px;
      width: 100%;
      background: rgba(18, 24, 38, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .err-title { font-size: 1.05rem; font-weight: 800; color: #fff; }
    .err-msg { font-size: 0.84rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .err-actions { margin-top: 16px; display: flex; justify-content: center; gap: 10px; }
    .err-btn {
      background: var(--accent);
      color: #fff;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      border: 2px solid transparent;
    }

    /* YouTube-Style Fullscreen HUD */
    .hud {
      position: absolute;
      inset: 0;
      z-index: 16;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.78) 0%,
        rgba(0, 0, 0, 0.08) 28%,
        rgba(0, 0, 0, 0.12) 66%,
        rgba(0, 0, 0, 0.88) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(14px, 2.6vw, 26px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .hud.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Top Bar (Top-Left Menu Button + Now Playing Info) */
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .hud-top-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .menu-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 24, 38, 0.82);
      backdrop-filter: blur(10px);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.16);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hud-meta {
      min-width: 0;
    }

    .hud-title {
      font-size: clamp(0.98rem, 2.2vw, 1.35rem);
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-sub {
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .live-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(229, 9, 20, 0.24);
      border: 1px solid rgba(229, 9, 20, 0.55);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff2a36;
    }

    /* Center Play/Pause Button (YPlay only) */
    .center-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(15, 20, 32, 0.78);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .center-play-btn.hidden {
      display: none !important;
    }

    /* Bottom Controls */
    .hud-bottom {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .seek-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }

    .seek-row.hidden {
      display: none !important;
    }

    .seek-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
      cursor: pointer;
      border-radius: 99px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-grp {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 2px solid transparent;
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      cursor: pointer;
    }

    .ctrl-btn.hidden {
      display: none !important;
    }

    /* Popover Menus */
    .pop-wrap {
      position: relative;
    }

    .pop-menu {
      position: absolute;
      bottom: 46px;
      right: 0;
      background: rgba(12, 17, 28, 0.97);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 124px;
      max-height: 220px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 40;
    }

    .pop-menu.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .pop-opt {
      width: 100%;
      text-align: center;
      background: transparent;
      border: 2px solid transparent;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      cursor: pointer;
    }

    .pop-opt.active {
      background: rgba(229, 9, 20, 0.28);
      color: #fff;
    }

    /* Left Slide-Over Side Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(390px, 86vw);
      z-index: 60;
      background: var(--drawer-bg);
      backdrop-filter: blur(18px);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 18px 0 48px rgba(0, 0, 0, 0.72);
      display: flex;
      flex-direction: column;
      transform: translateX(-102%);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .side-drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .drawer-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-brand {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      color: #fff;
    }

    .drawer-brand span {
      color: var(--accent);
    }

    .drawer-hint {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .drawer-tabs {
      display: flex;
      gap: 8px;
    }

    .d-tab {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid transparent;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
    }

    .d-tab.active {
      background: var(--active-bg);
      border-color: rgba(59, 130, 246, 0.55);
      color: #fff;
    }

    .d-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    .drawer-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    /* Drawer Channel & Movie Items */
    .d-item {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      cursor: pointer;
    }

    .d-item.active {
      background: var(--active-bg);
      border-color: rgba(59, 130, 246, 0.65);
    }

    .d-item-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }

    .ch-logo {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: #161c28;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .ch-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 2;
    }

    .ch-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: #fff;
      z-index: 1;
    }

    .yp-badge {
      width: 44px;
      height: 54px;
      border-radius: 9px;
      background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 3px 4px;
      flex-shrink: 0;
      color: #fff;
    }

    .d-item.active .yp-badge {
      background: linear-gradient(160deg, #dc2626 0%, #7f1d1d 100%);
      border-color: rgba(252, 165, 165, 0.45);
    }

    .yp-num {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.45);
    }

    .d-info {
      min-width: 0;
      flex: 1;
    }

    .d-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .d-meta {
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .d-tag {
      font-size: 0.66rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }

    .d-tag.live {
      background: rgba(229, 9, 20, 0.26);
      color: #fca5a5;
    }

    /* High-Contrast TV Remote Focus Ring */
    .menu-btn:focus-visible,
    .center-play-btn:focus-visible,
    .ctrl-btn:focus-visible,
    .pop-opt:focus-visible,
    .d-tab:focus-visible,
    .d-item:focus-visible,
    .err-btn:focus-visible,
    #seekInput:focus-visible {
      border-color: #ffffff !important;
      background: rgba(59, 130, 246, 0.42) !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.75);
      transform: scale(1.03);
    }

    .center-play-btn:focus-visible {
      transform: translate(-50%, -50%) scale(1.08);
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <video id="video" playsinline preload="auto" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>

    <!-- Trendy Loading Screen -->
    <div id="loadingStage" class="loading-stage show">
      <div class="wave-loader">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div id="loadPill" class="load-pill">LIVE TV</div>
      <div id="loadTitle" class="load-title">Sun TV</div>
      <div id="loadSub" class="load-sub">Connecting stream...</div>
    </div>

    <!-- Subtitles -->
    <div id="subOverlay" class="sub-overlay"><span id="subText" class="sub-text"></span></div>

    <!-- Double-Tap Seek Pill -->
    <div id="seekLeftFlash" class="seek-flash left">-10s</div>
    <div id="seekRightFlash" class="seek-flash right">+10s</div>

    <!-- Error Card -->
    <div id="playerError" class="player-error">
      <div class="err-card">
        <div id="errTitle" class="err-title">Stream Unavailable</div>
        <div id="errMsg" class="err-msg">Unable to connect right now.</div>
        <div class="err-actions">
          <button id="errRetryBtn" class="err-btn" onclick="retryCurrentMedia()">Retry</button>
          <button id="errMenuBtn" class="err-btn" style="background:rgba(255,255,255,0.14);" onclick="openDrawer()">Open Menu</button>
        </div>
      </div>
    </div>

    <!-- YouTube-Style Fullscreen Player HUD -->
    <div id="hud" class="hud">
      <div class="hud-top">
        <div class="hud-top-left">
          <button id="menuBtn" class="menu-btn" onclick="event.stopPropagation(); openDrawer();">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            <span>Menu</span>
          </button>
          <div class="hud-meta">
            <div id="hudTitle" class="hud-title">Sun TV</div>
            <div id="hudSub" class="hud-sub">#01 • Entertainment • Live</div>
          </div>
        </div>
        <div id="liveChip" class="live-chip"><span class="live-dot"></span> LIVE</div>
      </div>

      <button id="centerPlayBtn" class="center-play-btn hidden" onclick="event.stopPropagation(); toggleVodPlay();"></button>

      <div class="hud-bottom" onclick="event.stopPropagation()">
        <div id="seekRow" class="seek-row hidden">
          <span id="curTxt">00:00</span>
          <input id="seekInput" type="range" min="0" max="1000" value="0" step="1" />
          <span id="durTxt">00:00</span>
        </div>

        <div class="controls-row">
          <div class="ctrl-grp">
            <button id="nextBtn" class="ctrl-btn hidden" onclick="playNextYPlay()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4zm12 0h2v16h-2V4z"/></svg>
              <span>Next</span>
            </button>
            <button id="muteBtn" class="ctrl-btn" onclick="toggleMute()"></button>
          </div>

          <div class="ctrl-grp">
            <div id="langWrap" class="pop-wrap hidden">
              <button id="langBtn" class="ctrl-btn" onclick="togglePop('langMenu')">Audio</button>
              <div id="langMenu" class="pop-menu"></div>
            </div>

            <div id="subWrap" class="pop-wrap hidden">
              <button id="subBtn" class="ctrl-btn" onclick="togglePop('subMenu')">CC</button>
              <div id="subMenu" class="pop-menu"></div>
            </div>

            <div class="pop-wrap">
              <button id="qualBtn" class="ctrl-btn" onclick="togglePop('qualMenu')">Auto</button>
              <div id="qualMenu" class="pop-menu"></div>
            </div>

            <div id="speedWrap" class="pop-wrap hidden">
              <button id="speedBtn" class="ctrl-btn" onclick="togglePop('speedMenu')">1x</button>
              <div id="speedMenu" class="pop-menu">
                <button class="pop-opt active" data-rate="1" onclick="setSpeed(1)">1x</button>
                <button class="pop-opt" data-rate="1.15" onclick="setSpeed(1.15)">1.15x</button>
                <button class="pop-opt" data-rate="1.25" onclick="setSpeed(1.25)">1.25x</button>
                <button class="pop-opt" data-rate="1.5" onclick="setSpeed(1.5)">1.5x</button>
              </div>
            </div>

            <button id="fsBtn" class="ctrl-btn" onclick="toggleFullscreen()"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Slide-Over Side Menu Drawer -->

    function showLoading(title, sub, pill = isLive ? "LIVE TV" : "YPLAY", immediate = false) {
      clearTimeout(loadDebounce);

      loadTitle.textContent = title;
      loadSub.textContent = sub;

        loadingStage.classList.add("show");
      } else {
        loadDebounce = setTimeout(() => {
          if (!video.paused && !playerError.classList.contains("show")) {
            loadingStage.classList.add("show");
          }
        }, 280);
      }
    }

    function hideLoading() {
      clearTimeout(loadDebounce);
      loadingStage.classList.remove("show");
    }

    function syncIcons() {
      centerPlayBtn.innerHTML = video.paused ? ICONS.play : ICONS.pause;
      muteBtn.innerHTML = video.muted ? ICONS.volOff : ICONS.volOn;
      fsBtn.innerHTML = document.fullscreenElement ? ICONS.fsExit : ICONS.fsEnter;
    }

    function showError(title, msg) {
      hideLoading();
      errTitle.textContent = title;
      errMsg.textContent = msg;
      playerError.classList.add("show");
      setTimeout(() => document.getElementById("errRetryBtn").focus(), 40);
    }

    function hideError() {
      playerError.classList.remove("show");
    }

    function retryCurrentMedia() {
      hideError();
      if (isLive) {
        liveFailCount = 0;
        const ch = CHANNELS.find((c) => c.id === activeChannelId) || CHANNELS[0];
        playChannel(ch, true, true);
      } else if (activeYPlayIdx >= 0) {
        errorRetries = 0;
        loadYPlay(activeYPlayIdx, true);
      }
    }

    /* HUD Show / Hide */
    function isHudVisible() {
      return hud.classList.contains("visible");
    }

    function showHud(focusTarget = null, autoHideMs = 4000) {
      if (drawerOpen) return;
      hud.classList.add("visible");
      if (focusTarget) {
        focusTarget.focus({ preventScroll: true });
      }
      resetHudTimer(autoHideMs);
    }

    function hideHud() {
      closeAllPops();
      hud.classList.remove("visible");
      if (document.activeElement && hud.contains(document.activeElement)) {
        document.activeElement.blur();
      }
    }

    function resetHudTimer(ms = 4000) {
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        if (!drawerOpen && !hasOpenPop() && (isLive || !video.paused)) {
          hideHud();
        }
      }, ms);
    }

    /* Popups */
    function closeAllPops(exceptId = "") {
      document.querySelectorAll(".pop-menu.open").forEach((el) => {
        if (el.id !== exceptId) el.classList.remove("open");
      });
    }

    function hasOpenPop() {
      return Boolean(document.querySelector(".pop-menu.open"));
    }

    function togglePop(id) {
      closeAllPops(id);
      const menu = document.getElementById(id);
      if (!menu) return;
      const opening = !menu.classList.contains("open");
      menu.classList.toggle("open", opening);
      resetHudTimer(5500);
      if (opening) {
        const activeOpt = menu.querySelector(".pop-opt.active") || menu.querySelector(".pop-opt");
        if (activeOpt) activeOpt.focus({ preventScroll: true });
      }
    }

    /* Side Drawer (Auto-Pause YPlay on Open, Auto-Resume on Back) */
    function openDrawer() {
      if (drawerOpen) return;
      drawerOpen = true;
      closeAllPops();
      hideHud();

      if (!isLive && !video.paused) {
        wasPlayingBeforeDrawer = true;
        video.pause();
      } else {
        wasPlayingBeforeDrawer = false;
      }

      drawerTab = isLive ? "live" : "yplay";
      drawerBackdrop.classList.add("open");
      sideDrawer.classList.add("open");
      renderDrawer();

      try {
        history.pushState({ ystreamDrawer: true }, "");
      } catch (_) {}

      setTimeout(() => {
        const activeTabEl = drawerTab === "live" ? tabLive : tabYPlay;
        activeTabEl.focus({ preventScroll: true });
      }, 40);
    }

    function closeDrawer(resumeIfNeeded = true) {
      if (!drawerOpen) return;
      drawerOpen = false;
      drawerBackdrop.classList.remove("open");
      sideDrawer.classList.remove("open");

      if (resumeIfNeeded && !isLive && wasPlayingBeforeDrawer) {
        wasPlayingBeforeDrawer = false;
        video.play().catch(() => {});
      }
    }

    window.addEventListener("popstate", () => {
      if (hasOpenPop()) {
        closeAllPops();
      } else if (drawerOpen) {
        closeDrawer(true);
      } else if (isHudVisible()) {
        hideHud();
      }
    });

    function selectDrawerTab(tab) {
      drawerTab = tab;
      renderDrawer();
      if (tab === "yplay") fetchYPlay(false);

    function renderDrawer() {
      tabLive.classList.toggle("active", drawerTab === "live");
      tabYPlay.classList.toggle("active", drawerTab === "yplay");
      document.getElementById("liveBadge").textContent = String(CHANNELS.length);
      document.getElementById("yplayBadge").textContent = String(yplayItems.length);

      if (drawerTab === "live") {

      } else {

          drawerList.innerHTML = `
            <div class="d-item" tabindex="0">

                <div class="yp-badge">${ICONS.cinema}<span class="yp-num">#00</span></div>

                  <div class="d-meta">Forward a movie to your Telegram bot</div>
                </div>
              </div>
            </div>
          `;
          return;
        }
        drawerList.innerHTML = yplayItems.map((m, i) => {
          const isCur = !isLive && i === activeYPlayIdx;
          const num = String(i + 1).padStart(2, "0");
          const qStr = m.quality || "HD";
          const gbStr = fmtGB(m.file_size);
          const durStr = fmtDurShort(m.duration);
          return `
            <div class="d-item ${isCur ? "active" : ""}" tabindex="0" onclick="pickMovie(${i})">
              <div class="d-item-left">
                <div class="yp-badge">
                  ${ICONS.cinema}
                  <span class="yp-num">#${num}</span>
                </div>
                <div class="d-info">
                  <div class="d-title">${esc(m.title)}</div>
                  <div class="d-meta">
                    ${isCur ? `<span class="d-tag live">PLAYING</span>` : ""}
                    <span class="d-tag">${esc(qStr)}</span>
                    <span class="d-tag">${esc(gbStr)}</span>

    function pickChannel(id) {
      const ch = CHANNELS.find((c) => c.id === id);
      if (!ch) return;
      wasPlayingBeforeDrawer = false;
      closeDrawer(false);
      playChannel(ch, true, true);

    function pickMovie(idx) {
      wasPlayingBeforeDrawer = false;
      closeDrawer(false);

    /* Mode Switch (Live TV vs YPlay HUD) */
    function configureHudMode(vod) {
      isLive = !vod;

      seekRow.classList.toggle("hidden", !vod);

      renderQualMenu();
    }

    /* Quality, Audio & Subtitles */
    let liveAvailableHeights = [];

    function renderQualMenu() {
      if (isLive) {
        const opts = [`<button class="pop-opt ${selectedLiveQuality === "auto" ? "active" : ""}" data-q="auto" onclick="setLiveQuality('auto')">Auto</button>`];
        for (const h of liveAvailableHeights) {
          const label = h >= 2160 ? "4K" : `${h}p`;
          opts.push(`<button class="pop-opt ${selectedLiveQuality === h ? "active" : ""}" data-q="${h}" onclick="setLiveQuality(${h})">${label}</button>`);
        }
        qualMenu.innerHTML = opts.join("");
        qualBtn.textContent = selectedLiveQuality === "auto" ? "Auto" : (selectedLiveQuality >= 2160 ? "4K" : `${selectedLiveQuality}p`);
      } else {
        const list = [
          { q: "orig", label: "Original" },
          { q: "720", label: "720p" },
          { q: "480", label: "480p" },
          { q: "360", label: "360p" }

          `<button class="pop-opt ${vodQuality === x.q ? "active" : ""}" data-q="${x.q}" onclick="setVodQuality('${x.q}')">${x.label}</button>`
        ).join("");
        qualBtn.textContent = vodQuality === "orig" ? "Orig" : `${vodQuality}p`;
      }
    }

    function setLiveQuality(q) {
      selectedLiveQuality = q;
      if (hls && hls.levels && hls.levels.length) {
        if (q === "auto") hls.currentLevel = -1;
        else {
          let bestIdx = -1, bestBr = -1;
          hls.levels.forEach((lv, i) => {
            if (lv.height === q && (lv.bitrate || 0) >= bestBr) { bestBr = lv.bitrate || 0; bestIdx = i; }
          });
          if (bestIdx >= 0) hls.currentLevel = bestIdx;
        }
      } else if (shakaPlayer) {
        if (q === "auto") shakaPlayer.configure({ abr: { enabled: true } });
        else {
          shakaPlayer.configure({ abr: { enabled: false } });
          const tracks = shakaPlayer.getVariantTracks().filter((t) => t.height === q).sort((a, b) => (b.bandwidth || 0) - (a.bandwidth || 0));
          if (tracks.length) shakaPlayer.selectVariantTrack(tracks[0], true);
        }
      }
      renderQualMenu();
      closeAllPops();
      qualBtn.focus({ preventScroll: true });
      resetHudTimer();
    }

    function setVodQuality(q) {
      vodQuality = q;
      renderQualMenu();
      closeAllPops();
      qualBtn.focus({ preventScroll: true });
      if (!isLive && activeYPlayIdx >= 0) {
        restartYPlayAt(getEffectiveTime());
      }
    }

    function setVodAudio(idx) {
      vodAudioIdx = idx;
      const item = yplayItems[activeYPlayIdx];
      const tracks = (item && Array.isArray(item.audio_tracks)) ? item.audio_tracks : [];
      const tr = tracks.find((t) => t.index === idx);
      langBtn.textContent = tr ? tr.label : "Audio";
      langMenu.querySelectorAll(".pop-opt").forEach((b) => b.classList.toggle("active", Number(b.dataset.a) === idx));
      closeAllPops();
      langBtn.focus({ preventScroll: true });
      if (!isLive && activeYPlayIdx >= 0) {
        restartYPlayAt(getEffectiveTime());

    function setVodSub(idx) {
      vodSubIdx = idx;
      subMenu.querySelectorAll(".pop-opt").forEach((b) => b.classList.toggle("active", Number(b.dataset.s) === idx));
      closeAllPops();
      subBtn.focus({ preventScroll: true });
      if (idx < 0) {
        subBtn.textContent = "CC";

        subOverlay.classList.remove("show");
      } else {
        subBtn.textContent = "CC On";
        loadSubtitleWindow(getEffectiveTime());

    function setSpeed(rate) {
      currentSpeed = rate;
      video.playbackRate = rate;
      speedBtn.textContent = `${rate}x`;
      document.querySelectorAll("#speedMenu .pop-opt").forEach((b) => b.classList.toggle("active", Number(b.dataset.rate) === rate));
      closeAllPops();
      speedBtn.focus({ preventScroll: true });
      resetHudTimer();

    function populateYPlayTracks(item) {
      const tracks = Array.isArray(item.audio_tracks) ? item.audio_tracks : [];
      if (tracks.length > 1) {
        langWrap.classList.remove("hidden");
        const defIdx = typeof item.default_audio_idx === "number" ? item.default_audio_idx : 0;
        vodAudioIdx = defIdx;
        const defTrack = tracks.find((t) => t.index === defIdx) || tracks[0];
        langBtn.textContent = defTrack.label;
        langMenu.innerHTML = tracks.map((t) =>
          `<button class="pop-opt ${t.index === defIdx ? "active" : ""}" data-a="${t.index}" onclick="setVodAudio(${t.index})">${esc(t.label)}</button>`
        ).join("");
      } else {
        langWrap.classList.add("hidden");
        vodAudioIdx = 0;
        langMenu.innerHTML = "";
      }

      const subs = Array.isArray(item.subtitles) ? item.subtitles : [];
      if (subs.length > 0) {
        subWrap.classList.remove("hidden");
        vodSubIdx = -1;
        subBtn.textContent = "CC";
        subMenu.innerHTML = `<button class="pop-opt active" data-s="-1" onclick="setVodSub(-1)">Off</button>` +
          subs.map((s) => `<button class="pop-opt" data-s="${s.index}" onclick="setVodSub(${s.index})">${esc(s.label)}</button>`).join("");
      } else {
        subWrap.classList.add("hidden");
        vodSubIdx = -1;
        subMenu.innerHTML = "";
      }
    }

    /* Seek Helpers (Double-Tap / Double-Press -10s / +10s) */
    function getEffectiveDuration() {
      if (transcodeMode) {
        const item = yplayItems[activeYPlayIdx];
        if (item && item.duration > 0) return Number(item.duration);
        return isFinite(video.duration) && video.duration > 0 ? baseOffset + video.duration : 0;
      }
      return isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
    }

    function getEffectiveTime() {
      const cur = video.currentTime || 0;
      return transcodeMode ? baseOffset + cur : cur;
    }

    function showSeekPill(text, side) {
      const target = side === "left" ? seekLeftFlash : seekRightFlash;
      const other = side === "left" ? seekRightFlash : seekLeftFlash;
      other.classList.remove("show");
      target.textContent = text;
      target.classList.add("show");
      clearTimeout(seekFlashTimer);
      seekFlashTimer = setTimeout(() => {
        seekLeftFlash.classList.remove("show");
        seekRightFlash.classList.remove("show");
      }, 650);
    }

    function queueSeekDelta(sec) {
      if (isLive) return;
      const dur = getEffectiveDuration();
      if (dur <= 0) return;
      pendingSeekDelta += sec;
      const side = pendingSeekDelta < 0 ? "left" : "right";
      showSeekPill(`${pendingSeekDelta > 0 ? "+" : ""}${pendingSeekDelta}s`, side);
      clearTimeout(seekExecTimer);
      seekExecTimer = setTimeout(() => {
        const delta = pendingSeekDelta;
        pendingSeekDelta = 0;
        seekYPlayTo(getEffectiveTime() + delta);
      }, 260);
    }

    function seekYPlayTo(targetSec) {
      if (isLive) return;
      const dur = getEffectiveDuration();
      const clamped = Math.max(0, dur > 1 ? Math.min(dur - 1, targetSec) : targetSec);
      if (transcodeMode) {
        restartYPlayAt(clamped);
      } else if (dur > 0) {
        showLoading(hudTitle.textContent, `Seeking to ${fmt(clamped)}...`, "YPLAY", false);
        video.currentTime = clamped;
        if (vodSubIdx >= 0) loadSubtitleWindow(clamped);
      }
    }

    /* Touch Tap & Double-Tap on Fullscreen Video */
    stage.addEventListener("click", (e) => {
      if (drawerOpen || playerError.classList.contains("show")) return;
      if (hasOpenPop()) {
        closeAllPops();
        return;
      }

      if (isLive) {
        if (video.paused) video.play().catch(() => {});
        if (isHudVisible()) hideHud();
        else showHud(menuBtn, 4000);
        return;
      }

      const now = Date.now();
      const rect = stage.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const isLeft = x < rect.width * 0.42;
      const isRight = x > rect.width * 0.58;

      if (now - lastTouchTap < 300) {
        clearTimeout(touchSingleTimer);
        lastTouchTap = now;
        if (isLeft) queueSeekDelta(-10);
        else if (isRight) queueSeekDelta(10);
        return;
      }

      lastTouchTap = now;
      touchSingleTimer = setTimeout(() => {
        if (isHudVisible()) hideHud();
        else showHud(centerPlayBtn, 4000);
      }, 300);
    });

    /* Subtitles Parser & Loader */
    function parseVttTime(s) {
      const p = s.trim().split(":");
      if (p.length === 3) return Number(p[0]) * 3600 + Number(p[1]) * 60 + parseFloat(p[2]);
      if (p.length === 2) return Number(p[0]) * 60 + parseFloat(p[1]);
      return 0;
    }

    function parseVttCues(vtt, offsetSec) {
      const blocks = vtt.replace(/\r/g, "").split("\n\n");
      const out = [];
      for (const blk of blocks) {
        const lines = blk.trim().split("\n");
        const arrowIdx = lines.findIndex((l) => l.includes("-->"));
        if (arrowIdx < 0) continue;
        const [a, b] = lines[arrowIdx].split("-->");
        const start = offsetSec + parseVttTime(a);
        const end = offsetSec + parseVttTime(b.split(" ")[0]);
        const text = lines.slice(arrowIdx + 1).join("\n").replace(/<[^>]+>/g, "").trim();
        if (text && end > start) out.push({ start, end, text });
      }
      return out;
    }

    async function loadSubtitleWindow(curSec) {
      if (vodSubIdx < 0 || activeYPlayIdx < 0 || subLoading) return;
      subLoading = true;
      const start = Math.max(0, Math.floor(curSec));
      try {
        const res = await fetch(`${DIRECT_STREAM_URL}/api/yplay/sub/${activeYPlayIdx}/${vodSubIdx}.vtt?t=${start}&dur=180`);
        const txt = await res.text();
        subCues = parseVttCues(txt, start);
        subFetchStart = start;
      } catch (_) {
        subCues = [];
      } finally {
        subLoading = false;
      }
    }

    function renderActiveSubtitle(curSec) {
      if (isLive || vodSubIdx < 0) {
        subOverlay.classList.remove("show");
        return;
      }
      if (subFetchStart < 0 || curSec < subFetchStart || curSec > subFetchStart + 160) {
        loadSubtitleWindow(curSec);
      }
      const cue = subCues.find((c) => curSec >= c.start && curSec <= c.end);
      if (cue) {
        subText.textContent = cue.text;
        subOverlay.classList.add("show");
      } else {
        subOverlay.classList.remove("show");
      }
    }

    /* Playback Engines */
    async function cleanupPlayers() {
      clearTimeout(liveFailTimer);
      hideError();
      if (hls) { hls.destroy(); hls = null; }
      if (shakaPlayer) { try { await shakaPlayer.destroy(); } catch (_) {} shakaPlayer = null; }
    }

    async function resolveDirectTunnel() {
      try {
        const res = await fetch(`${WORKER_URL}/health?t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();
        if (data && typeof data.tunnel_url === "string" && data.tunnel_url.startsWith("https://")) {
          DIRECT_STREAM_URL = data.tunnel_url;
        }
      } catch (_) {}
    }

    function startHlsUrl(url, ch, autoPlay, isRelay = false) {
      if (hls) { hls.destroy(); hls = null; }
      if (window.Hls && window.Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: false, maxBufferLength: 16, backBufferLength: 10 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          hideError();
          liveAvailableHeights = Array.from(new Set((hls.levels || []).map((lv) => lv.height || 0).filter((h) => h > 0))).sort((a, b) => b - a);
          renderQualMenu();
          hls.currentLevel = -1;
          hudSub.textContent = isRelay ? `${ch.num} • ${ch.cat} (Relay)` : `${ch.num} • ${ch.cat}`;
          if (autoPlay) video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal || activeChannelId !== ch.id) return;
          handleLiveFallback(ch, autoPlay, data.details || "Network error");
        });
      } else {
        liveAvailableHeights = [];
        renderQualMenu();
        video.src = url;
        video.load();
        if (autoPlay) video.play().catch(() => {});
      }
    }

    async function handleLiveFallback(ch, autoPlay, reason = "Stream offline") {
      if (activeChannelId !== ch.id || !isLive) return;

      if (liveStage === 0 && video.canPlayType("application/vnd.apple.mpegurl")) {
        liveStage = 1;
        await cleanupPlayers();
        liveAvailableHeights = [];
        renderQualMenu();
        video.src = ch.url;
        video.load();
        if (autoPlay) video.play().catch(() => {});
        return;
      }
      if (liveStage < 2 && ch.relayPath) {
        liveStage = 2;
        await resolveDirectTunnel();
        loadSub.textContent = "Connecting backup relay...";
        startHlsUrl(`${DIRECT_STREAM_URL}${ch.relayPath}`, ch, autoPlay, true);
        return;
      }

      if (liveFailCount < CHANNELS.length - 1) {
        liveFailCount += 1;
        const curIdx = CHANNELS.findIndex((c) => c.id === ch.id);
        const nextCh = CHANNELS[(curIdx + 1) % CHANNELS.length];
        showLoading(nextCh.name, `${ch.name} offline • Switching channel...`, "LIVE TV", true);
        clearTimeout(liveFailTimer);
        liveFailTimer = setTimeout(() => {
          if (isLive && activeChannelId === ch.id) playChannel(nextCh, true, false);
        }, 850);
        return;
      }

      showError("Live TV Unavailable", `All channels failed to load (${reason}). Check internet and tap Retry.`);
    }

    async function playChannel(ch, autoPlay = true, resetFail = true) {
      await cleanupPlayers();
      if (resetFail) liveFailCount = 0;
      activeChannelId = ch.id;
      activeYPlayIdx = -1;
      pendingResumeTime = 0;
      transcodeMode = false;
      baseOffset = 0;
      liveStage = 0;
      selectedLiveQuality = "auto";
      liveAvailableHeights = [];
      video.playbackRate = 1;

      configureHudMode(false);
      hudTitle.textContent = ch.name;
      hudSub.textContent = `${ch.num} • ${ch.cat}`;
      showLoading(ch.name, `${ch.num} • Tuning live channel...`, "LIVE TV", true);

      if (ch.type === "dash-clearkey" && window.shaka && shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player();
        await shakaPlayer.attach(video);
        shakaPlayer.configure({
          drm: { clearKeys: { [ch.kid]: ch.key } },
          abr: { enabled: true },
          streaming: { bufferingGoal: 12, rebufferingGoal: 2 }
        });
        shakaPlayer.addEventListener("error", (ev) => {
          handleLiveFallback(ch, autoPlay, `Code ${ev && ev.detail ? ev.detail.code : "Network"}`);
        });
        try {
          await shakaPlayer.load(ch.url);
          hideError();
          liveAvailableHeights = Array.from(new Set(shakaPlayer.getVariantTracks().map((t) => t.height || 0).filter((h) => h > 0))).sort((a, b) => b - a);
          renderQualMenu();
          if (autoPlay) video.play().catch(() => {});
        } catch (_) {
          handleLiveFallback(ch, autoPlay, "Stream offline");
        }
        return;
      }

      if (ch.url.includes(".m3u8")) startHlsUrl(ch.url, ch, autoPlay, false);
      else {
        video.src = ch.url;
        video.load();
        if (autoPlay) video.play().catch(() => {});
      }
    }

    function restartYPlayAt(targetSec) {
      const item = yplayItems[activeYPlayIdx];
      if (!item) return;
      const clamped = Math.max(0, Math.floor(targetSec));
      const needsTranscode = Boolean(item.compat_audio) || vodQuality !== "orig" || vodAudioIdx !== 0;
      transcodeMode = needsTranscode;

      showLoading(item.title, `Loading at ${fmt(clamped)}...`, "YPLAY", true);
      if (transcodeMode) {
        baseOffset = clamped;
        pendingResumeTime = 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/play/${activeYPlayIdx}?t=${baseOffset}&q=${vodQuality}&a=${vodAudioIdx}`;
      } else {
        baseOffset = 0;
        pendingResumeTime = clamped > 2 ? clamped : 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/stream/${activeYPlayIdx}`;
      }
      video.load();
      video.playbackRate = currentSpeed;
      video.play().catch(() => hideLoading());
      if (vodSubIdx >= 0) loadSubtitleWindow(clamped);
    }

    async function loadYPlay(idx, autoPlay = true, forceOffset = null) {
      if (idx < 0 || idx >= yplayItems.length) return;
      await cleanupPlayers();
      activeChannelId = "";
      activeYPlayIdx = idx;
      errorRetries = 0;
      audioAutoChecked = false;
      vodQuality = "orig";
      subCues = [];
      subFetchStart = -1;
      subOverlay.classList.remove("show");

      const item = yplayItems[idx];
      populateYPlayTracks(item);
      configureHudMode(true);

      const gbStr = fmtGB(item.file_size);
      const qStr = item.quality || "HD";
      transcodeMode = Boolean(item.compat_audio) || vodAudioIdx !== 0 || forceOffset !== null;

      hudTitle.textContent = item.title;
      hudSub.textContent = `${qStr} • ${gbStr}`;
      showLoading(item.title, `${qStr} • ${gbStr} • Preparing stream...`, "YPLAY", true);

      const saved = forceOffset !== null
        ? forceOffset
        : Number(localStorage.getItem(`yp_pos_${item.id}`) || "0");

      if (transcodeMode) {
        baseOffset = saved > 5 ? Math.floor(saved) : 0;
        pendingResumeTime = 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/play/${idx}?t=${baseOffset}&q=${vodQuality}&a=${vodAudioIdx}`;
      } else {
        baseOffset = 0;
        pendingResumeTime = saved > 5 ? saved : 0;
        video.src = `${DIRECT_STREAM_URL}/api/yplay/stream/${idx}`;
      }

      const initDur = Number(item.duration || 0);
      durTxt.textContent = initDur > 0 ? fmt(initDur) : "00:00";
      curTxt.textContent = fmt(saved > 5 ? saved : 0);
      seekInput.value = (initDur > 0 && saved > 5) ? String(Math.round((saved / initDur) * 1000)) : "0";

      video.load();
      video.playbackRate = currentSpeed;
      if (autoPlay) {
        video.play().catch(() => hideLoading());
      }
    }

    function playNextYPlay() {
      if (!yplayItems.length) return;
      loadYPlay(activeYPlayIdx + 1 < yplayItems.length ? activeYPlayIdx + 1 : 0, true);
    }

    function toggleVodPlay() {
      if (isLive) return;
      if (video.paused) {
        video.play().catch(() => {});
        resetHudTimer(2200);
      } else {
        video.pause();
        clearTimeout(hudTimer);
      }
    }

    function toggleMute() {
      video.muted = !video.muted;
      syncIcons();
      resetHudTimer();
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
        } else {
          if (document.exitFullscreen) await document.exitFullscreen();
        }
      } catch (_) {}
      syncIcons();
      resetHudTimer();
    }

    document.addEventListener("fullscreenchange", syncIcons);

    /* Video Events */
    video.addEventListener("loadedmetadata", () => {
      hideError();
      if (!isLive) {
        video.playbackRate = currentSpeed;
        if (!transcodeMode && pendingResumeTime > 0 && isFinite(video.duration) && pendingResumeTime < video.duration - 2) {
          video.currentTime = pendingResumeTime;
          pendingResumeTime = 0;
        }
      }
    });

    video.addEventListener("loadeddata", () => {
      hideError();
      hideLoading();
    });

    video.addEventListener("playing", () => {
      hideError();
      hideLoading();
      syncIcons();
      if (isLive) liveFailCount = 0;
      if (isHudVisible()) resetHudTimer(2500);
    });

    video.addEventListener("waiting", () => {
      if (!video.paused) {
        showLoading(hudTitle.textContent, "Buffering stream...", isLive ? "LIVE TV" : "YPLAY", false);
      }
    });

    video.addEventListener("pause", () => {
      hideLoading();
      syncIcons();
      if (!isLive && !drawerOpen) {
        showHud(centerPlayBtn, 6000);
        clearTimeout(hudTimer);
      }
    });

    video.addEventListener("error", async () => {
      if (shuttingDown || !video.getAttribute("src")) return;
      if (isLive) {
        const ch = CHANNELS.find((c) => c.id === activeChannelId);
        if (ch) handleLiveFallback(ch, true, "Stream failed");
        return;
      }
      if (!isLive && activeYPlayIdx >= 0 && errorRetries < 2) {
        errorRetries += 1;
        await resolveDirectTunnel();
        restartYPlayAt(getEffectiveTime());
      } else {
        showError("Playback Error", "Unable to load this video from server. Check internet and tap Retry.");
      }
    });

    video.addEventListener("timeupdate", () => {
      if (isLive || seeking) return;
      const cur = getEffectiveTime();
      const dur = getEffectiveDuration();

      if (!transcodeMode && !audioAutoChecked && !video.muted && (video.currentTime || 0) > 2.2) {
        audioAutoChecked = true;
        if (typeof video.webkitAudioDecodedByteCount === "number" && video.webkitAudioDecodedByteCount === 0) {
          loadYPlay(activeYPlayIdx, true, Math.floor(cur));
          return;
        }
      }

      if (dur > 0) {
        seekInput.value = String(Math.round((cur / dur) * 1000));
        durTxt.textContent = fmt(dur);
      }
      curTxt.textContent = fmt(cur);
      renderActiveSubtitle(cur);

      const now = Date.now();
      const item = yplayItems[activeYPlayIdx];
      if (item && cur > 2 && now - lastSavedPosTime > 2500) {
        lastSavedPosTime = now;
        localStorage.setItem(`yp_pos_${item.id}`, String(Math.floor(cur)));
      }
    });

    video.addEventListener("ended", () => {
      hideLoading();
      const item = yplayItems[activeYPlayIdx];
      if (item) localStorage.removeItem(`yp_pos_${item.id}`);
      if (!isLive && activeYPlayIdx + 1 < yplayItems.length) {
        loadYPlay(activeYPlayIdx + 1, true);
      }
    });

    seekInput.addEventListener("input", () => {
      seeking = true;
      const dur = getEffectiveDuration();
      if (dur > 0) curTxt.textContent = fmt((Number(seekInput.value) / 1000) * dur);
    });
    seekInput.addEventListener("change", () => {
      const dur = getEffectiveDuration();
      if (!isLive && dur > 0) seekYPlayTo((Number(seekInput.value) / 1000) * dur);
      seeking = false;
      resetHudTimer();
    });

    /* =========================================================================
       ANDROID TV 4-WAY REMOTE + OK + BACK CONTROLLER (YouTube TV Style)
       Note: Home key is NEVER intercepted so system exits cleanly.
    ========================================================================= */
    function isBackKey(e) {
      return (
        e.key === "Escape" ||
        e.key === "Backspace" ||
        e.key === "BrowserBack" ||
        e.key === "GoBack" ||
        e.keyCode === 4 ||
        e.keyCode === 27 ||
        e.keyCode === 461
      );
    }

    function getVisibleBottomButtons() {
      const ids = isLive
        ? ["qualBtn", "muteBtn", "fsBtn"]
        : ["nextBtn", "muteBtn", "langBtn", "subBtn", "qualBtn", "speedBtn", "fsBtn"];
      return ids
        .map((id) => document.getElementById(id))
        .filter((el) => el && !el.classList.contains("hidden") && el.closest(".hidden") === null);
    }

    document.addEventListener("keydown", (e) => {
      const k = e.key;
      const active = document.activeElement;

      /* 1. Back Button Handling */
      if (isBackKey(e)) {
        if (hasOpenPop()) {
          e.preventDefault();
          const openMenu = document.querySelector(".pop-menu.open");
          const trigger = openMenu ? openMenu.parentElement.querySelector("button") : null;
          closeAllPops();
          if (trigger) trigger.focus({ preventScroll: true });
          resetHudTimer();
          return;
        }
        if (drawerOpen) {
          e.preventDefault();
          closeDrawer(true);
          return;
        }
        if (isHudVisible()) {
          e.preventDefault();
          hideHud();
          return;
        }
        return; // Allow system exit if already pure fullscreen
      }

      /* 2. Media Hardware Keys */
      if ((k === "MediaPlayPause" || k === " ") && !isLive && !drawerOpen) {
        if (active && active.tagName === "BUTTON") return;
        e.preventDefault();
        toggleVodPlay();
        return;
      }
      if (k === "MediaFastForward" && !isLive) { e.preventDefault(); queueSeekDelta(10); return; }
      if (k === "MediaRewind" && !isLive) { e.preventDefault(); queueSeekDelta(-10); return; }

      /* 3. Error Overlay Focus */
      if (playerError.classList.contains("show")) {
        const retryBtn = document.getElementById("errRetryBtn");
        const eMenuBtn = document.getElementById("errMenuBtn");
        if (k === "ArrowLeft" || k === "ArrowRight") {
          e.preventDefault();
          (active === retryBtn ? eMenuBtn : retryBtn).focus();
        }
        return;
      }

      /* 4. Side Drawer D-Pad Navigation */
      if (drawerOpen) {
        const items = Array.from(drawerList.querySelectorAll(".d-item"));
        const curIdx = items.indexOf(active);

        if (active === tabLive || active === tabYPlay) {
          if (k === "ArrowLeft" || k === "ArrowRight") {
            e.preventDefault();
            const nextTab = active === tabLive ? "yplay" : "live";
            selectDrawerTab(nextTab);
            (nextTab === "live" ? tabLive : tabYPlay).focus({ preventScroll: true });
          } else if (k === "ArrowDown" && items.length > 0) {
            e.preventDefault();
            const activeItem = drawerList.querySelector(".d-item.active") || items[0];
            activeItem.focus({ preventScroll: true });
            activeItem.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
          return;
        }

        if (curIdx >= 0) {
          if (k === "ArrowDown") {
            e.preventDefault();
            const next = items[Math.min(items.length - 1, curIdx + 1)];
            next.focus({ preventScroll: true });
            next.scrollIntoView({ block: "nearest", behavior: "smooth" });
          } else if (k === "ArrowUp") {
            e.preventDefault();
            if (curIdx === 0) {
              (drawerTab === "live" ? tabLive : tabYPlay).focus({ preventScroll: true });
            } else {
              const prev = items[curIdx - 1];
              prev.focus({ preventScroll: true });
              prev.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }
          } else if (k === "Enter") {
            e.preventDefault();
            items[curIdx].click();
          }
          return;
        }

        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) {
          e.preventDefault();
          (drawerTab === "live" ? tabLive : tabYPlay).focus({ preventScroll: true });
        }
        return;
      }

      /* 5. Open Popup Submenu Navigation */
      if (hasOpenPop()) {
        const openMenu = document.querySelector(".pop-menu.open");
        const opts = Array.from(openMenu.querySelectorAll(".pop-opt"));
        const idx = opts.indexOf(active);
        if (k === "ArrowDown") {
          e.preventDefault();
          opts[(idx + 1) % opts.length].focus({ preventScroll: true });
        } else if (k === "ArrowUp") {
          e.preventDefault();
          opts[(idx - 1 + opts.length) % opts.length].focus({ preventScroll: true });
        } else if (k === "Enter" && idx >= 0) {
          e.preventDefault();
          opts[idx].click();
        }
        return;
      }

      /* 6. Pure Fullscreen (HUD Hidden) */
      if (!isHudVisible()) {
        if (!isLive && (k === "ArrowLeft" || k === "ArrowRight")) {
          e.preventDefault();
          const now = Date.now();
          const side = k === "ArrowLeft" ? "left" : "right";
          const delta = k === "ArrowLeft" ? -10 : 10;
          if (lastRemoteArrow === k && now - lastRemoteArrowTime < 650) {
            lastRemoteArrowTime = now;
            queueSeekDelta(delta);
          } else {
            lastRemoteArrow = k;
            lastRemoteArrowTime = now;
            showSeekPill(delta > 0 ? "+10s (Press again)" : "-10s (Press again)", side);
          }
          return;
        }

        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"].includes(k)) {
          e.preventDefault();
          if (isLive) {
            if (video.paused) video.play().catch(() => {});
            showHud(menuBtn, 4500);
          } else {
            showHud(k === "ArrowUp" ? menuBtn : centerPlayBtn, 4500);
          }
        }
        return;
      }

      /* 7. HUD Visible: 1-by-1 Deterministic Row Navigation */
      resetHudTimer(4500);
      const bottomBtns = getVisibleBottomButtons();
      const bIdx = bottomBtns.indexOf(active);

      if (active === menuBtn) {
        if (k === "ArrowDown") {
          e.preventDefault();
          if (isLive) bottomBtns[0]?.focus({ preventScroll: true });
          else centerPlayBtn.focus({ preventScroll: true });
        }
        return;
      }

      if (active === centerPlayBtn) {
        if (k === "ArrowUp") {
          e.preventDefault();
          menuBtn.focus({ preventScroll: true });
        } else if (k === "ArrowDown") {
          e.preventDefault();
          seekInput.focus({ preventScroll: true });
        }
        return;
      }

      if (active === seekInput) {
        if (k === "ArrowUp") {
          e.preventDefault();
          centerPlayBtn.focus({ preventScroll: true });
        } else if (k === "ArrowDown") {
          e.preventDefault();
          bottomBtns[0]?.focus({ preventScroll: true });
        } else if (k === "ArrowLeft" || k === "ArrowRight") {
          e.preventDefault();
          queueSeekDelta(k === "ArrowRight" ? 10 : -10);
        }
        return;
      }

      if (bIdx >= 0) {
        if (k === "ArrowRight") {
          e.preventDefault();
          bottomBtns[Math.min(bottomBtns.length - 1, bIdx + 1)].focus({ preventScroll: true });
        } else if (k === "ArrowLeft") {
          e.preventDefault();
          bottomBtns[Math.max(0, bIdx - 1)].focus({ preventScroll: true });
        } else if (k === "ArrowUp") {
          e.preventDefault();
          if (isLive) menuBtn.focus({ preventScroll: true });
          else seekInput.focus({ preventScroll: true });
        }
        return;
      }

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) {
        e.preventDefault();
        menuBtn.focus({ preventScroll: true });
      }
    });

    /* Formatting & Library Sync */
    function fmt(t) {
      if (!isFinite(t) || t < 0) return "00:00";
      const total = Math.floor(t);
      const hrs = Math.floor(total / 3600);
      const mins = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hrs > 0) return `${hrs}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function fmtGB(bytes) {
      if (!bytes || bytes <= 0) return "Stream";
      const gb = bytes / (1024 * 1024 * 1024);
      return gb >= 10 ? `${gb.toFixed(1)} GB` : `${gb.toFixed(2)} GB`;
    }

    function fmtDurShort(sec) {
      if (!sec || sec <= 0) return "";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return h > 0 ? `${h}h ${m}m` : `${Math.max(1, m)}m`;
    }

    async function fetchYPlay(refreshUi = true) {
      if (document.visibilityState === "hidden") return;
      try {
        const res = await fetch(`${WORKER_URL}/api/yplay/library?t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();
        const nextItems = Array.isArray(data.items) ? data.items : [];
        const sig = JSON.stringify(nextItems.map((x) => [x.id, x.quality, x.compat_audio, x.duration, (x.audio_tracks || []).length, (x.subtitles || []).length]));
        if (sig !== yplaySig) {
          yplaySig = sig;
          yplayItems = nextItems;
          document.getElementById("yplayBadge").textContent = String(yplayItems.length);
          if (refreshUi && drawerOpen && drawerTab === "yplay") renderDrawer();
          if (!isLive && activeYPlayIdx >= 0 && yplayItems[activeYPlayIdx]) {
            populateYPlayTracks(yplayItems[activeYPlayIdx]);
          }
        }
      } catch (_) {}
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    window.addEventListener("pagehide", () => {
      shuttingDown = true;
      if (!isLive && yplayItems[activeYPlayIdx]) {
        const cur = getEffectiveTime();
        if (cur > 2) localStorage.setItem(`yp_pos_${yplayItems[activeYPlayIdx].id}`, String(Math.floor(cur)));
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
    });

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible") {
        shuttingDown = false;
        if (!isLive && activeYPlayIdx >= 0 && !video.getAttribute("src")) {
          await resolveDirectTunnel();
          loadYPlay(activeYPlayIdx, false);
        } else if (isLive && video.paused && !drawerOpen) {
          video.play().catch(() => {});
        }
      }
    });

    /* Init Fullscreen TV Experience */
    syncIcons();
    resolveDirectTunnel().then(() => {
      playChannel(CHANNELS[0], true, true);
      fetchYPlay(false);
    });
    setInterval(() => fetchYPlay(true), 15000);
  </script>
</body>
</html>
