<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YStream — Live TV & YPlay</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141821;
      --surface-2: #1c2230;
      --accent: #e50914;
      --accent-soft: rgba(229, 9, 20, 0.16);
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --ok: #22c55e;
      --err: #ef4444;
      --border: rgba(255, 255, 255, 0.09);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 48px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 13, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.4px;
    }
    .brand span.logo {
      background: var(--accent);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .status-pill {
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .status-pill.ok { color: var(--ok); border-color: rgba(34, 197, 94, 0.35); }
    .status-pill.err { color: var(--err); border-color: rgba(239, 68, 68, 0.35); }

    .container { max-width: 1180px; margin: 0 auto; padding: 14px 16px; }

    .player-box {
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    }
    video {
      width: 100%;
      max-height: 56vh;
      aspect-ratio: 16 / 9;
      display: block;
      background: #000;
    }
    .player-bar {
      background: var(--surface);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .now-playing { font-size: 0.92rem; font-weight: 600; }
    .sub-status { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover, button:focus-visible {
      outline: 2px solid #fff;
      background: #273043;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #c40711; }

    .section-title {
      margin: 22px 0 10px;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .card.active { border-color: var(--accent); background: var(--accent-soft); }
    .card-title { font-size: 0.88rem; font-weight: 600; word-break: break-word; line-height: 1.3; }
    .card-meta { font-size: 0.75rem; color: var(--muted); }
    .suntv-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 220px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">YSTREAM</span>
      <span>Live TV & YPlay</span>
    </div>
    <div id="serverStatus" class="status-pill">Checking server...</div>
  </header>

  <div class="container">
    <div class="player-box">
      <video id="video" controls playsinline preload="auto"></video>
      <div class="player-bar">
        <div>
          <div id="nowPlaying" class="now-playing">Select a channel or YPlay movie</div>
          <div id="playerLog" class="sub-status">Ready</div>
        </div>
        <div class="btn-row">
          <button id="nextBtn" onclick="playNextYPlay()">Next YPlay</button>
          <button onclick="rotateScreen()">Rotate View</button>
          <button onclick="toggleFullscreen()">Fullscreen</button>
        </div>
      </div>
    </div>

    <div class="section-title">
      <span>YPlay Queue (Telegram Movies & Series)</span>
      <button onclick="loadYPlay()">Refresh Queue</button>
    </div>
    <div id="yplayGrid" class="grid"></div>

    <div class="section-title">
      <span>Tamil Live TV</span>
    </div>
    <div class="suntv-box">
      <input id="suntvInput" type="text" placeholder="Paste Sun TV .m3u8 source URL here (optional)" />
      <button class="primary" onclick="saveSunTvSource()">Save Sun TV Source</button>
    </div>
    <div id="liveGrid" class="grid"></div>
  </div>

  <script>
    const BACKEND_URL = "https://finances-companies-suspected-simulations.trycloudflare.com";

    const LIVE_CHANNELS = [
      { id: "suntv", name: "Sun TV (Smooth 25fps Relay)", group: "Tamil", url: `${BACKEND_URL}/live/suntv/index.m3u8` }
    ];

    let yplayItems = [];
    let currentYPlayIdx = -1;
    let hls = null;

    const video = document.getElementById("video");
    const nowPlaying = document.getElementById("nowPlaying");
    const playerLog = document.getElementById("playerLog");
    const serverStatus = document.getElementById("serverStatus");

    function setLog(msg, isError = false) {
      playerLog.textContent = msg;
      playerLog.style.color = isError ? "#ef4444" : "#9aa3b2";
    }

    function destroyHls() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    function playStream(url, title) {
      destroyHls();
      video.pause();
      nowPlaying.textContent = title;
      setLog("Loading stream...");

      if (url.includes(".m3u8") && window.Hls && window.Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 15,
          maxBufferLength: 20,
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          setLog("Playing HLS stream");
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            setLog(`HLS Error (${data.type}): ${data.details}`, true);
          }
        });
      } else {
        video.src = url;
        video.load();
        video.play().then(() => {
          setLog("Playing stream");
        }).catch((err) => {
          setLog(`Playback error: ${err.message || err}`, true);
        });
      }
    }

    video.addEventListener("error", () => {
      const code = video.error ? video.error.code : 0;
      setLog(`Player error code ${code}. Tap play or try another item.`, true);
    });

    video.addEventListener("ended", () => {
      if (currentYPlayIdx >= 0 && currentYPlayIdx + 1 < yplayItems.length) {
        playYPlayIndex(currentYPlayIdx + 1);
      }
    });

    function playYPlayIndex(idx) {
      if (idx < 0 || idx >= yplayItems.length) return;
      currentYPlayIdx = idx;
      const item = yplayItems[idx];
      renderYPlay();
      playStream(`${BACKEND_URL}/api/yplay/stream/${idx}`, `YPlay #${idx + 1}: ${item.title}`);
    }

    function playNextYPlay() {
      if (!yplayItems.length) {
        setLog("No YPlay items in queue. Send a movie to Telegram bot first.", true);
        return;
      }
      const nextIdx = currentYPlayIdx + 1 < yplayItems.length ? currentYPlayIdx + 1 : 0;
      playYPlayIndex(nextIdx);
    }

    async function checkHealth() {
      try {
        const res = await fetch(`${BACKEND_URL}/health`);
        const data = await res.json();
        if (res.ok && data.status === "ok") {
          serverStatus.textContent = `Server Online • Bot: ${data.bot_connected ? "Connected" : "Offline"} • Queue: ${data.yplay_count}`;
          serverStatus.className = "status-pill ok";
        } else {
          serverStatus.textContent = "Server issue";
          serverStatus.className = "status-pill err";
        }
      } catch (e) {
        serverStatus.textContent = "Backend unreachable (check URL)";
        serverStatus.className = "status-pill err";
      }
    }

    async function loadYPlay() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/yplay/library`);
        const data = await res.json();
        yplayItems = data.items || [];
        renderYPlay();
        checkHealth();
      } catch (e) {
        setLog("Could not load YPlay queue from server.", true);
      }
    }

    function renderYPlay() {
      const grid = document.getElementById("yplayGrid");
      if (!yplayItems.length) {
        grid.innerHTML = `<div class="card"><div class="card-title">No movies yet</div><div class="card-meta">Send movies/episodes to your Telegram bot.</div></div>`;
        return;
      }
      grid.innerHTML = yplayItems.map((item, i) => {
        const mb = item.file_size ? `${(item.file_size / (1024 * 1024)).toFixed(1)} MB` : "Video";
        const activeClass = i === currentYPlayIdx ? "card active" : "card";
        return `
          <div class="${activeClass}">
            <div>
              <div class="card-title">#${i + 1} ${escapeHtml(item.title)}</div>
              <div class="card-meta">${mb}</div>
            </div>
            <button class="primary" onclick="playYPlayIndex(${i})">Play</button>
          </div>
        `;
      }).join("");
    }

    function renderLive() {
      const grid = document.getElementById("liveGrid");
      grid.innerHTML = LIVE_CHANNELS.map((ch) => `
        <div class="card">
          <div>
            <div class="card-title">${escapeHtml(ch.name)}</div>
            <div class="card-meta">${escapeHtml(ch.group)}</div>
          </div>
          <button class="primary" onclick="playStream('${ch.url}', '${escapeHtml(ch.name)}')">Watch Live</button>
        </div>
      `).join("");
    }

    async function saveSunTvSource() {
      const input = document.getElementById("suntvInput");
      const url = input.value.trim();
      if (!url) {
        setLog("Enter a Sun TV stream URL first.", true);
        return;
      }
      try {
        const res = await fetch(`${BACKEND_URL}/api/channels/suntv`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source_url: url })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          setLog("Sun TV relay started (25fps smooth HLS).");
        } else {
          setLog(`Relay message: ${data.error || "Check source URL"}`, true);
        }
      } catch (e) {
        setLog("Failed to save Sun TV source URL.", true);
      }
    }

    function toggleFullscreen() {
      if (video.requestFullscreen) {
        video.requestFullscreen().catch(() => {});
      } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      }
    }

    async function rotateScreen() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          const next = screen.orientation.type.startsWith("landscape") ? "portrait" : "landscape";
          await screen.orientation.lock(next);
          setLog(`Orientation locked to ${next}`);
        } else {
          setLog("Use device auto-rotate or Fullscreen button.");
        }
      } catch (e) {
        setLog("Browser blocked orientation lock; use Fullscreen.");
      }
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    renderLive();
    loadYPlay();
    setInterval(checkHealth, 15000);
  </script>
</body>
</html>
