<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YStream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.12/dist/shaka-player.compiled.js"></script>
  <style>
    :root {
      --bg: #080a0f;
      --card: #121620;
      --card-hover: #191f2e;
      --active-bg: #13223b;
      --active-border: #2563eb;
      --accent: #e50914;
      --text: #f3f5f8;
      --muted: #8e98a8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    /* Top Video Player Area */
    .player-stage {
      position: sticky;
      top: 0;
      z-index: 25;
      background: #000;
      border-bottom: 1px solid var(--border);
    }
    video {
      width: 100%;
      max-height: 42vh;
      aspect-ratio: 16 / 9;
      display: block;
      background: #000;
    }
    .player-bar {
      background: #0e121b;
      padding: 9px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border);
    }
    .bar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .now-title { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now-sub { font-size: 0.72rem; color: var(--muted); }

    /* VOD Progress Bar (Hidden during Live TV) */
    .vod-seek {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .vod-seek.hide { display: none; }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .bar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .ctrl-left, .ctrl-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    button {
      background: #1a2030;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover, button:focus-visible {
      background: #252e44;
      border-color: #ffffff;
      outline: 2px solid #ffffff;
    }
    button.red { background: var(--accent); border-color: var(--accent); color: #fff; }

    .container { max-width: 960px; margin: 0 auto; padding: 14px; }

    /* Section Header matching reference */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 10px;
    }
    .sec-title { font-size: 1.08rem; font-weight: 700; }
    .sec-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .live-pill {
      background: #17253f;
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.35);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 7px;
    }

    /* Channel Rows matching reference */
    .channel-list { display: flex; flex-direction: column; gap: 9px; }
    .ch-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }
    .ch-card:hover, .ch-card:focus-visible {
      background: var(--card-hover);
      outline: 2px solid #ffffff;
    }
    .ch-card.active {
      background: var(--active-bg);
      border-color: var(--active-border);
    }
    .ch-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .ch-logo-box {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .ch-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }
    .ch-name { font-size: 0.95rem; font-weight: 700; }
    .ch-meta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .ch-eq { font-size: 0.85rem; color: #60a5fa; font-weight: 800; padding-right: 4px; }

    /* YPlay Movie List */
    .yplay-list { display: flex; flex-direction: column; gap: 8px; }
    .yp-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .yp-card:hover, .yp-card:focus-visible {
      background: var(--card-hover);
      outline: 2px solid #ffffff;
    }
    .yp-card.active {
      background: var(--active-bg);
      border-color: var(--active-border);
    }
    .yp-title { font-size: 0.9rem; font-weight: 700; word-break: break-word; }
    .yp-meta { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="player-stage" id="stage">
    <video id="video" playsinline preload="metadata"></video>
    <div class="player-bar">
      <div class="bar-top">
        <div style="min-width:0;">
          <div id="nowTitle" class="now-title">Sun TV</div>
          <div id="nowSub" class="now-sub">Tap Play to start</div>
        </div>
        <div id="liveTag" class="live-pill">6 LIVE</div>
      </div>

      <div id="vodSeek" class="vod-seek hide">
        <span id="curTxt">00:00</span>
        <input id="seekInput" type="range" min="0" max="1000" value="0" step="1" />
        <span id="durTxt">00:00</span>
      </div>

      <div class="bar-controls">
        <div class="ctrl-left">
          <button id="playBtn" class="red" onclick="togglePlay()">Play</button>
          <button id="rewBtn" class="vod-seek hide" onclick="seekOffset(-10)">-10s</button>
          <button id="fwdBtn" class="vod-seek hide" onclick="seekOffset(10)">+10s</button>
          <button id="nextYpBtn" class="vod-seek hide" onclick="playNextYPlay()">Next Movie</button>
        </div>
        <div class="ctrl-right">
          <button onclick="toggleMute()">Mute</button>
          <button onclick="toggleRotate()">Rotate</button>
          <button onclick="toggleFullscreen()">Fullscreen</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="sec-head">
      <div>
        <div class="sec-title">Live Channels</div>
        <div class="sec-sub">Tap any channel to start watching</div>
      </div>
      <div class="live-pill">6 LIVE</div>
    </div>
    <div id="channelList" class="channel-list"></div>

    <div class="sec-head" style="margin-top:22px;">
      <div>
        <div class="sec-title">YPlay Movies</div>
        <div class="sec-sub">Telegram bot queue (first item auto-loaded)</div>
      </div>
      <button onclick="fetchYPlay(true)">Refresh</button>
    </div>
    <div id="yplayList" class="yplay-list"></div>
  </div>

  <script>
    const BACKEND_URL = "https://finances-companies-suspected-simulations.trycloudflare.com";

    const CHANNELS = [
      {
        id: "suntv",
        num: "#01",
        name: "Sun TV",
        cat: "Entertainment • Live",
        type: "hls",
        url: "https://d2px1d6ssc60fw.cloudfront.net/SunTV/SunTV-HDR10-IN-index.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/3/3e/Sun_TV_logo.svg/240px-Sun_TV_logo.svg.png"
      },
      {
        id: "zeetamil",
        num: "#02",
        name: "Zee Tamil HD",
        cat: "Entertainment • HD",
        type: "hls",
        url: "https://da86m1sqpm3o0.cloudfront.net/28072023/smil:zeetamil1.smil/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/51/Zee_Tamil_logo.svg/240px-Zee_Tamil_logo.svg.png"
      },
      {
        id: "colorstamil",
        num: "#03",
        name: "Colors Tamil HD",
        cat: "Entertainment • HD",
        type: "hls",
        url: "https://da86m1sqpm3o0.cloudfront.net/28072023/smil:colorstamilhd11.smil/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/2/2f/Colors_Tamil_logo.svg/240px-Colors_Tamil_logo.svg.png"
      },
      {
        id: "makkaltv",
        num: "#04",
        name: "Makkal TV",
        cat: "General • Live",
        type: "hls",
        url: "https://5k8q87azdy4v-hls-live.wmncdn.net/MAKKAL/271ddf829afeece44d8732757fba1a66.sdp/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/8/87/Makkal_TV_logo.png/240px-Makkal_TV_logo.png"
      },
      {
        id: "historytv18",
        num: "#05",
        name: "History TV18 HD",
        cat: "Infotainment • HD",
        type: "dash-clearkey",
        url: "https://login.bheem.tv/bpk-tv/22652/output/index.mpd",
        kid: "c6cb0bcbeac25fb286fed851e41de38c",
        key: "955c54f2cac8783fafccae5e5f9cdf8d",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/History_Channel_logo.svg/240px-History_Channel_logo.svg.png"
      },
      {
        id: "discoverytamil",
        num: "#06",
        name: "Discovery Tamil",
        cat: "Infotainment • HD",
        type: "dash-clearkey",
        url: "https://login.bheem.tv/bpk-tv/22652/output/index.mpd",
        kid: "c6cb0bcbeac25fb286fed851e41de38c",
        key: "955c54f2cac8783fafccae5e5f9cdf8d",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Discovery_Channel_logo_2019.svg/240px-Discovery_Channel_logo_2019.svg.png"
      }
    ];

    const video = document.getElementById("video");
    const nowTitle = document.getElementById("nowTitle");
    const nowSub = document.getElementById("nowSub");
    const liveTag = document.getElementById("liveTag");
    const playBtn = document.getElementById("playBtn");
    const seekInput = document.getElementById("seekInput");
    const curTxt = document.getElementById("curTxt");
    const durTxt = document.getElementById("durTxt");

    let hls = null;
    let shakaPlayer = null;
    let activeChannelId = "suntv";
    let yplayItems = [];
    let activeYPlayIdx = -1;
    let isLive = true;
    let seeking = false;

    function setVodMode(vod) {
      isLive = !vod;
      liveTag.style.display = vod ? "none" : "inline-block";
      document.querySelectorAll(".vod-seek").forEach((el) => {
        el.classList.toggle("hide", !vod);
      });
    }

    async function cleanupPlayers() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      if (shakaPlayer) {
        try { await shakaPlayer.destroy(); } catch (_) {}
        shakaPlayer = null;
      }
    }

    async function playChannel(ch, autoPlay = true) {
      await cleanupPlayers();
      activeChannelId = ch.id;
      activeYPlayIdx = -1;
      setVodMode(false);
      renderChannels();
      renderYPlay();

      nowTitle.textContent = ch.name;
      nowSub.textContent = `${ch.num} • ${ch.cat}`;

      if (ch.type === "dash-clearkey" && window.shaka && shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player();
        await shakaPlayer.attach(video);
        shakaPlayer.configure({
          drm: {
            clearKeys: {
              [ch.kid]: ch.key
            }
          },
          streaming: {
            bufferingGoal: 12,
            rebufferingGoal: 2
          }
        });
        try {
          await shakaPlayer.load(ch.url);
          if (autoPlay) video.play().catch(() => {});
        } catch (e) {
          nowSub.textContent = "Unable to start stream";
        }
        return;
      }

      if (ch.url.includes(".m3u8") && window.Hls && window.Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxBufferLength: 16,
          backBufferLength: 10
        });
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (autoPlay) video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) nowSub.textContent = "Stream temporarily unavailable";
        });
      } else {
        video.src = ch.url;
        video.load();
        if (autoPlay) video.play().catch(() => {});
      }
    }

    async function loadYPlay(idx, autoPlay = false) {
      if (idx < 0 || idx >= yplayItems.length) return;
      await cleanupPlayers();
      activeChannelId = "";
      activeYPlayIdx = idx;
      setVodMode(true);
      renderChannels();
      renderYPlay();

      const item = yplayItems[idx];
      nowTitle.textContent = item.title;
      nowSub.textContent = item.cached ? "Cached • Ready" : "Pre-caching • Ready";

      video.src = `${BACKEND_URL}/api/yplay/stream/${idx}`;
      video.load();
      if (autoPlay) {
        video.play().catch(() => {});
      }
    }

    function playNextYPlay() {
      if (!yplayItems.length) return;
      const next = activeYPlayIdx + 1 < yplayItems.length ? activeYPlayIdx + 1 : 0;
      loadYPlay(next, true);
    }

    function togglePlay() {
      if (!video.src && !hls && !shakaPlayer) {
        if (yplayItems.length > 0 && activeYPlayIdx >= 0) {
          loadYPlay(activeYPlayIdx, true);
        } else {
          const ch = CHANNELS.find((c) => c.id === activeChannelId) || CHANNELS[0];
          playChannel(ch, true);
        }
        return;
      }
      if (video.paused) video.play().catch(() => {});
      else video.pause();
    }

    function seekOffset(sec) {
      if (isLive || !isFinite(video.duration)) return;
      video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + sec));
    }

    function toggleMute() {
      video.muted = !video.muted;
    }

    function toggleFullscreen() {
      const el = document.getElementById("stage");
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    }

    async function toggleRotate() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          const next = screen.orientation.type.startsWith("landscape") ? "portrait" : "landscape";
          await screen.orientation.lock(next);
        }
      } catch (_) {}
    }

    function fmt(t) {
      if (!isFinite(t) || t < 0) return "00:00";
      return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
    }

    video.addEventListener("play", () => { playBtn.textContent = "Pause"; });
    video.addEventListener("pause", () => { playBtn.textContent = "Play"; });
    video.addEventListener("timeupdate", () => {
      if (isLive || seeking || !isFinite(video.duration) || video.duration <= 0) return;
      seekInput.value = String(Math.round((video.currentTime / video.duration) * 1000));
      curTxt.textContent = fmt(video.currentTime);
      durTxt.textContent = fmt(video.duration);
    });
    video.addEventListener("ended", () => {
      if (!isLive && activeYPlayIdx + 1 < yplayItems.length) {
        loadYPlay(activeYPlayIdx + 1, true);
      }
    });

    seekInput.addEventListener("input", () => { seeking = true; });
    seekInput.addEventListener("change", () => {
      if (!isLive && isFinite(video.duration) && video.duration > 0) {
        video.currentTime = (Number(seekInput.value) / 1000) * video.duration;
      }
      seeking = false;
    });

    function renderChannels() {
      const box = document.getElementById("channelList");
      box.innerHTML = CHANNELS.map((ch) => {
        const active = ch.id === activeChannelId ? "ch-card active" : "ch-card";
        return `
          <div class="${active}" tabindex="0" onclick='playChannelById("${ch.id}")' onkeydown='if(event.key==="Enter")playChannelById("${ch.id}")'>
            <div class="ch-left">
              <div class="ch-logo-box">
                <img src="${esc(ch.logo)}" alt="${esc(ch.name)}" onerror="this.style.display='none'" />
              </div>
              <div>
                <div class="ch-name">${esc(ch.name)}</div>
                <div class="ch-meta">${esc(ch.num)} • ${esc(ch.cat)}</div>
              </div>
            </div>
            <div class="ch-eq">${ch.id === activeChannelId ? "•••" : ""}</div>
          </div>
        `;
      }).join("");
    }

    function playChannelById(id) {
      const ch = CHANNELS.find((c) => c.id === id);
      if (ch) playChannel(ch, true);
    }

    function renderYPlay() {
      const box = document.getElementById("yplayList");
      if (!yplayItems.length) {
        box.innerHTML = `<div class="yp-card"><div><div class="yp-title">No movies in queue</div><div class="yp-meta">Forward a movie to your Telegram bot</div></div></div>`;
        return;
      }
      box.innerHTML = yplayItems.map((m, i) => {
        const mb = m.file_size ? `${(m.file_size / (1024 * 1024)).toFixed(0)} MB` : "Video";
        const cls = i === activeYPlayIdx ? "yp-card active" : "yp-card";
        return `
          <div class="${cls}" tabindex="0" onclick="loadYPlay(${i}, true)" onkeydown="if(event.key==='Enter')loadYPlay(${i},true)">
            <div>
              <div class="yp-title">${esc(m.title)}</div>
              <div class="yp-meta">#${i + 1} • ${mb} • ${m.cached ? "Ready" : "Caching"}</div>
            </div>
            <button class="red" onclick="event.stopPropagation();loadYPlay(${i},true)">Play</button>
          </div>
        `;
      }).join("");
    }

    async function fetchYPlay(forceFirst = false) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/yplay/library`);
        const data = await res.json();
        const prevFirst = yplayItems[0] ? yplayItems[0].id : null;
        yplayItems = data.items || [];
        renderYPlay();

        if (yplayItems.length > 0 && (forceFirst || (activeChannelId === "" && activeYPlayIdx < 0) || (prevFirst !== yplayItems[0].id && activeChannelId === ""))) {
          loadYPlay(0, false);
        }
      } catch (_) {}
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    renderChannels();
    playChannel(CHANNELS[0], false);
    fetchYPlay(false);
    setInterval(() => fetchYPlay(false), 6000);
  </script>
</body>
</html>
