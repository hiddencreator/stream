name: Build YStream Android TV APK

on:
  push:
    branches: ["main"]
    paths:
      - "assets/icon.png"
      - ".github/workflows/build-tv-apk.yml"
  workflow_dispatch:

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android TV WebView App
        run: |
          set -e
          mkdir -p tv-app/app/src/main/java/com/ystream/tv
          mkdir -p tv-app/app/src/main/res/layout tv-app/app/src/main/res/values tv-app/app/src/main/res/mipmap-hdpi tv-app/app/src/main/res/mipmap-mdpi tv-app/app/src/main/res/mipmap-xhdpi tv-app/app/src/main/res/mipmap-xxhdpi tv-app/app/src/main/res/mipmap-xxxhdpi

          cat << 'GRADLE_ROOT' > tv-app/build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          GRADLE_ROOT

          cat << 'GRADLE_PROPS' > tv-app/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          GRADLE_PROPS

          cat << 'SETTINGS' > tv-app/settings.gradle
          rootProject.name = "YStreamTV"
          include ':app'
          SETTINGS

          cat << 'APP_GRADLE' > tv-app/app/build.gradle
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.ystream.tv'
            compileSdk 34
            defaultConfig {
              applicationId "com.ystream.tv"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release {
                minifyEnabled false
              }
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          APP_GRADLE

          cat << 'MANIFEST' > tv-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-feature android:name="android.software.leanback" android:required="false" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

            <application
              android:label="YStream TV"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:banner="@mipmap/ic_launcher"
              android:usesCleartextTraffic="true"
              android:theme="@style/Theme.AppCompat.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST

          cat << 'MAIN_JAVA' > tv-app/app/src/main/java/com/ystream/tv/MainActivity.java
          package com.ystream.tv;

          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
              );
              setContentView(R.layout.activity_main);

              webView = findViewById(R.id.webview);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              webView.setWebChromeClient(new WebChromeClient());
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("https://ystream.pages.dev");
            }

            @Override
            public boolean onKeyDown(int keyCode, KeyEvent event) {
              if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                webView.goBack();
                return true;
              }
              return super.onKeyDown(keyCode, event);
            }
          }
          MAIN_JAVA

          cat << 'LAYOUT' > tv-app/app/src/main/res/layout/activity_main.xml
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#080A0F">
            <WebView
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          </FrameLayout>
          LAYOUT

          if [ -f assets/icon.png ]; then
            for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp assets/icon.png "tv-app/app/src/main/res/$dir/ic_launcher.png"
            done
          fi

          gradle -p tv-app assembleDebug --no-daemon

      - name: Upload TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YStream-Android-TV-APK
          path: tv-app/app/build/outputs/apk/debug/*.apk
