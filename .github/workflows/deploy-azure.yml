name: Deploy YStream to Azure

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass openssh-client

      - name: Deploy to Azure VM
        env:
          AZURE_IP: ${{ secrets.AZURE_IP }}
          AZURE_PASSWORD: ${{ secrets.AZURE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e
          export SSHPASS="$AZURE_PASSWORD"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          sshpass -e ssh $SSH_OPTS azureuser@"$AZURE_IP" "mkdir -p ~/ystream/data"
          sshpass -e scp $SSH_OPTS -r server/* azureuser@"$AZURE_IP":~/ystream/

          cat << 'SETUP_EOF' > /tmp/azure_setup.sh
          set -e
          if ! command -v python3 >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip python3-venv ffmpeg curl
          fi

          if ! command -v cloudflared >/dev/null 2>&1; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cf.deb
            sudo dpkg -i /tmp/cf.deb || sudo apt-get install -f -y
            rm -f /tmp/cf.deb
          fi

          if [ ! -d ~/ystream/venv ]; then
            python3 -m venv ~/ystream/venv
          fi

          ~/ystream/venv/bin/pip install --upgrade pip -q
          ~/ystream/venv/bin/pip install -r ~/ystream/requirements.txt -q

          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$BOT_TOKEN_VAL" > ~/ystream/.env

          printf '[Unit]\nDescription=YStream Backend\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nType=simple\nUser=azureuser\nWorkingDirectory=/home/azureuser/ystream\nEnvironmentFile=/home/azureuser/ystream/.env\nExecStart=/home/azureuser/ystream/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1\nRestart=always\nRestartSec=3\n\n[Install]\nWantedBy=multi-user.target\n' | sudo tee /etc/systemd/system/ystream.service >/dev/null

          printf '[Unit]\nDescription=YStream Cloudflare Tunnel\nAfter=ystream.service\nWants=ystream.service\n\n[Service]\nType=simple\nUser=azureuser\nExecStart=/usr/bin/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000\nStandardOutput=journal\nStandardError=journal\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' | sudo tee /etc/systemd/system/ystream-tunnel.service >/dev/null

          sudo systemctl daemon-reload
          sudo systemctl enable ystream ystream-tunnel
          sudo systemctl restart ystream
          if ! sudo systemctl is-active --quiet ystream-tunnel; then
            sudo systemctl start ystream-tunnel
            sleep 6
          fi
          echo "=== CLOUDFLARE URL ==="
          sudo journalctl -u ystream-tunnel -n 50 --no-pager | grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | tail -n 1 || true
          echo "======================"
          SETUP_EOF

          ENCODED_SCRIPT=$(base64 -w 0 /tmp/azure_setup.sh)
          ENCODED_TOKEN=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | base64 -w 0)

          sshpass -e ssh $SSH_OPTS azureuser@"$AZURE_IP" "echo '$ENCODED_TOKEN' | base64 -d > /tmp/tok.b64 && echo '$ENCODED_SCRIPT' | base64 -d > /tmp/run_setup.sh && BOT_TOKEN_VAL=\$(cat /tmp/tok.b64) bash /tmp/run_setup.sh && rm -f /tmp/tok.b64 /tmp/run_setup.sh"
