name: Download YStream TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android TV Project
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          mkdir -p app/src/main/java/com/ystream/app app/src/main/res/drawable

          cat <<'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YStreamTV"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ystream.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ystream.app"
                  minSdk 23
                  targetSdk 34
                  versionCode 7
                  versionName "7.0-TV"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat <<'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#080A0F" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#E50914" android:pathData="M38,30 L78,54 L38,78 Z"/>
          </vector>
          EOF

          cat <<'EOF' > app/src/main/res/drawable/tv_banner.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path android:fillColor="#080A0F" android:pathData="M0,0h320v180h-320z"/>
              <path android:fillColor="#14233D" android:pathData="M0,152h320v28h-320z"/>
              <path android:fillColor="#E50914" android:pathData="M132,48 L196,86 L132,124 Z"/>
          </vector>
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="YStream"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/tv_banner"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="landscape"
                      android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.REBOOT" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/java/com/ystream/app/BootReceiver.java
          package com.ystream.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Handler;
          import android.os.Looper;

          public class BootReceiver extends BroadcastReceiver {
              private void bringToFront(Context context, boolean force) {
                  if (!force && MainActivity.isForeground) return;
                  try {
                      Intent launch = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                                  | Intent.FLAG_ACTIVITY_SINGLE_TOP
                                  | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                          context.startActivity(launch);
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null || intent.getAction() == null) return;
                  String action = intent.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(action)
                          || "android.intent.action.QUICKBOOT_POWERON".equals(action)
                          || "com.htc.intent.action.QUICKBOOT_POWERON".equals(action)
                          || Intent.ACTION_REBOOT.equals(action)
                          || Intent.ACTION_MY_PACKAGE_REPLACED.equals(action)) {
                      bringToFront(context, true);
                      final PendingResult pending = goAsync();
                      final Context appCtx = context.getApplicationContext();
                      Handler handler = new Handler(Looper.getMainLooper());
                      handler.postDelayed(() -> bringToFront(appCtx, false), 1200);
                      handler.postDelayed(() -> bringToFront(appCtx, false), 2800);
                      handler.postDelayed(() -> {
                          bringToFront(appCtx, false);
                          try { pending.finish(); } catch (Exception ignored) {}
                      }, 4500);
                  }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/ystream/app/MainActivity.java
          package com.ystream.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkRequest;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import java.util.UUID;

          public class MainActivity extends Activity {
              public static volatile boolean isForeground = false;
              private static final String APP_URL = "https://ystream.pages.dev";

              private WebView webView;
              private FrameLayout rootLayout;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private WebChromeClient chromeClient;
              private ConnectivityManager connectivityManager;
              private ConnectivityManager.NetworkCallback networkCallback;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private boolean pageLoadedSuccessfully = false;
              private long lastFallbackBackTime = 0L;
              private String persistentDeviceId = "";
              private String persistentDeviceName = "";

              private void initDeviceIdentity() {
                  SharedPreferences prefs = getSharedPreferences("ystream_device_prefs", Context.MODE_PRIVATE);
                  String savedId = prefs.getString("ys_device_id", "");
                  if (savedId != null && savedId.matches("^[a-zA-Z0-9_-]{8,64}$")) {
                      persistentDeviceId = savedId;
                  } else {
                      String androidId = "";
                      try {
                          String raw = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                          if (raw != null && !"9774d56d682e549c".equalsIgnoreCase(raw)) {
                              androidId = raw.replaceAll("[^a-zA-Z0-9_-]", "");
                          }
                      } catch (Exception ignored) {}

                      if (androidId.length() >= 8) {
                          persistentDeviceId = "tv_" + androidId;
                      } else {
                          persistentDeviceId = "tv_" + UUID.randomUUID().toString().replace("-", "");
                      }
                      prefs.edit().putString("ys_device_id", persistentDeviceId).apply();
                  }

                  String mfg = Build.MANUFACTURER != null ? Build.MANUFACTURER.trim() : "";
                  String mdl = Build.MODEL != null ? Build.MODEL.trim() : "Android TV";
                  String combined;
                  if (!mfg.isEmpty() && !mdl.toLowerCase().startsWith(mfg.toLowerCase())) {
                      String capMfg = mfg.substring(0, 1).toUpperCase() + mfg.substring(1);
                      combined = capMfg + " " + mdl;
                  } else {
                      combined = mdl;
                  }
                  combined = combined.replaceAll("[^\\w\\s().-]", "").trim();
                  if (combined.length() > 36) combined = combined.substring(0, 36);
                  persistentDeviceName = combined.isEmpty() ? "Android TV" : combined;
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public String getDeviceId() {
                      return persistentDeviceId;
                  }

                  @JavascriptInterface
                  public String getDeviceName() {
                      return persistentDeviceName;
                  }
              }

              private void enableImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              private void requestTvAudio() {
                  try {
                      AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      if (am != null) {
                          am.requestAudioFocus(null, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                      }
                  } catch (Exception ignored) {}
              }

              private void loadAppIfNeeded() {
                  if (webView == null) return;
                  String cur = webView.getUrl();
                  if (!pageLoadedSuccessfully || cur == null || !cur.startsWith(APP_URL)) {
                      webView.loadUrl(APP_URL);
                  }
              }

              private void registerNetworkWatcher() {
                  try {
                      connectivityManager = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (connectivityManager == null) return;
                      NetworkRequest req = new NetworkRequest.Builder()
                              .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              .build();
                      networkCallback = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              mainHandler.post(() -> loadAppIfNeeded());
                          }
                      };
                      connectivityManager.registerNetworkCallback(req, networkCallback);
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  initDeviceIdentity();
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  enableImmersive();
                  requestTvAudio();

                  rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.BLACK);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  webView.addJavascriptInterface(new NativeBridge(), "YStreamNative");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          if (url != null && url.startsWith(APP_URL)) {
                              pageLoadedSuccessfully = true;
                          }
                          requestTvAudio();
                          view.requestFocus();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          if (request != null && request.isForMainFrame()) {
                              pageLoadedSuccessfully = false;
                              mainHandler.postDelayed(() -> loadAppIfNeeded(), 1500);
                          }
                      }
                  });

                  chromeClient = new WebChromeClient() {
                      @Override
                      public Bitmap getDefaultVideoPoster() {
                          Bitmap bmp = Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
                          bmp.setPixel(0, 0, Color.BLACK);
                          return bmp;
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          rootLayout.addView(customView, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));
                          enableImmersive();
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          rootLayout.removeView(customView);
                          customView = null;
                          if (customViewCallback != null) {
                              customViewCallback.onCustomViewHidden();
                              customViewCallback = null;
                          }
                          webView.setVisibility(View.VISIBLE);
                          webView.requestFocus();
                          enableImmersive();
                      }
                  };
                  webView.setWebChromeClient(chromeClient);

                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(rootLayout);
                  registerNetworkWatcher();
                  webView.loadUrl(APP_URL);
                  webView.requestFocus();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  isForeground = true;
                  enableImmersive();
                  requestTvAudio();
                  loadAppIfNeeded();
              }

              @Override
              protected void onPause() {
                  isForeground = false;
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  isForeground = false;
                  try {
                      if (connectivityManager != null && networkCallback != null) {
                          connectivityManager.unregisterNetworkCallback(networkCallback);
                      }
                  } catch (Exception ignored) {}
                  super.onDestroy();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enableImmersive();
              }

              private void handleTvBack() {
                  if (customView != null) {
                      chromeClient.onHideCustomView();
                      return;
                  }
                  if (webView != null) {
                      webView.evaluateJavascript(
                              "(function(){ return (typeof processBackAction === 'function') ? processBackAction() : 'NO_JS'; })()",
                              value -> {
                                  if ("true".equals(value)) {
                                      return;
                                  }
                                  if ("false".equals(value)) {
                                      finish();
                                      return;
                                  }
                                  long now = System.currentTimeMillis();
                                  if (now - lastFallbackBackTime < 2200) {
                                      finish();
                                  } else {
                                      lastFallbackBackTime = now;
                                      Toast.makeText(MainActivity.this, "Press Back again to exit", Toast.LENGTH_SHORT).show();
                                  }
                              });
                  } else {
                      finish();
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (event.getRepeatCount() == 0) {
                          handleTvBack();
                      }
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              public void onBackPressed() {
                  handleTvBack();
              }
          }
          EOF

      - name: Build TV APK
        run: gradle assembleDebug --no-daemon

      - name: Upload YStream TV APK
        uses: actions/upload-artifact@v4
        with:
          name: YStream-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
