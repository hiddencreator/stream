name: Build Clean TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node & Cordova
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Pure Clean APK with Custom Logo
        run: |
          npm install -g cordova
          cordova create ystream com.ystream.app YStream
          cd ystream
          cordova platform add android
          
          # assets folder setup
          mkdir -p www/assets
          cp -r ../assets/* www/assets/ 2>/dev/null || true
          cp ../assets/icon.png www/icon.png

          # Splash screen & logo replace
          find platforms/android/app/src/main/res/ -name "ic_cdv_splashscreen.png" -exec cp ../assets/icon.png {} \;
          find platforms/android/app/src/main/res/ -name "screen.png" -exec cp ../assets/icon.png {} \;
          find platforms/android/app/src/main/res/ -name "ic_launcher*.png" -exec cp ../assets/icon.png {} \;

          # Config without forced landscape (Responsive to Web JS)
          sed -i 's/<content src="index.html" \/>/<content src="https:\/\/ystream.pages.dev\/" \/>\n    <preference name="KeepRunning" value="true" \/>\n    <preference name="Fullscreen" value="true" \/>\n    <icon src="www\/icon.png" \/>\n    <preference name="SplashScreen" value="screen" \/>\n    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="www\/icon.png" \/>\n    <preference name="AndroidWindowSplashScreenBackground" value="#0d1117" \/>\n    <preference name="SplashScreenDelay" value="2500" \/>\n    <preference name="ShowSplashScreenSpinner" value="false" \/>/g' config.xml
          
          cordova build android --debug

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: YStream-Clean-TV-APK
          path: ystream/platforms/android/app/build/outputs/apk/debug/*.apk
