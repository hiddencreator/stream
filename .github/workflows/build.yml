name: Build Native ExoPlayer TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node & Cordova
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Native ExoPlayer Hybrid APK
        run: |
          npm install -g cordova
          cordova create ystream com.ystream.app YStream
          cd ystream
          cordova platform add android

          # Copy custom assets & icons
          mkdir -p www/assets
          cp -r ../assets/* www/assets/ 2>/dev/null || true
          cp ../assets/icon.png www/icon.png

          find platforms/android/app/src/main/res/ -name "ic_cdv_splashscreen.png" -exec cp ../assets/icon.png {} \;
          find platforms/android/app/src/main/res/ -name "screen.png" -exec cp ../assets/icon.png {} \;
          find platforms/android/app/src/main/res/ -name "ic_launcher*.png" -exec cp ../assets/icon.png {} \;

          # Remove default Kotlin/Java MainActivity to prevent duplicate class error
          find platforms/android/app/src/main -name "MainActivity.*" -delete
          mkdir -p platforms/android/app/src/main/java/com/ystream/app

          # Add Google Media3 ExoPlayer (Hardware HLS + DASH + ClearKey DRM)
          cat << 'EOF' >> platforms/android/app/build.gradle

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
              implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
          }
          EOF

          # Write Native In-App Hardware ExoPlayer MainActivity.java
          cat << 'EOF' > platforms/android/app/src/main/java/com/ystream/app/MainActivity.java
          package com.ystream.app;

          import android.app.UiModeManager;
          import android.content.Context;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.TextureView;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.FrameLayout;

          import androidx.annotation.OptIn;
          import androidx.media3.common.C;
          import androidx.media3.common.Format;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.common.TrackSelectionParameters;
          import androidx.media3.common.Tracks;
          import androidx.media3.common.VideoSize;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.DefaultLoadControl;
          import androidx.media3.exoplayer.DefaultRenderersFactory;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.dash.DashMediaSource;
          import androidx.media3.exoplayer.drm.DefaultDrmSessionManager;
          import androidx.media3.exoplayer.drm.DrmSessionManager;
          import androidx.media3.exoplayer.drm.DrmSessionManagerProvider;
          import androidx.media3.exoplayer.drm.FrameworkMediaDrm;
          import androidx.media3.exoplayer.drm.LocalMediaDrmCallback;
          import androidx.media3.exoplayer.hls.HlsMediaSource;
          import androidx.media3.exoplayer.source.MediaSource;

          import org.apache.cordova.CordovaActivity;
          import org.json.JSONArray;

          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Set;
          import java.util.TreeSet;

          @OptIn(markerClass = UnstableApi.class)
          public class MainActivity extends CordovaActivity {

              private ExoPlayer exoPlayer;
              private TextureView textureView;
              private FrameLayout videoContainer;
              private WebView webView;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              private int vpX = 0;
              private int vpY = 0;
              private int vpW = 0;
              private int vpH = 0;
              private boolean vpRotated = false;
              private int videoWidth = 16;
              private int videoHeight = 9;
              private int retryCount = 0;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  super.init();

                  View rawView = appView.getView();
                  rawView.setBackgroundColor(Color.TRANSPARENT);
                  rawView.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                  if (rawView instanceof WebView) {
                      webView = (WebView) rawView;
                      webView.setBackgroundColor(Color.TRANSPARENT);
                      webView.addJavascriptInterface(new NativePlayerBridge(), "AndroidNativePlayer");
                  }

                  ViewGroup rootParent = (ViewGroup) rawView.getParent();
                  videoContainer = new FrameLayout(this);
                  videoContainer.setBackgroundColor(Color.BLACK);

                  textureView = new TextureView(this);
                  textureView.setFocusable(false);
                  textureView.setFocusableInTouchMode(false);
                  videoContainer.addView(textureView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          Gravity.CENTER
                  ));

                  rootParent.addView(videoContainer, 0, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  initExoPlayer();
                  loadUrl(launchUrl);
              }

              private void initExoPlayer() {
                  DefaultLoadControl loadControl = new DefaultLoadControl.Builder()
                          .setBufferDurationsMs(3000, 18000, 800, 1800)
                          .setPrioritizeTimeOverSizeThresholds(true)
                          .build();

                  DefaultRenderersFactory renderersFactory = new DefaultRenderersFactory(this)
                          .setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON);

                  exoPlayer = new ExoPlayer.Builder(this, renderersFactory)
                          .setLoadControl(loadControl)
                          .build();

                  exoPlayer.setVideoTextureView(textureView);
                  exoPlayer.setPlayWhenReady(true);

                  exoPlayer.addListener(new Player.Listener() {
                      @Override
                      public void onPlaybackStateChanged(int playbackState) {
                          if (playbackState == Player.STATE_BUFFERING) {
                              sendJsEvent("window.onNativeState && window.onNativeState('buffering', 'Buffering...');");
                          } else if (playbackState == Player.STATE_READY && exoPlayer.isPlaying()) {
                              retryCount = 0;
                              sendJsEvent("window.onNativeState && window.onNativeState('playing', '');");
                          }
                      }

                      @Override
                      public void onIsPlayingChanged(boolean isPlaying) {
                          if (isPlaying) {
                              retryCount = 0;
                              sendJsEvent("window.onNativeState && window.onNativeState('playing', '');");
                          }
                      }

                      @Override
                      public void onVideoSizeChanged(VideoSize videoSize) {
                          if (videoSize.width > 0 && videoSize.height > 0) {
                              videoWidth = videoSize.width;
                              videoHeight = videoSize.height;
                              applyLayoutAndAspect();
                          }
                      }

                      @Override
                      public void onTracksChanged(Tracks tracks) {
                          Set<Integer> heights = new TreeSet<>(Collections.reverseOrder());
                          int activeHeight = 0;

                          for (Tracks.Group group : tracks.getGroups()) {
                              if (group.getType() == C.TRACK_TYPE_VIDEO) {
                                  for (int i = 0; i < group.length; i++) {
                                      Format fmt = group.getTrackFormat(i);
                                      if (fmt.height > 0) {
                                          heights.add(fmt.height);
                                          if (group.isTrackSelected(i)) {
                                              activeHeight = fmt.height;
                                          }
                                      }
                                  }
                              }
                          }

                          List<Integer> list = new ArrayList<>(heights);
                          JSONArray arr = new JSONArray(list);
                          sendJsEvent("window.onNativeTracks && window.onNativeTracks('" + arr.toString() + "', " + activeHeight + ");");
                      }

                      @Override
                      public void onPlayerError(PlaybackException error) {
                          if (error.errorCode == PlaybackException.ERROR_CODE_BEHIND_LIVE_WINDOW) {
                              exoPlayer.seekToDefaultPosition();
                              exoPlayer.prepare();
                              exoPlayer.play();
                              return;
                          }

                          retryCount++;
                          if (retryCount <= 3) {
                              final int attempt = retryCount;
                              sendJsEvent("window.onNativeState && window.onNativeState('error', 'Reconnecting (" + attempt + "/3)...');");
                              mainHandler.postDelayed(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (exoPlayer != null) {
                                          exoPlayer.seekToDefaultPosition();
                                          exoPlayer.prepare();
                                          exoPlayer.play();
                                      }
                                  }
                              }, attempt * 1500L);
                          } else {
                              sendJsEvent("window.onNativeState && window.onNativeState('offline', 'Stream Offline / Unavailable');");
                          }
                      }
                  });
              }

              private void sendJsEvent(final String js) {
                  mainHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          if (webView != null) {
                              webView.setBackgroundColor(Color.TRANSPARENT);
                              webView.evaluateJavascript(js, null);
                          }
                      }
                  });
              }

              private void applyLayoutAndAspect() {
                  mainHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          if (videoContainer == null || textureView == null) return;
                          if (webView != null) {
                              webView.setBackgroundColor(Color.TRANSPARENT);
                          }

                          int rootW = ((View) videoContainer.getParent()).getWidth();
                          int rootH = ((View) videoContainer.getParent()).getHeight();
                          if (rootW <= 0 || rootH <= 0) return;

                          FrameLayout.LayoutParams containerParams = (FrameLayout.LayoutParams) videoContainer.getLayoutParams();
                          if (vpRotated || vpW <= 0 || vpH <= 0) {
                              containerParams.leftMargin = 0;
                              containerParams.topMargin = 0;
                              containerParams.width = rootW;
                              containerParams.height = rootH;
                          } else {
                              containerParams.leftMargin = vpX;
                              containerParams.topMargin = vpY;
                              containerParams.width = vpW;
                              containerParams.height = vpH;
                          }
                          videoContainer.setLayoutParams(containerParams);

                          int boxW = containerParams.width;
                          int boxH = containerParams.height;

                          FrameLayout.LayoutParams texParams = (FrameLayout.LayoutParams) textureView.getLayoutParams();
                          if (vpRotated) {
                              texParams.width = boxH;
                              texParams.height = boxW;
                              textureView.setRotation(90f);
                          } else {
                              texParams.width = boxW;
                              texParams.height = boxH;
                              textureView.setRotation(0f);
                          }
                          textureView.setLayoutParams(texParams);

                          float targetW = texParams.width;
                          float targetH = texParams.height;
                          if (targetW > 0 && targetH > 0 && videoWidth > 0 && videoHeight > 0) {
                              float videoAspect = (float) videoWidth / videoHeight;
                              float viewAspect = targetW / targetH;
                              float scaleX = 1f;
                              float scaleY = 1f;

                              if (videoAspect > viewAspect) {
                                  scaleY = viewAspect / videoAspect;
                              } else {
                                  scaleX = videoAspect / viewAspect;
                              }

                              Matrix matrix = new Matrix();
                              matrix.setScale(scaleX, scaleY, targetW / 2f, targetH / 2f);
                              textureView.setTransform(matrix);
                          }
                      }
                  });
              }

              private String hexToBase64Url(String hex) {
                  int len = hex.length();
                  byte[] data = new byte[len / 2];
                  for (int i = 0; i < len; i += 2) {
                      data[i / 2] = (byte) ((Character.digit(hex.charAt(i), 16) << 4)
                              + Character.digit(hex.charAt(i + 1), 16));
                  }
                  return Base64.encodeToString(data, Base64.URL_SAFE | Base64.NO_PADDING | Base64.NO_WRAP);
              }

              private class NativePlayerBridge {

                  @JavascriptInterface
                  public boolean isTelevision() {
                      UiModeManager uiModeManager = (UiModeManager) getSystemService(Context.UI_MODE_SERVICE);
                      return uiModeManager != null && uiModeManager.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION;
                  }

                  @JavascriptInterface
                  public void playStream(final String url, final String type, final String keyId, final String key) {
                      mainHandler.post(new Runnable() {
                          @Override
                          public void run() {
                              if (exoPlayer == null) return;
                              retryCount = 0;

                              exoPlayer.setTrackSelectionParameters(
                                      exoPlayer.getTrackSelectionParameters()
                                              .buildUpon()
                                              .clearVideoSizeConstraints()
                                              .build()
                              );

                              DefaultHttpDataSource.Factory dataSourceFactory = new DefaultHttpDataSource.Factory()
                                      .setUserAgent("Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36")
                                      .setAllowCrossProtocolRedirects(true)
                                      .setConnectTimeoutMs(8000)
                                      .setReadTimeoutMs(8000);

                              MediaItem mediaItem = MediaItem.fromUri(Uri.parse(url));
                              MediaSource mediaSource;

                              if ("mpd".equalsIgnoreCase(type)) {
                                  DashMediaSource.Factory dashFactory = new DashMediaSource.Factory(dataSourceFactory);
                                  if (keyId != null && !keyId.isEmpty() && key != null && !key.isEmpty()) {
                                      String kidB64 = hexToBase64Url(keyId);
                                      String keyB64 = hexToBase64Url(key);
                                      String clearKeyJson = "{\"keys\":[{\"kty\":\"oct\",\"k\":\"" + keyB64 + "\",\"kid\":\"" + kidB64 + "\"}],\"type\":\"temporary\"}";

                                      LocalMediaDrmCallback drmCallback = new LocalMediaDrmCallback(
                                              clearKeyJson.getBytes(StandardCharsets.UTF_8)
                                      );
                                      final DefaultDrmSessionManager drmManager = new DefaultDrmSessionManager.Builder()
                                              .setUuidAndExoMediaDrmProvider(C.CLEARKEY_UUID, FrameworkMediaDrm.DEFAULT_PROVIDER)
                                              .build(drmCallback);
                                      dashFactory.setDrmSessionManagerProvider(new DrmSessionManagerProvider() {
                                          @Override
                                          public DrmSessionManager get(MediaItem item) {
                                              return drmManager;
                                          }
                                      });
                                  }
                                  mediaSource = dashFactory.createMediaSource(mediaItem);
                              } else {
                                  mediaSource = new HlsMediaSource.Factory(dataSourceFactory)
                                          .setAllowChunklessPreparation(true)
                                          .createMediaSource(mediaItem);
                              }

                              exoPlayer.setMediaSource(mediaSource);
                              exoPlayer.prepare();
                              exoPlayer.play();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void setQuality(final int height) {
                      mainHandler.post(new Runnable() {
                          @Override
                          public void run() {
                              if (exoPlayer == null) return;
                              TrackSelectionParameters.Builder builder = exoPlayer.getTrackSelectionParameters().buildUpon();
                              if (height <= 0) {
                                  builder.clearVideoSizeConstraints();
                              } else {
                                  builder.setMaxVideoSize(Integer.MAX_VALUE, height + 16);
                              }
                              exoPlayer.setTrackSelectionParameters(builder.build());
                          }
                      });
                  }

                  @JavascriptInterface
                  public void setViewport(int x, int y, int width, int height, boolean rotated) {
                      vpX = x;
                      vpY = y;
                      vpW = width;
                      vpH = height;
                      vpRotated = rotated;
                      applyLayoutAndAspect();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (exoPlayer != null) {
                      exoPlayer.pause();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (exoPlayer != null) {
                      exoPlayer.seekToDefaultPosition();
                      exoPlayer.play();
                  }
                  applyLayoutAndAspect();
              }

              @Override
              public void onDestroy() {
                  if (exoPlayer != null) {
                      exoPlayer.release();
                      exoPlayer = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          # Configure Cordova WebView Transparency, GPU Acceleration & Splash
          sed -i 's/<content src="index.html" \/>/<content src="https:\/\/ystream.pages.dev\/" \/>\n    <preference name="BackgroundColor" value="0x00000000" \/>\n    <preference name="KeepRunning" value="true" \/>\n    <preference name="Fullscreen" value="false" \/>\n    <preference name="HardwareAcceleration" value="true" \/>\n    <icon src="www\/icon.png" \/>\n    <preference name="SplashScreen" value="screen" \/>\n    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="www\/icon.png" \/>\n    <preference name="AndroidWindowSplashScreenBackground" value="#0e1218" \/>\n    <preference name="SplashScreenDelay" value="1500" \/>\n    <preference name="ShowSplashScreenSpinner" value="false" \/>/g' config.xml

          sed -i 's/<application /<application android:hardwareAccelerated="true" android:largeHeap="true" android:usesCleartextTraffic="true" /g' platforms/android/app/src/main/AndroidManifest.xml

          cordova build android --debug

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: YStream-Clean-TV-APK
          path: ystream/platforms/android/app/build/outputs/apk/debug/*.apk
